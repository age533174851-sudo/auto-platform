# 실제 DB 스키마 확인.
#
# **파일에 정의가 있다는 것과 DB에 있다는 것은 다른 사실이다.**
#
# `check-table-drift.mjs`(ci)는 저장소 안의 파일만 본다. 코드가
# `.from('watchlists')`로 쓰고 `supabase/schema_v2.sql`에 정의가 있으면
# 통과한다 — 그런데 그 파일은 마이그레이션 파이프라인이 적용하지 않는다.
#
# 여기서는 **진짜 DB에 물어본다.** information_schema를 SELECT만 한다.
#
# 무엇을 하지 않는가
# ──────────────────
# CREATE · ALTER · DROP · INSERT · UPDATE · DELETE 를 하나도 보내지 않는다.
# psql 세션 자체를 `default_transaction_read_only=on`으로 연다.
#
# 값은 로그에 남지 않는다
# ───────────────────────
# 접속 문자열은 지문(6자)만 찍고, psql 오류 문구에서도 접속 정보를 지운다.
name: db-schema

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-db-schema.mjs'
      - 'supabase/**'
      - 'src/lib/supabase/hooks.ts'
      - 'src/lib/safety/auditStore.ts'
      - '.github/workflows/db-schema.yml'

  # 자동 머지 봇 커밋에는 push 워크플로가 발동하지 않는다 (migrate.yml과 같은 이유).
  workflow_run:
    workflows: [ci]
    types: [completed]

  # 아무도 손대지 않아도 스키마는 어긋날 수 있다 (대시보드에서 직접 바꾼 경우).
  schedule:
    - cron: '17 5 * * *'

  workflow_dispatch:

concurrency:
  group: db-schema
  cancel-in-progress: true

jobs:
  schema:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    name: 실제 DB 스키마 확인 (읽기 전용)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 없으면 스크립트가 UNVERIFIED로 멈춘다. **확인하지 못한 것은
      # 통과가 아니다** — "표가 없다"로 적지도 않는다.
      - name: DB 접속 정보 확인
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다 — 실제 DB 스키마를 확인할 수 없습니다"
            echo "값은 GitHub Secrets에만 넣습니다. 이 로그에는 출력하지 않습니다."
            exit 1
          fi
          echo "SUPABASE_DB_URL 존재 확인 (값은 출력하지 않습니다)"

      - name: 실제 DB 스키마 확인
        run: node scripts/check-db-schema.mjs
