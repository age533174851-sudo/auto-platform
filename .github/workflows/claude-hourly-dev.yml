# 무인 개발 — **일반 갈래** (거래 엔진이 아닌 모든 것)
#
# 왜 둘로 나눴는가
# ────────────────
# 계정 화면을 고치는 일과 청산 엔진을 고치는 일은 **틀리면 잃는 것이
# 다르다.** 전자는 화면이 어색해지고, 후자는 포지션이 방치된다.
# 같은 권한과 같은 검증으로 둘 다 하면, 검증을 거래 엔진에 맞추면
# 화면 작업이 느려지고 화면에 맞추면 엔진이 위험해진다.
#
# 그래서 갈래를 나눈다:
#   claude-hourly-dev      ← 여기. 거래 엔진 **밖**
#   claude-hourly-trading  ← 주문·Exact100X·청산·TESTNET. 검증이 더 세다
#
# 이 갈래가 거래 엔진 경로를 건드리면 `check-autodev-safety`가 막는다 —
# 프롬프트가 아니라 커밋된 결과를 보고 막는다.
name: Claude Hourly Dev

on:
  schedule:
    # 정시를 피한다 — 전 세계의 `0 * * * *`가 몰려 예약이 밀린다.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: '이번 회차 주제 (비우면 스스로 고른다)'
        required: false
        default: ''

concurrency:
  # **두 갈래가 같은 그룹이다.** 일반 갈래와 거래 갈래가 동시에 깨면
  # 같은 파일을 두 브랜치가 만지고, 변경 안전 관문이 서로의 변경을
  # 보게 된다. 예약 시각(:17 / :47)을 벌린 것만으로는 부족하다 —
  # 앞 회차가 길어지면 그대로 겹친다.
  #
  # 돌던 회차를 죽이면 만들던 브랜치가 반쯤 남으므로 끊지 않고 기다린다.
  group: claude-hourly-autodev
  cancel-in-progress: false

permissions:
  contents: write          # 브랜치·커밋
  pull-requests: write     # Draft PR
  issues: read             # 우선순위 판단에 읽기만
  actions: read            # **read만** — 다른 워크플로를 못 깨운다
  id-token: write

jobs:
  dev:
    # 예약은 저장소 변수로 명시적으로 켠다. 처음에는 수동 실행으로
    # 비용·동작을 보고, 확인한 뒤에 켠다.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLAUDE_HOURLY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 인증 확인
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OAUTH:-}" ] && [ -z "${APIKEY:-}" ]; then
            echo "::error::인증이 없습니다 — CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY 시크릿을 넣으세요"
            exit 1
          fi
          if [ -n "${OAUTH:-}" ]; then echo "인증: CLAUDE_CODE_OAUTH_TOKEN"; else echo "인증: ANTHROPIC_API_KEY"; fi

      # ── main 보호 규칙이 **확인되지 않으면 돌지 않는다** ──
      #
      # `contents: write`는 기술적으로 main push를 허용한다. 프롬프트의
      # "main 직접 수정 금지"는 약속이고, **보호 규칙이 관문**이다.
      # 관문이 있는지 모르는 채로 무인 회차를 돌리지 않는다.
      #
      # 기존 보호 규칙 또는 main에 적용되는 Ruleset을 확인하지 못하면
      # 예약·수동 실행 모두 차단한다. 우회 입력은 제공하지 않는다.
      - name: main 보호 규칙 확인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path):
              req = urllib.request.Request(api + '/repos/' + repo + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as res:
                      return res.status, json.load(res)
              except urllib.error.HTTPError as err:
                  return err.code, None

          status, protection = get('/branches/main/protection')
          if status == 200 and isinstance(protection, dict) and protection.get('required_pull_request_reviews') is not None:
              print('main: classic branch protection requires pull requests')
              sys.exit(0)

          # GitHub Rulesets are independent from classic branch protection.
          # Inspect effective rules for main, not all rulesets (which may target other branches).
          status, rules = get('/rules/branches/main')
          if status != 200 or not isinstance(rules, list):
              print('::error::Cannot verify effective main branch rules (HTTP %s); fail closed' % status)
              sys.exit(1)

          if any(isinstance(rule, dict) and rule.get('type') == 'pull_request' for rule in rules):
              print('main: effective ruleset requires pull requests')
              sys.exit(0)

          print('::error::No effective pull-request requirement for main; fail closed')
          sys.exit(1)
          PY

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      - name: 의존성 설치
        run: npm ci

      # 고치기 전 tsc 오류 수를 모르면 "내가 늘렸는지"를 말할 수 없다.
      - name: 기준선 측정
        id: baseline
        run: |
          set -uo pipefail
          n=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "tsc_before=${n}" >> "$GITHUB_OUTPUT"
          echo "tsc 기준선: ${n}건"

      # Metadata-only GET: no model generation and no provider response body logged.
      - name: Claude API 모델 메타데이터 사전 점검 (읽기 전용)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node --test scripts/test-claude-api-preflight.mjs
          node scripts/claude-api-preflight.mjs

      - name: Claude Code — 일반 개발
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          branch_prefix: 'claude/dev-'
          claude_args: |
            --max-turns 40
            --model claude-opus-5-5
            --allowedTools "Bash(npm ci),Bash(npm ci --prefix worker),Bash(npm test),Bash(npm run build),Bash(npm run worker:build),Bash(npx tsc --noEmit),Bash(node scripts/check-:*),Bash(git status),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh api repos/:*)"
            --disallowedTools "Bash(gh workflow run:*),Bash(gh pr merge:*),Bash(gh api --method POST:*),Bash(gh api -X POST:*),Bash(git push --force:*),Bash(git push origin main:*),Bash(curl:*),Bash(wget:*),Bash(psql:*),Bash(npx supabase:*),Bash(flyctl:*),Bash(vercel:*)"
          prompt: |
            TRAIGO 무인 개발 — **일반 갈래** 1회차.
            저장소: ${{ github.repository }}
            집중 주제: "${{ inputs.focus }}" (비면 스스로 고르세요)
            tsc 기준선: ${{ steps.baseline.outputs.tsc_before }}건

            ## 0. 먼저 읽습니다

            1. 루트 `CLAUDE.md` — **이 지시보다 우선합니다.**
            2. 최신 main의 최근 커밋.
            3. **열린 PR 전체와 각 PR이 바꾸는 파일**
               (`gh pr list --state open --json number,title,headRefName,files`).
            4. 열린 이슈 중 버그·미완성.

            ## 1. 중복을 피합니다 — 말이 아니라 파일로

            열린 PR이 이미 바꾸는 파일은 건드리지 않습니다. 고치려는
            문제가 이미 열린 PR에 있으면 버리고 다음 후보로 갑니다.

            ## 2. 이 갈래의 범위

            거래 엔진 **밖**의 모든 것입니다. 우선순위:

            1. 모의투자(페이퍼) 기능의 버그·미완성
            2. 사용자 계정·인증·설정 기능
            3. 금융 데이터 수집·분석
            4. 자동매매 **상태 표시**와 운영 화면 (판단 로직이 아니라 표시)
            5. UI/UX
            6. 기타

            **다음 경로는 이 갈래가 건드리지 않습니다** —
            `src/lib/engine/` · `src/lib/strategies/` · `src/lib/exchanges/` ·
            `src/lib/smoke/` · `src/lib/execution/` · `src/lib/risk/` ·
            `src/lib/backtest/` · `worker/` · `supabase/migrations/` ·
            `.github/workflows/`.
            그 수정이 필요하면 **고치지 말고**, 무엇이 왜 필요한지만
            적고 끝냅니다. 거래 엔진은 `claude-hourly-trading` 갈래가
            더 센 검증을 받고 합니다.

            ## 3. 순서

            원인을 먼저 특정합니다. 재현 테스트를 먼저 쓰고 RED를 확인한
            뒤 **최소한으로** 고치고 GREEN을 확인합니다. 원인을 모르면
            고치지 않습니다. 한 회차에 **문제 하나**입니다.

            ## 4. 검증 — 통과해야 PR을 엽니다

            `npm test` (0 실패) · `npx tsc --noEmit`(기준선 초과 금지) ·
            `npm run build` · 건드린 영역의 `scripts/check-*.mjs`.

            하나라도 실패하면 **PR을 열지 말고** 무엇이 왜 실패했는지
            적고 끝냅니다. 실패를 숨기지 않습니다.

            ## 5. 금지

            - main 직접 수정 금지. 새 브랜치 + **Draft** PR만.
            - PR 자동 병합 금지.
            - LIVE 주문·실거래 API 호출 금지.
            - 운영 DB 변경·마이그레이션 금지.
            - 다른 워크플로를 실행시키지 않습니다.
            - **기존 안전장치를 제거하지 않습니다.** 검사기가 막으면
              검사기가 옳다고 보고 원인을 다시 봅니다.
            - `NO_FIXED_SL`·`NO_FIXED_TP`·Exact100X 계약, 진입·청산 정책
              변경 금지.
            - 키·시크릿·토큰을 로그·코드·PR 본문에 적지 않습니다.
            - 변이 하네스가 도는 중에는 커밋하지 않습니다(`git status` 확인).

            ## 6. 고칠 것이 없으면 고치지 않습니다

            억지로 코드를 바꾸지 않습니다. 무엇을 봤고 왜 고칠 것이
            없었는지 적고 끝내는 것이 정상적인 회차입니다.

            ## 7. 보고

            고른 문제와 근거 · 원인 · 변경 파일 · 실제 실행한 검증 결과 ·
            브랜치/커밋 SHA · PR 번호 · 남은 위험. 테스트를 **작성한 것**과
            **실행한 것**을 구분합니다.

      # ── 결과를 한 번 더 본다 ──
      #
      # 프롬프트는 지시고 이것은 관문이다. 커밋된 변경에서 안전 닻이
      # 줄었거나, 울타리·마이그레이션·거래 엔진을 건드렸으면 실패한다.
      # ── 검증은 **워크플로가** 한다 ──
      #
      # 에이전트가 "돌렸고 통과했다"고 적는 것과 실제로 통과하는 것은
      # 다른 사실이다. 여기서 직접 돌리면 에이전트가 무엇을 적었든
      # 통과하지 못한 변경은 작업이 빨갛게 끝난다.
      - name: 검증 — 테스트 · 타입 · 빌드
        if: always()
        # **`${{ }}`를 셸 비교에 직접 넣지 않는다.** 식이 그대로 치환돼
        # `[ "3" -gt "" ]` 같은 모양이 될 수 있고, shellcheck가 SC2170으로
        # 막는다(실제로 CI가 여기서 실패했다). 환경변수로 넘기면 비어 있어도
        # 셸이 다루고, 식이 명령으로 번지는 길도 없다.
        env:
          TSC_BEFORE: ${{ steps.baseline.outputs.tsc_before }}
        run: |
          set -uo pipefail
          fail=0
          npm test || { echo "::error::npm test 실패"; fail=1; }
          after=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          base="${TSC_BEFORE:-0}"
          echo "tsc ${base} → ${after}"
          if [ "${after}" -gt "${base}" ]; then
            echo "::error::tsc 오류가 기준선(${base})보다 늘었습니다: ${after}"
            fail=1
          fi
          npm run build || { echo "::error::build 실패"; fail=1; }
          exit $fail

      - name: 변경 안전 관문
        if: always()
        run: |
          set -uo pipefail
          git fetch origin main --quiet || true
          node scripts/check-autodev-safety.mjs --base origin/main --mode dev

      - name: 실패 원인 기록
        if: failure()
        run: |
          {
            echo "## Claude Hourly Dev 회차 실패"
            echo ""
            echo "- 실행: ${{ github.run_id }} (시도 ${{ github.run_attempt }})"
            echo "- 트리거: ${{ github.event_name }}"
            echo "- tsc 기준선: ${{ steps.baseline.outputs.tsc_before }}건"
            echo ""
            echo "인증 단계에서 멈췄다면 시크릿이 없는 것입니다."
            echo "변경 안전 관문에서 멈췄다면 그 회차가 울타리를 넘은 것이므로"
            echo "브랜치를 병합하지 말고 내용을 먼저 보세요."
          } >> "$GITHUB_STEP_SUMMARY"
