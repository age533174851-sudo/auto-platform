# Fly.io Worker 배포.
#
# 무엇을 올리는가
# ───────────────
# **웹이 아니다.** TRAIGO 웹/API는 Vercel에서 계속 돌고, 이 워크플로가
# 올리는 것은 24시간 자동매매 Worker 하나다. 무엇이 올라갈지는 저장소
# 루트의 `fly.toml`과 `Dockerfile`이 정한다:
#
#   fly.toml     app = 'auto-platform' · primary_region = 'nrt'(Tokyo)
#                [processes] worker · restart policy = 'always'
#   Dockerfile   worker/만 빌드 → CMD npm start --prefix worker
#
# 그래서 여기서는 앱 이름을 다시 적지 않는다. `flyctl deploy`가 fly.toml을
# 읽는다. 이름을 워크플로에도 적으면 값이 두 곳에 생기고, 언젠가 한쪽만
# 바뀐다 — 그때는 **다른 앱에 배포된다.**
#
# 이 배포가 멈추면 같이 멈추는 것
# ───────────────────────────────
# 자동매매 진입·청산, 예약 청산, 손절 감시, 킬 스위치 자가복구.
# 그래서 아래 두 가지를 둔다:
#
#   · concurrency        배포 두 개가 겹치지 않게 한다. 겹치면 Machine이
#                        번갈아 교체되면서 그 사이 잡을 쥔 워커가 죽는다.
#   · cancel-in-progress: false
#                        **진행 중인 배포는 취소하지 않는다.** 반쯤 교체된
#                        상태로 멈추는 것이 조금 늦게 끝나는 것보다 나쁘다.
name: fly-deploy

on:
  # 손으로 돌릴 수 있어야 한다. 배포가 실패했거나 Machine을 새로 띄워야
  # 할 때, 코드를 안 고치고도 다시 돌릴 방법이 필요하다.
  workflow_dispatch:

  push:
    branches: [main]
  # ── 자동 머지로 들어온 커밋도 배포한다 ──
  #
  # **2026-08-13에 이것 때문에 하루를 잃었다.**
  #
  # GitHub은 `secrets.GITHUB_TOKEN`으로 만든 push에 워크플로를 발동시키지
  # 않는다(루프 방지). 자동 머지 봇이 합친 커밋이 정확히 그것이라, main이
  # 여러 번 바뀌는 동안 **fly-deploy는 한 번도 안 돌았다.** Fly에는
  # 8월 9일 버전이 그대로 떠 있었고, 워커의 예약 폴링 코드는 들어간 적이
  # 없었다. 그날 09:10~09:30 판단 창을 아무도 보지 않았다.
  #
  # `workflow_run`은 그 제약을 받지 않는다. main의 ci가 끝나면 여기가
  # 깨어난다. 아래 job이 `conclusion == 'success'`와 브랜치를 다시 확인한다
  # — 빨간 검사 위로 워커를 바꾸지 않는다.
  #
  # ⚠ **이것만으로는 부족했다 (2026-08-15에 다시 확인됨).**
  #
  # `workflow_run`은 ci가 끝났을 때 온다. 그런데 자동 머지가 합친 뒤
  # main에서는 **ci 자체가 안 돈다** — 같은 GITHUB_TOKEN 제약이다.
  # 그래서 여기 도착하는 `workflow_run`은 전부 PR 브랜치의 ci이고,
  # 아래 `head_branch == 'main'` 가드가 그걸 정확히 걸러 낸다.
  #
  #   fly-deploy 실행 기록: 4ca49bf(#128) skipped · 63a8a9c(#129) skipped ·
  #   마지막 실제 배포는 470d8db(#127)의 workflow_dispatch 하나뿐이었다.
  #
  # 실행은 남고 job은 항상 skipped라 **배포가 도는 것처럼 보였다.**
  # 진짜 신호는 `scripts/auto-merge.mjs`가 머지 직후 보내는
  # `workflow_dispatch`다(GITHUB_TOKEN 재귀 방지의 명시적 예외).
  # 이 트리거는 손으로 ci를 돌린 경우를 위해 남겨 둔다.
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run으로 들어왔으면 **성공한 main의 ci만** 받는다.
    # 다른 브랜치의 ci나 실패한 ci로 워커를 바꾸지 않는다.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    name: Fly Worker 배포
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # ── 토큰이 없으면 여기서 멈춘다 ──
      #
      # 없이 내려가면 flyctl이 "Not logged in"류의 메시지로 끝난다. 그
      # 문구를 보면 토큰이 없는 것인지 만료된 것인지 앱 권한이 없는 것인지
      # 알 수 없어, 결국 세 가지를 다 뒤지게 된다.
      #
      # **값은 출력하지 않는다.** 있는지 없는지만 본다.
      - name: FLY_API_TOKEN 확인
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN secret이 없습니다 — Settings → Secrets and variables → Actions 에 등록하세요"
            exit 1
          fi
          echo "FLY_API_TOKEN 존재 확인 (값은 출력하지 않습니다)"

      # ── DB가 코드를 따라왔는가 ──
      #
      # **코드만 앞서 나가면 조용히 틀린다.** 054가 없던 동안 워커는
      # 멀쩡히 돌면서 버전을 못 적었고, 화면은 '모름'을 계속 보여 줬다.
      # 새 워커가 요구하는 칸이 DB에 없으면 쓰기는 실패하는데 매매는
      # 계속된다 — 그래서 배포 전에 먼저 묻는다.
      #
      # 접속 정보가 아직 연결되지 않았으면(최초 1회 권한 연결) 경고만
      # 남기고 배포는 진행한다. 워커 배포를 막는 것이 더 위험하다.
      # 연결된 뒤부터는 남은 마이그레이션이 있으면 **배포를 멈춘다.**
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 마이그레이션 상태 확인
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_REPORT_PATH: ${{ github.workspace }}/migration-report.json
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::warning::SUPABASE_DB_URL이 없어 마이그레이션 상태를 확인하지 못했습니다 — 배포는 진행합니다"
            exit 0
          fi
          node scripts/apply-migrations.mjs --check || true
          CODE=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('migration-report.json','utf8')).code)}catch(e){console.log('UNKNOWN')}")
          echo "마이그레이션 상태: ${CODE}"
          case "${CODE}" in
            UP_TO_DATE) echo "DB가 코드를 따라와 있습니다" ;;
            NO_CREDENTIAL) echo "::warning::접속 정보 없음 — 확인하지 못했습니다" ;;
            *)
              echo "::error::마이그레이션이 끝나지 않았습니다 (${CODE}) — 이 상태로 워커를 바꾸지 않습니다"
              echo "migrate 워크플로가 먼저 끝나야 합니다. 승인이 필요한 변경이면 migration-report를 보세요."
              exit 1 ;;
          esac

      - name: flyctl 설치
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 배포 전에 무엇이 올라가는지 로그에 남긴다. 나중에 "언제부터
      # 이상해졌나"를 볼 때 이 줄이 기준이 된다.
      - name: 배포 대상 확인
        run: |
          flyctl version
          echo "── fly.toml (app / region / processes) ──"
          grep -E "^(app|primary_region)" fly.toml
          grep -A 2 "^\[processes\]" fly.toml

      # `--remote-only`: 이미지를 Fly의 빌더에서 만든다. 러너에 Docker
      # 데몬을 띄우지 않아도 되고, 빌드 캐시가 Fly 쪽에 남아 다음 배포가
      # 빨라진다.
      # `--build-arg GIT_SHA`: **이미지에 커밋을 새겨 넣는다.**
      # 워커가 이 값을 heartbeat에 적고, /api/system/deployment가
      # Vercel의 SHA와 나란히 보여 준다. 이게 없으면 "Fly에 무엇이 떠
      # 있는가"에 답할 방법이 없다 — 실제로 그래서 #128이 배포됐는지를
      # 아무도 확인하지 못했다.
      - name: flyctl deploy
        run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}

      # 배포가 끝났다고 워커가 도는 것은 아니다. 상태를 찍어 둔다.
      # (판정은 하지 않는다 — 이 워크플로는 배포까지가 책임이고,
      #  "정말 도는가"는 worker_heartbeat 표가 답한다.)
      - name: 배포 후 상태
        if: always()
        run: flyctl status || true

      # ── 떠 있는 것과 돌고 있는 것은 다르다 ──
      #
      # 2026-08-21에 이 워크플로가 success로 끝났고 `flyctl status`도
      # `started`를 찍었다. 그런데 워커의 heartbeat는 **27.6시간 전**
      # 것이었다 — 머신은 새 코드로 떠 있는데 프로세스가 DB에 한 줄도
      # 못 쓰고 있었다. 그 상태에서는 청산 감시·원장 수집·자산 스냅샷·
      # 예약 평가가 전부 멈춘다. **그런데 배포 로그는 초록이다.**
      #
      # **판정을 YAML에 적지 않는다.**
      #
      # 처음에는 이 확인을 `run: |` 안의 여러 줄짜리 `python3 -c`로
      # 넣었다. 그 줄들이 블록 스칼라의 들여쓰기를 벗어나 `try:`와
      # `except Exception:`이 이 파일의 **최상위 키**가 됐고, GitHub은
      # 파일을 Startup failure로 거절했다 — fly-deploy가 아예 실행되지
      # 않았고 `workflow_dispatch`는 HTTP 422를 돌려줬다. 배포 자체가
      # 멈춘 것이다.
      #
      # 그래서 여기에는 부르는 한 줄만 둔다. 들여쓰기로 깨질 것이 없고,
      # 판정에는 테스트가 붙어 있다(`src/lib/ops/workerAlive.ts`).
      - name: 워커가 실제로 살아났는가
        id: alive
        if: success()
        env:
          BASE: ${{ secrets.EXIT_MONITOR_URL }}
        run: node scripts/wait-worker-alive.mjs

      # ── 왜 조용한지를 사람이 Fly를 열어 찾지 않게 한다 ──
      #
      # 앞 단계가 실패하면 예전에는 여기서 끝났다. 남는 것은
      # "워커가 한 줄도 쓰지 않았습니다"와 **추측한 원인 한 줄**뿐이었고,
      # 그 다음은 사람이 `fly logs`를 여는 일이었다.
      #
      # 이 워크플로에는 이미 FLY_API_TOKEN이 있다. 사람이 볼 수 있는
      # 것은 여기서도 볼 수 있다 — 그러면 사람이 볼 이유가 없다.
      #
      #   flyctl status         머신 상태
      #   flyctl secrets list   **이름만.** 값은 flyctl도 주지 않는다
      #   flyctl logs           워커가 스스로 남긴 이유
      #
      # 판정은 `src/lib/ops/workerDiagnosis.ts`에 있고 테스트가 붙어 있다
      # (#174에서 배운 대로 판정을 YAML에 적지 않는다).
      #
      # `continue-on-error`: 진단이 배포 결과를 바꾸지 않는다. 앞 단계가
      # 이미 실패로 적었고, 여기는 **왜인지를 덧붙이는 자리**다.
      - name: 워커가 왜 조용한가 (진단)
        if: failure() && steps.alive.conclusion == 'failure'
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BASE: ${{ secrets.EXIT_MONITOR_URL }}
        run: node scripts/diagnose-worker.mjs
