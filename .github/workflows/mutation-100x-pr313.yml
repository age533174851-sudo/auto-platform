# Exact100X 변이 전체 병렬 실측 (PR 검증용).
# 시크릿·거래소·운영 DB 접근 없음. 기존 수동 전수 워크플로와 독립적이다.
#
# ── PR 번호를 박으면 썩는다 ──
#
#   처음에는 `if: github.event.pull_request.number == 313`이었다. 그래서
#   #313이 머지된 뒤 올린 **#315에서는 전부 skipped**였고, 그 PR은 전수
#   457건 없이 초록으로 보였다. 안전망이 "실패"한 게 아니라 **돌지 않았다** —
#   그리고 skipped는 초록처럼 보인다.
#
#   그래서 번호가 아니라 **무엇이 바뀌었는가**로 건다. 하네스가 변이시키는
#   파일이 바뀌면 돈다. 넓게 잡는 쪽이 안전한 방향이다.
#
#   파일 이름(`-pr313`)은 그대로 둔다. `name:`을 바꾸면 체크 이름이 바뀌어
#   필수 상태 검사 설정과 어긋날 수 있고, 그 설정을 여기서 확인할 수 없다.
#   이름이 사실과 다른 것은 기술 부채로 남긴다.
name: mutation-100x-pr313
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'worker/src/**'
      - 'scripts/check-100x-*.mjs'
      - 'scripts/*mutations.mjs'
      - 'scripts/run-tests.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/mutation-100x-pr313.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: mutation-100x-pr313-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  shard:
    name: 100X 전수 변이 shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # ── 기준 커밋은 **job 수준**에서 넘긴다 ──
    #
    #   변이 하네스는 매 변이마다 게이트를 다시 돌리고, 그 안에
    #   check-execution-profile.mjs가 있다. 그 검사기는 PR·push 이벤트에서
    #   EXECUTION_CONTRACT_BASE가 비면 **실패한다** — 비었을 때 origin/main으로
    #   조용히 후퇴하면 "자기 자신과 비교"가 되어 버전 검사가 꺼지기 때문이다.
    #
    #   ci.yml은 이 값을 넘기는데 이 워크플로는 넘기지 않아서, 8개 샤드가
    #   전부 **기준선 단계에서 멈췄다**(runs/38065897023). 457건이 실패한 게
    #   아니라 시작조차 못 한 것이다.
    #
    #   step마다 적지 않고 job 수준에 두는 이유: 자기 점검 step과 전수 step이
    #   같은 값을 봐야 하고, 둘 중 한쪽만 고치는 것이 이 저장소의 상습 고장이다.
    env:
      EXECUTION_CONTRACT_BASE: ${{ github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 원본·하네스·트리 확인
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          node scripts/check-100x-mutations.mjs --self-test
      - name: 전수 샤드 실행
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/shard-$SHARD.log"
          printf 'TARGET_SHA=%s\nSHARD=%s/8\n' "$(git rev-parse HEAD)" "$SHARD" > "$LOG"
          node scripts/check-100x-mutations.mjs --shard-index "$SHARD" --shard-count 8 2>&1 | tee -a "$LOG"
      - name: 완료 후 작업 트리 복원 확인
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
      - name: 실행 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-100x-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.log
          retention-days: 30
          if-no-files-found: error

  aggregate:
    name: 100X 전수 합산 · 누락 0 증명
    needs: [shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-100x-shard-*
          path: mutation-evidence
      - name: 샤드 8개·전체 수·누락·대조군 집계
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          base = pathlib.Path('mutation-evidence')
          results = []
          errors = []
          for i in range(8):
              f = base / f'mutation-100x-shard-{i}' / f'shard-{i}.log'
              if not f.is_file():
                  errors.append(f'{i}: evidence missing')
                  continue
              s = f.read_text(errors='replace')
              if f'TARGET_SHA={os.environ["TARGET_SHA"]}' not in s:
                  errors.append(f'{i}: target SHA mismatch')
              if f'SHARD={i}/8' not in s or f'SHARD {i}/8;' not in s:
                  errors.append(f'{i}: shard scope missing')
              match = re.search(r'검출 (\d+) / 누락 (\d+) / 동치 (\d+) / 판정불가 (\d+)\s*/ 대조군 PASS (\d+) · 과도검출 (\d+)', s)
              total = re.search(r'총 (\d+)건 · [\d.]+분 · 트리 clean 확인됨', s)
              if not match or not total:
                  errors.append(f'{i}: final summary missing')
                  continue
              vals = [int(v) for v in match.groups()]
              count = int(total.group(1))
              if vals[1] or vals[3] or vals[5]:
                  errors.append(f'{i}: missed/noop/false-positive {vals}')
              # NOOP-EXPECTED 대조군은 의도적으로 파일이 안 바뀌며
              # 하네스의 검출/동치/대조군 PASS 카운터에는 들어가지 않는다.
              expected_noops = s.count('— 적용 안 됨(의도대로)')
              if vals[0]+vals[2]+vals[4]+expected_noops!=count:
                  errors.append(f'{i}: coverage mismatch count={count}, counters={vals}, expected_noop={expected_noops}')
              # ── 전수 건수를 여기에 적지 않는다 ──
              #
              #   예전에는 `if total_count != 457`이었다. 그래서 하네스에
              #   변이를 **더 넣은** PR이 빨개졌다(#317이 HX1~HX27을 넣어
              #   484가 되자 샤드 8개는 전부 통과했는데 합산만 실패했다).
              #   숫자가 두 곳에 있으면 언젠가 갈린다 — 이 저장소의 상습 고장이다.
              #
              #   그래서 목록 길이는 **하네스가 적은 것을 읽는다.** 샤드 로그의
              #   `전체 N건 중 부분 실행`이 그 값이다. 숫자를 맞추는 일이
              #   사람 손에서 사라진다.
              cat = re.search(r'전체 (\d+)건 중 부분 실행', s)
              if not cat:
                  errors.append(f'{i}: catalog size missing')
                  continue
              # 목록 길이를 하네스에서 읽으므로, `--only`로 목록을 **줄여 놓고**
              # 그 줄어든 수와 맞추는 것도 통과해 버린다. 하네스는 일부만 돌면
              # 요약에 `--only`를 적는다 — 그것이 보이면 전수가 아니다.
              if '--only' in s:
                  errors.append(f'{i}: partial run (--only) is not a full sweep')
              results.append((i,count,vals,int(cat.group(1))))
          total_count = sum(x[1] for x in results)
          # 샤드 8개가 **같은 목록**을 보고 나눠 돌았는가. 하나라도 다르면
          # 합계가 맞아떨어져도 같은 전수를 돈 것이 아니다.
          catalogs = sorted({x[3] for x in results})
          catalog = catalogs[0] if len(catalogs) == 1 else None
          if catalog is None:
              errors.append(f'shards disagree on catalog size: {catalogs}')
          elif total_count != catalog:
              errors.append(f'expected {catalog} unique mutations (harness catalog), observed {total_count}')
          if os.environ['SHARD_RESULT'] != 'success':
              errors.append(f'shard jobs outcome: {os.environ["SHARD_RESULT"]}')
          for i,n,v,c in results:
              print(f'SHARD {i}: total {n}, detected {v[0]}, equiv {v[2]}, control {v[4]}, miss {v[1]}, noop {v[3]}, overdetect {v[5]}, catalog {c}')
          print(f'ALL SHARDS: {len(results)}/8, TOTAL {total_count}/{catalog if catalog is not None else catalogs}, TARGET_SHA={os.environ["TARGET_SHA"]}')
          if errors:
              for e in errors: print('FAIL:', e, file=sys.stderr)
              sys.exit(1)
          print(f'PASS: {catalog} complete, miss 0, undecidable 0, overdetect 0, complete clean evidence')
          PY
