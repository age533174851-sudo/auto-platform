# 마이그레이션 자동 적용.
#
# **사람이 Supabase SQL 편집기를 여는 일을 없앤다.**
#
# 지금까지는 이랬다: 마이그레이션 파일을 커밋하고, 머지하고, 그 다음
# 누군가가 기억해서 Supabase 대시보드에 붙여 넣었다. 기억이 빠지면
# 코드만 앞서 나갔고 — 054(워커 버전), 055(중지), 056(장부)이 전부
# 그렇게 며칠씩 반쪽으로 돌았다. **그리고 그걸 알아채는 유일한 방법이
# 사람의 기억이었다.**
#
# 무엇이 자동이고 무엇이 아닌가
# ─────────────────────────────
#   자동   표·칸·인덱스·정책·제약을 **더하는** 마이그레이션
#   승인   DROP TABLE · DROP COLUMN · 타입 변경 · 조건 없는 DELETE/UPDATE
#
# 판정은 `src/lib/system/migrationPlan.ts`에 있고 테스트가 붙어 있다.
# **모르는 문장은 자동으로 실행하지 않는다** — '아마 괜찮겠지'가 데이터를
# 지운다.
#
# 값은 로그에 남지 않는다
# ───────────────────────
# 접속 문자열은 지문(6자)만 찍는다. psql의 오류 문구에서도 접속 정보를
# 지우고 출력한다(apply-migrations.mjs의 scrub).
name: migrate

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/apply-migrations.mjs'
      - 'src/lib/system/migrationPlan.ts'
      - '.github/workflows/migrate.yml'

  # 자동 머지 봇이 만든 커밋에는 push 워크플로가 발동하지 않는다
  # (GITHUB_TOKEN 재귀 방지). fly-deploy가 겪은 것과 같은 문제라
  # 같은 해법을 쓴다 — ci가 끝나면 여기가 깨어난다.
  workflow_run:
    workflows: [ci]
    types: [completed]

  # ── 위험한 마이그레이션을 사람이 승인해서 적용하는 자리 ──
  #
  # 입력 없이 손으로 돌리면 지금까지와 똑같다 — 위험한 것은 그대로 막힌다.
  # 세 값을 **전부** 채웠을 때만 승인 경로가 열린다.
  #
  # 왜 세 개인가
  #   approve_migration  무엇을      — 이름 하나. 목록에 없거나 막혀 있지 않으면 거부
  #   expected_sha       어느 내용을 — 지금 도는 커밋과 다르면 DB에 닿기 전에 멈춘다
  #   confirm            정말인가    — 드롭다운을 잘못 누른 것과 구별한다
  workflow_dispatch:
    inputs:
      approve_migration:
        description: '승인할 위험 마이그레이션 파일명 하나 (예: 085_paper_challenge_accounting.sql). 비우면 지금까지와 동일하게 위험한 것은 적용하지 않습니다'
        required: false
        type: string
      expected_sha:
        description: '승인하려는 main의 40자 커밋 SHA. 이 실행이 체크아웃한 커밋과 다르면 적용하지 않습니다'
        required: false
        type: string
      confirm:
        description: '승인할 때만 APPLY_DESTRUCTIVE 를 정확히 입력'
        required: false
        type: string

# 두 배포가 같은 순간에 같은 파일을 적용하지 않게 한다.
# (DB 쪽에도 잠금 표가 따로 있다 — 이건 한 겹 더 두는 것이다.)
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    name: 마이그레이션 적용
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIGRATION_REPORT_PATH: ${{ github.workspace }}/migration-report.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # migrationPlan.ts를 프로젝트 tsc로 컴파일해서 쓴다 — 판정 로직을
      # 스크립트에 복제하지 않는다. 복제하면 언젠가 한쪽만 고쳐진다.
      - name: 의존성 설치
        run: npm ci

      # ── 접속 정보가 없으면 여기서 멈춘다 ──
      #
      # 없이 내려가면 "적용할 것 없음"처럼 끝난다. **확인하지 못한 것은
      # 통과가 아니다.** 값은 출력하지 않고 있는지만 본다.
      - name: DB 접속 정보 확인
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다 — 마이그레이션을 자동 적용할 수 없습니다"
            echo "Supabase → Project Settings → Database → Connection string (URI, session pooler)"
            echo "값은 GitHub Secrets에만 넣습니다. 이 로그에는 출력하지 않습니다."
            exit 1
          fi
          echo "SUPABASE_DB_URL 존재 확인 (값은 출력하지 않습니다)"

      # ── 승인 입력 검사 — **DB에 닿기 전에 끝낸다** ──
      #
      # 여기서 걸러야 잘못된 승인이 잠금을 잡고 들어가지 않는다.
      # 셋 다 비어 있으면 승인이 아니다 — 아무 말 없이 평소 경로로 간다.
      - name: 승인 입력 확인
        id: approval
        env:
          IN_FILE: ${{ inputs.approve_migration }}
          IN_SHA: ${{ inputs.expected_sha }}
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          f="${IN_FILE:-}"; sha="${IN_SHA:-}"; cf="${IN_CONFIRM:-}"

          if [ -z "$f" ] && [ -z "$sha" ] && [ -z "$cf" ]; then
            echo "승인 입력 없음 — 평소대로 안전한 것만 적용합니다"
            echo "approve=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 하나만 채운 것은 실수다. **부분 승인을 승인으로 읽지 않는다.**
          if [ -z "$f" ] || [ -z "$sha" ] || [ -z "$cf" ]; then
            echo "::error::승인하려면 approve_migration · expected_sha · confirm 을 모두 채워야 합니다"
            exit 1
          fi

          # 승인은 main에서만. 다른 ref에서 돌리면 그 파일 내용이 main과 다르다.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::승인 적용은 main에서만 합니다 (지금 ref: ${GITHUB_REF})"
            exit 1
          fi

          if [ "$cf" != "APPLY_DESTRUCTIVE" ]; then
            echo "::error::confirm 값이 APPLY_DESTRUCTIVE 와 정확히 같아야 합니다"
            exit 1
          fi

          # **승인한 커밋과 지금 체크아웃한 커밋이 같은가.** 다르면 그 사이
          # 파일이 바뀌었을 수 있고, 그때 옛 승인은 무효다.
          if [ "$sha" != "${GITHUB_SHA}" ]; then
            echo "::error::승인 커밋과 이 실행의 커밋이 다릅니다 — 승인: ${sha} / 실행: ${GITHUB_SHA}"
            exit 1
          fi

          echo "승인 입력 통과: ${f} @ ${sha}"
          echo "approve=${f}" >> "$GITHUB_OUTPUT"
          {
            echo "## 위험 마이그레이션 승인 적용"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 대상 | \`${f}\` |"
            echo "| 승인 커밋 | \`${sha}\` |"
            echo "| 실행자 | ${GITHUB_ACTOR} |"
            echo "| 경로 | workflow_dispatch (수동 승인) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 적용 계획
        run: node scripts/apply-migrations.mjs --check || true

      # 승인 입력이 없으면 인자가 붙지 않는다 — 지금까지와 **완전히 같은 명령**이다.
      - name: 적용
        id: apply
        env:
          APPROVE: ${{ steps.approval.outputs.approve }}
        run: |
          set -euo pipefail
          if [ -n "${APPROVE:-}" ]; then
            node scripts/apply-migrations.mjs --apply \
              --approve-destructive="${APPROVE}" \
              --approve-sha="${GITHUB_SHA}"
          else
            node scripts/apply-migrations.mjs --apply
          fi

      # 실패했든 성공했든 무엇을 했는지 남긴다. 이 파일이 "배포는 됐는데
      # 마이그레이션은 어떻게 됐나"의 답이다.
      - name: 결과 기록
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: migration-report.json
          if-no-files-found: ignore

      - name: 요약
        if: always()
        run: |
          if [ -f migration-report.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('migration-report.json','utf8'));
              const L = [];
              L.push('## 마이그레이션 ' + r.code);
              L.push('');
              L.push(r.reason);
              L.push('');
              L.push('| 항목 | 수 |');
              L.push('|---|---|');
              L.push('| 필요 | ' + r.required + ' |');
              L.push('| 적용됨 | ' + r.applied.length + ' |');
              L.push('| 이번에 적용 | ' + r.verified.length + ' |');
              L.push('| 기존 채택(실행 안 함) | ' + r.adopted.length + ' |');
              L.push('| 남음 | ' + r.pending.length + ' |');
              L.push('| 승인 필요 | ' + r.blocked.length + ' |');
              if (r.blocked.length) {
                L.push('');
                L.push('### 자동으로 실행하지 않은 것');
                for (const b of r.blocked) L.push('- **' + b.name + '** (' + b.risk + ') — ' + b.reasons.join(' · '));
              }
              if (r.failed.length) {
                L.push('');
                L.push('### 실패');
                for (const f of r.failed) L.push('- **' + f.name + '** — ' + f.error);
              }
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join('\n') + '\n');
            "
          fi
