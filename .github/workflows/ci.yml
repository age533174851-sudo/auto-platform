# PR에서 테스트·빌드를 돌린다.
#
# 왜 필요한가
# ───────────
# 유닛 테스트가 1100개 넘게 있는데 **PR에서 한 번도 안 돌고 있었다.**
# 저장소의 워크플로 셋(exit-monitor·news-pipeline·watch-tick)은 전부
# cron이고, 코드 변경을 검사하는 것은 하나도 없었다.
#
# 그동안 "테스트 통과"는 누군가 자기 컴퓨터에서 돌린 결과였고, GitHub에는
# 그 근거가 남지 않았다. 즉 무언가 깨져도 PR은 초록으로 보였다.
#
# 타입 에러를 왜 '개수'로 재는가
# ──────────────────────────────
# 이 저장소는 타입 에러 80건을 안고 있고 `ignoreBuildErrors`로 덮여 있다.
# 지금 0으로 만드는 것은 별개의 큰 작업이라 여기서 할 수 없다.
#
# 그렇다고 검사를 빼면 **81번째 에러가 조용히 들어온다.** 그래서 개수를
# 세서 기준보다 늘면 실패시킨다. 줄이는 것은 언제나 환영이고, 그때는
# BASELINE을 같이 내리면 된다.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # **손으로도 돌릴 수 있어야 한다.**
  #
  # 한 번 이런 일이 있었다: PR을 열었는데 Actions가 이 저장소에서
  # 아예 안 돌았다. 큐에 걸린 것도 실패한 것도 아니고 실행 자체가
  # 생성되지 않았다(같은 커밋에서 Vercel 체크는 정상이었다).
  #
  # 그때 재실행을 걸 방법이 **없었다.** 없는 실행은 rerun할 수 없고,
  # 이 파일에 workflow_dispatch가 없어서 수동 실행도 안 됐다. 남은
  # 방법은 빈 커밋을 밀어 보는 것뿐이었고 그것도 안 들었다.
  #
  # 검사를 못 돌리면 "테스트 통과"는 다시 누군가 자기 컴퓨터에서 돌린
  # 결과가 된다 — 이 워크플로가 없애려던 바로 그 상태다.
  workflow_dispatch:

# 같은 브랜치에 새로 푸시하면 이전 실행을 취소한다. 이미 지나간 커밋을
# 검사하느라 지금 커밋의 결과가 늦어지면 안 된다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 빌드에 실제 키가 필요하지는 않다(없으면 각 기능이 503으로 그 사실을
      # 알린다). 다만 Next가 빌드 중에 이 값을 읽으므로 자리만 채운다.
      NEXT_TELEMETRY_DISABLED: '1'
      # 타입 에러 기준선. 줄였으면 이 숫자도 같이 내린다.
      # **기준선은 실제 개수와 같아야 한다.**
      # 80으로 두면 지금(74)에서 새 오류 6개가 들어와도 통과한다.
      # 줄어들 때마다 같이 내린다 — 아래 단계가 그걸 알려 준다.
      TS_ERROR_BASELINE: '73'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package-lock.json 그대로 설치한다. `npm install`은 잠금 파일을
      # 고쳐서, CI가 개발자 컴퓨터와 다른 의존성으로 통과할 수 있다.
      - name: 의존성 설치
        run: npm ci

      # 이 저장소의 하네스는 src를 node_modules 없이 컴파일해 돌린다.
      # 그래서 테스트 대상 모듈은 상대 경로 import만 쓴다 (scripts/run-tests.mjs 참조).
      - name: 유닛 테스트
        run: npm test

      # ── 워커 빌드 ──
      #
      # 워커는 루트 tsconfig 밖에 있다. 그래서 `npx tsc --noEmit`도,
      # `next build`도 워커를 컴파일하지 않는다 — **워커가 깨져도 CI는
      # 초록이었다.**
      #
      # 지금은 워커가 웹과 **같은 거래소 모듈**을 컴파일한다
      # (`src/lib/exchanges/futuresExec.ts` 등). 즉 이 단계는 두 가지를
      # 동시에 지킨다: 워커가 빌드되는가, 그리고 공유 모듈이 워커의
      # strict 설정에서도 통과하는가.
      - name: 워커 빌드 (웹과 같은 거래소 모듈을 컴파일한다)
        run: |
          npm ci --prefix worker
          npm run worker:build

      # ── 죽은 메뉴 항목 ──
      #
      # 더보기에서 눌러도 화면이 안 바뀌는 회귀가 한 번 있었다. MENU에
      # id는 있는데 그 id를 받는 화면 분기가 없으면 setTab은 성공하고
      # 렌더는 아무것도 안 그린다 — 사용자에게는 버튼이 고장 난 것으로
      # 보인다. id가 그냥 문자열이라 타입으로는 안 잡힌다.
      - name: 메뉴 배선 검사
        run: node scripts/check-nav.mjs

      # ── 만들어 놓고 안 부르는 판정 ──
      #
      # 이 저장소에서 가장 자주 난 고장이다. conviction.ts는 판정 넷을
      # 만들고 테스트까지 붙였는데 부르는 곳이 0곳이었고, sleeveGate가
      # 안 불려서 낙폭 정지가 한 번도 안 걸렸다.
      #
      # 판정을 만들어 놓고 안 부르면 그 검사는 켜져 있는 것처럼 보이면서
      # 아무것도 안 한다 — 테스트는 초록이고 화면에는 영향이 없다.
      - name: 판정 모듈 배선 검사
        run: node scripts/check-wiring.mjs

      # ── 상시 실행 검사 ──
      #
      # 화면 안의 setInterval이 '실행'인지 '새로고침'인지 적게 한다.
      # 브라우저가 살아 있어야만 동작하는 것을 '상시 실행'이라고 부르면
      # 안 된다 — 사용자는 앱을 닫아도 된다는 뜻으로 읽는다.
      - name: 화면 타이머 분류 검사
        run: node scripts/check-runtime.mjs

      # ── 주문 경로 안전장치 검사 ──
      #
      # 킬 스위치가 일곱 주문 경로 중 둘에서만 돌고 있었다. 화면에는
      # '발동 중'이 떠 있는데 COIN-M도 현물도 주식도 계속 주문을 냈다.
      #
      # 반쯤 걸린 안전장치는 없는 것보다 나쁘다 — 없으면 사용자가 직접
      # 닫지만, 절반만 걸려 있으면 다 멈춘 줄 알고 화면을 닫는다.
      - name: 주문 경로 안전장치 검사
        run: node scripts/check-order-guards.mjs

      # ── 전략 점검 플래그 검사 ──
      #
      # 레지스트리는 scalp의 점검 플래그를 `checkOnly`로 선언했고 화면은
      # 그 이름으로 보냈는데, 라우트는 `dryRun`만 읽었다. 그래서 **점검
      # 요청이 주문 경로까지 갈 수 있었다** — 사용자는 "주문은 안 냅니다"라고
      # 적힌 버튼을 누른다.
      #
      # 타입은 이걸 못 잡는다. 두 곳 다 any 본문이고 이름은 문자열이다.
      - name: 전략 점검 플래그 검사
        run: node scripts/check-strategy-flags.mjs

      # ── 거래소 주문 번호 검사 ──
      #
      # 2026-08-16: Gate 조건부 주문 번호가 `2089209928026685400`으로
      # 저장돼 있었다. 끝이 `400`으로 뭉개진 것이 지문이다 —
      # Number.MAX_SAFE_INTEGER(9007199254740991)를 300배 넘게 벗어나
      # `JSON.parse`가 만든 순간 마지막 자릿수가 반올림됐다. 그 번호로
      # 보낸 취소는 전부 `400 No order found with the given ID`였고,
      # 포지션 0인데 보호주문 2건이 남았다.
      #
      # **타입은 이걸 못 잡는다.** 응답은 any이고 번호는 그냥 숫자다.
      # 그리고 다음 사람이 `await r.json()` 한 줄만 새로 써도 돌아온다.
      - name: 거래소 주문 번호 검사
        run: node scripts/check-venue-ids.mjs

      # ── 마이그레이션 배선 검사 ──
      #
      # **파일은 커밋됐는데 아무도 적용하지 않은 상태**가 이 저장소의
      # 단골 사고였다. 054가 빠져 워커 버전이 영영 '모름'이었고, 055 없이
      # 중지가 반쪽으로 돌았고, 056 없이 장부 writer가 조용히 TABLE_MISSING만
      # 남겼다. 셋 다 코드는 맞고 DB만 뒤처진 상태였다.
      #
      # 이제 적용은 migrate 워크플로가 자동으로 한다. 여기서는 **자동
      # 파이프라인이 그 파일을 알고 있는가**만 본다 — 번호가 없거나
      # 목록(migrationManifest.ts)이 낡았으면 실패한다.
      - name: 마이그레이션 배선 검사
        run: node scripts/check-migrations.mjs

      # ── DB 칸 이름 검사 ──
      #
      # **테스트 4천 개가 초록이어도 칸 이름 하나가 틀리면 안전하지 않다.**
      # `/api/ledger/sync`가 `exchange_connections.exchange`를 읽었다.
      # 그 칸은 없다 — 실제 이름은 `exchange_id`다. 그런데 조회 오류를
      # 안 받았으므로 **연결 0개로 조용히 끝났다.** 기능은 있고, 테스트는
      # 통과하고, 실제로는 한 건도 수집하지 않는 상태였다.
      # 타입은 이걸 못 잡는다 — 응답이 any이고 칸 이름은 문자열이다.
      - name: DB 칸 이름 검사
        run: node scripts/check-db-columns.mjs
      # ── 진입 관문 검사 ──
      # **경로가 셋인데 하나만 고쳐져 있었다.**
      # `symbolOwnershipConflict`는 만들어진 뒤 `my-original-v1` 한 곳에서만
      # 쓰였다. `daily-ladder`와 `scalp`는 같은 계좌·같은 종목에 그대로
      # 들어갈 수 있었고, ONE_WAY 계좌에서 그건 한쪽의 손절이 다른 쪽
      # 진입에 발동한다는 뜻이다.
      # 타입은 이걸 못 잡는다. 관문을 안 부르는 것은 문법적으로 멀쩡하다.
      - name: 진입 관문 검사
        run: node scripts/check-entry-gates.mjs
      # ── 연구/실행 분리 검사 ──
      #
      # `edgePp`는 몬테카를로에서 승률을 임의로 올려 넣는 **가정값**이다.
      # 무우위 승률 33%에 +10%p를 넣으면 43%라고 치고 돌린다 — 결과가
      # 좋아지는 건 전략의 성질이 아니라 산수의 성질이다.
      # 지금은 실행 경로가 이 값을 읽지 않는다. 이 검사는 앞으로도 그렇게
      # 두기 위한 것이다. 그리고 **연구가 깨져도 실제 매매는 계속 돌아야
      # 한다** — 실행이 연구 모듈을 import 하는 것 자체를 막는다.
      - name: 연구/실행 분리 검사
        run: node scripts/check-research-isolation.mjs
      # ── 브라우저 주문 권한 검사 ──
      # `AutoTradeEngine.tsx`가 60초 타이머로 전략을 평가하고 실제 주문을
      # 냈다. 전략 목록은 localStorage에 있었고, 워커가 지키는 관문
      # (마이그레이션·청산감시·지문·소유권·킬스위치)을 **하나도 지나지
      # 않았다.** 워커와 별개인 두 번째 실행 권한이었다.
      # 사람이 누르는 주문과는 다르다 — 그건 보고 있고 한 번이지만,
      # 타이머는 아무도 안 볼 때 반복해서 낸다.
      - name: 브라우저 주문 권한 검사
        run: node scripts/check-browser-orders.mjs

      # ── GET이 쓰는 경로 ──
      #
      # `/api/wallets/overview`는 GET인데 자산 스냅샷을 INSERT했다.
      # 그래서 자산 곡선은 **사람이 앱을 여는 시간에만** 남았고, 탭을
      # 두 개 열면 같은 순간이 두 번 찍혔다("마지막에서 15분" 판정은
      # 동시 요청 둘을 다 통과시킨다).
      #
      # 지우는 검사가 아니라 **늘어나는 것을 막는 검사**다. 이미
      # 스케줄러가 GET으로 깨우는 경로는 이유와 함께 면제돼 있다.
      - name: GET 라우트가 DB에 쓰지 않는지
        run: node scripts/check-get-writes.mjs

      # ── 서버가 Supabase에 붙는 문은 하나인가 ──
      #
      # 2026-08-24 Production에서 서버의 GET이 캐시에 굳어 **사흘 전 값**을
      # 돌려주고 있었다(cacheProbe.code = FETCH_CACHE_STALE). 고친 자리는
      # `getSupabaseAdmin()` 한 곳이다 — 거기서 읽기에만 no-store를 문다.
      #
      # 그 문을 우회해 자기 client를 만드는 코드가 생기면 같은 고장이
      # 그 자리에서 되살아나고, **오류가 아니라 오래된 값**이라 조용하다.
      # 킬스위치 상태·포지션·주문을 낡게 읽으면 판단이 통째로 틀린다.
      - name: 서버 Supabase client 단일 문
        run: node scripts/check-admin-client.mjs

      # ── 테스트 등록 검사 ──
      #
      # 재배치 충돌을 기계적으로 해소하다 `run-tests.mjs`의 등록 줄이
      # 두 번 남았다. 같은 테스트가 두 번 돌아 개수가 4,279 → 6,090으로
      # 뛰었고, **전부 통과했으므로 CI는 초록이었다.**
      #
      # 반대 방향이 더 위험하다 — 한쪽 줄이 통째로 이기면 **테스트 뭉치가
      # 조용히 사라진다.** 없어진 테스트는 없어졌다는 표시가 없다.
      #
      # auto-rebase가 이 재배치를 기계가 하게 만들었으므로, 이 구멍을
      # 사람이 안 볼 때도 막아야 한다.
      - name: 테스트 등록 검사
        run: node scripts/check-test-registry.mjs

      # ── 상태판이 늙는 문장을 담지 않는가 ──
      #
      # `FULL_COMPLETION_STATUS.md`에 `main = Vercel = Fly = <SHA>` ·
      # `MATCHED` · `Fly Worker alive`가 적혀 있었다. 2026-08-21에
      # 확인해 보니 워커는 27시간째 멈춰 있었고 배포는 어긋나 있었다.
      #
      # **그 문장들은 적힐 때는 참이었다.** 검증할 수 없는 형태로 참을
      # 적어 두면 거짓이 되는 순간을 아무도 모른다 — 같은 날 코드
      # 주석에서도 같은 모양을 잡았다(my-original-v1).
      #
      # 상태판을 자동 갱신해 주는 대신 **늙는 문장 자체를 못 쓰게** 한다.
      - name: 상태판 문장 검사
        run: node scripts/check-status-claims.mjs

      # ── 워크플로 문법 검사 ──
      #
      # **유효한 YAML과 유효한 워크플로는 다르다.**
      #
      # `fly-deploy.yml`의 `run: |` 안에 넣은 여러 줄짜리 `python3 -c`가
      # 블록 스칼라의 들여쓰기를 벗어나면서 `try:`와 `except Exception:`이
      # 워크플로의 **최상위 키**가 됐다. GitHub은 그 파일을 Startup
      # failure로 거절했고, fly-deploy는 아예 실행되지 않았으며
      # `workflow_dispatch`는 HTTP 422를 돌려줬다 — 배포가 통째로 멈췄다.
      #
      # 그때 이 저장소가 쓰던 검사는 `python3 -c "yaml.safe_load(...)"`
      # 였고, **그 파일을 통과시켰다.** 문법상 올바른 YAML이 맞기 때문이다.
      # 스키마를 보는 검사가 필요하다.
      #
      # 버전과 체크섬을 박아 둔다 — 검사기가 조용히 바뀌면 검사도 조용히
      # 달라진다.
      - name: 워크플로 문법 검사 (actionlint)
        env:
          ACTIONLINT_VERSION: '1.7.7'
          ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o /tmp/actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

      # ── ESLint ──
      #
      # 전면 통과를 요구하면 지금 바로 실패한다(오류 53건). 그런데 그
      # 53건의 성격이 전혀 다르다:
      #
      #   42건 react/no-unescaped-entities  — JSX 안의 따옴표. 순전히 표기
      #   10건 @next/next/no-img-element    — 성능 권고
      #    1건 기타
      #
      # 표기 규칙 때문에 CI를 빨갛게 두면, 사람들은 곧 CI를 안 본다.
      # 그래서 **틀리면 실제로 깨지는 규칙만** 막는다.
      #
      # react-hooks/rules-of-hooks가 그것이다. 훅을 조건부로 부르면 React가
      # 훅을 호출 순서로 식별하기 때문에 이전 훅의 상태를 다음 훅이 집어
      # 간다. 화면이 조용히 뒤섞이거나 "Rendered fewer hooks than expected"로
      # 죽는다. 이 규칙 위반은 스타일이 아니라 버그다.
      #
      # 나머지는 아래 '전체 lint'에서 세기만 하고 실패시키지 않는다.
      # 줄어들면 그때 기준을 조인다.
      - name: ESLint — 깨지는 규칙만 차단
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log || true
          FATAL=$(grep -cE "rules-of-hooks|jsx-no-duplicate-props|react-hooks/exhaustive-deps.*Error" lint.log || true)
          echo "치명 규칙 위반 ${FATAL}건"
          if [ "$FATAL" -gt 0 ]; then
            echo "::error::훅 규칙 위반은 상태가 뒤섞이는 버그입니다"
            grep -E "rules-of-hooks|jsx-no-duplicate-props" -B 20 lint.log | grep -E "^\./|rules-of-hooks|jsx-no-duplicate-props"
            exit 1
          fi
          TOTAL=$(grep -cE "Error:" lint.log || true)
          echo "::notice::표기·권고 수준 lint 오류 ${TOTAL}건 (차단하지 않음)"

      - name: 타입 에러 개수 확인
        run: |
          set -o pipefail
          # tsc가 에러를 내면 non-zero로 끝난다. 개수를 세는 것이 목적이므로
          # 여기서 죽지 않게 받아 두고, 아래에서 기준과 비교해 판정한다.
          npx tsc --noEmit -p tsconfig.json > ts.log 2>&1 || true
          COUNT=$(grep -cE "error TS" ts.log || true)
          echo "타입 에러 ${COUNT}건 (기준 ${TS_ERROR_BASELINE}건)"

          # ── 개수로 재는 것의 구멍 ──
          #
          # 파싱 오류가 나면 tsc가 그 파일에서 멈춰 **에러가 줄어든다.**
          # 실제로 80건이 1건이 된 적이 있고, 그때 이 검사는 통과했다.
          # 문법이 깨진 것은 개수와 무관하게 언제나 실패여야 한다.
          # 파싱이 **중단되는** 코드만 고른다. TS1117(중복 프로퍼티) 같은
          # 문법 오류는 파싱을 멈추지 않으므로 개수 검사에 맡긴다 —
          # 여기 넣으면 기준선에 이미 있는 것 때문에 매번 빨개진다.
          PARSE_CODES='TS1002|TS1003|TS1005|TS1011|TS1109|TS1128|TS1131|TS1160|TS1161'
          SYNTAX=$(grep -cE "error (${PARSE_CODES}):" ts.log || true)
          if [ "$SYNTAX" -gt 0 ]; then
            echo "::error::파싱이 중단된 파일이 있습니다 (${SYNTAX}건) — 개수 검사보다 우선합니다"
            grep -E "error (${PARSE_CODES}):" ts.log | head -20
            exit 1
          fi
          if [ "$COUNT" -gt "$TS_ERROR_BASELINE" ]; then
            echo "::error::타입 에러가 ${TS_ERROR_BASELINE}건에서 ${COUNT}건으로 늘었습니다"
            # 늘어난 줄만 보여준다. 전체 로그는 80줄이라 새 에러가 묻힌다.
            grep -E "error TS" ts.log | tail -n $((COUNT - TS_ERROR_BASELINE))
            exit 1
          fi
          if [ "$COUNT" -lt "$TS_ERROR_BASELINE" ]; then
            echo "::notice::타입 에러가 ${COUNT}건으로 줄었습니다 — TS_ERROR_BASELINE을 같이 내려 주세요"
          fi

      - name: 프로덕션 빌드
        run: npm run build

      # 실패했을 때 무엇이 틀렸는지 로그가 남아야 한다.
      - name: 타입 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-log
          path: ts.log
          if-no-files-found: ignore
          retention-days: 7
