# 값을 맞추는 일을 사람이 두 대시보드를 오가며 하지 않게 한다.
#
# **검사 → 반영 → 재배포 → 지문 재확인까지 한 번에 한다.**
#
# 예전에는 반쪽이었다
# ───────────────────
#   · Fly에는 밀어 넣었다 — 다만 사람이 `apply: true`로 손수 돌려야 했다
#   · **Vercel에는 아무것도 하지 않았다.** "관리 토큰이 없습니다"만 적었다
#   · 밀어 넣은 뒤 **실제로 맞았는지 확인하지 않았다.**
#     `flyctl secrets set`이 0을 돌려주면 성공으로 적었다
#
# 마지막이 이 저장소에서 가장 비싼 고장이었다. 2026-08-19에 워커는
# 멀쩡히 돌고 배포는 성공이고 Fly는 started라고 하는데 화면은 아무것도
# 못 봤다 — 다른 데이터베이스를 보고 있었다. 사흘을 잃었다.
#
# **밀어 넣은 것과 맞은 것은 다르다.** 이제 밀어 넣은 뒤 돌고 있는 두
# 프로세스의 지문을 실제로 읽어 대조한다(`/api/system/runtime-health`).
#
# 롤백이 없는 이유
# ────────────────
# 되돌릴 곳이 없다. GitHub Secrets가 유일한 기준이고 이전 값은 아무도
# 갖고 있지 않다 — Fly도 Vercel도 다이제스트만 준다. 보관하려면 비밀을
# 한 곳 더 늘려야 한다. 그래서 되돌리는 대신 **틀렸다는 것을 크게 말하고
# 신규 진입을 막는다.** 이미 열린 포지션의 청산·보호는 계속 돈다.
#
# 판정은 여기 없다
# ────────────────
# `src/lib/ops/secretSync.ts`·`vercelEnv.ts`에 있고 테스트가 붙어 있다.
#
# 값은 어디에도 출력하지 않는다
# ─────────────────────────────
# 이름과 지문(sha256 앞 6자)만 찍는다.
name: sync-secrets

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 밀어 넣습니다 (워커가 재시작합니다). 비워 두면 확인만 합니다'
        type: boolean
        default: false

  schedule:
    # 하루 한 번 확인만. 어긋난 것이 있으면 요약에 남는다.
    - cron: '17 2 * * *'

concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: 시크릿 대조
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 최초 한 번 연결하는 자격. **없으면 그 목적지는 건너뛰고 사람 할 일로 적힌다.**
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      # 지문을 읽을 곳. 없으면 "확인하지 못했다"로 끝난다(맞았다가 아니다).
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      # 기준값들. **값은 로그에 절대 나오지 않는다.**
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXCHANGE_ENCRYPTION_KEY: ${{ secrets.EXCHANGE_ENCRYPTION_KEY }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      # 일정으로는 절대 값을 밀지 않는다 — 손수 돌렸을 때만.
      SYNC_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 판정기가 바뀌었는데 테스트가 깨져 있으면 그 판정으로 시크릿을
      # 밀어 넣으면 안 된다.
      - name: 판정기 테스트
        run: npm test

      - name: flyctl 설치
        uses: superfly/flyctl-actions/setup-flyctl@master
        continue-on-error: true

      # 검사 → 반영 → 재배포 → 지문 재확인. 전부 한 스크립트다.
      # BLOCKED로 끝나면 실패로 끝난다 — 초록으로 끝나면 아무도 안 본다.
      - name: 시크릿 동기화
        run: node scripts/sync-secrets.mjs
