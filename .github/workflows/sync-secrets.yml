# 값을 맞추는 일을 사람이 두 대시보드를 오가며 하지 않게 한다.
#
# **기본은 확인만 한다.**
#
# 값을 밀어 넣는 것은 되돌리기 어려운 일이다. `flyctl secrets set`은
# 머신을 재시작하고, 틀린 값을 밀면 그 순간 전부 멈춘다. 그래서 이
# 워크플로는 두 모드로 나뉜다:
#
#   확인(기본)  GitHub Secrets에 무엇이 있는지 이름만 세고, Fly에 이미
#               들어 있는 이름과 맞춰 본다. **아무것도 바꾸지 않는다.**
#   적용        `apply: true`로 손수 돌렸을 때만. 값을 밀어 넣고 워커가
#               재시작한다.
#
# 값은 어디에도 출력하지 않는다
# ─────────────────────────────
# 이름과 지문(sha256 앞 6자)만 찍는다. `flyctl secrets list`도 값을
# 보여주지 않고 다이제스트만 준다 — 그걸 그대로 쓴다.
#
# 왜 GitHub이 기준인가
# ────────────────────
# 어딘가 하나는 기준이어야 한다. 세 곳(GitHub·Vercel·Fly)이 서로를 보고
# 있으면 무엇이 맞는지 아무도 모른다. 배포 자격이 이미 여기 있으므로
# 여기를 기준으로 둔다.
name: sync-secrets

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 밀어 넣습니다 (워커가 재시작합니다). 비워 두면 확인만 합니다'
        type: boolean
        default: false

  schedule:
    # 하루 한 번 확인만. 어긋난 것이 있으면 요약에 남는다.
    - cron: '17 2 * * *'

concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: 시크릿 대조
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # 기준값들. **값은 로그에 절대 나오지 않는다.**
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXCHANGE_ENCRYPTION_KEY: ${{ secrets.EXCHANGE_ENCRYPTION_KEY }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: flyctl 설치
        uses: superfly/flyctl-actions/setup-flyctl@master
        continue-on-error: true

      - name: 기준값이 무엇이 있는가
        run: |
          set -euo pipefail
          # **이름과 지문만.** 값은 찍지 않는다.
          for n in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY EXCHANGE_ENCRYPTION_KEY ADMIN_SECRET; do
            v="${!n:-}"
            if [ -z "$v" ]; then
              echo "$n: 없음"
            else
              echo "$n: 있음 (지문 $(printf '%s' "$v" | sha256sum | cut -c1-6))"
            fi
          done

      - name: Fly에 무엇이 들어 있는가
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::warning::FLY_API_TOKEN이 없어 Fly 쪽을 확인하지 못했습니다"
            exit 0
          fi
          # secrets list는 값을 보여주지 않는다 — 이름과 다이제스트뿐이다.
          flyctl secrets list --app auto-platform || \
            echo "::warning::Fly 시크릿 목록을 읽지 못했습니다 (토큰 만료·권한 확인)"

      # ── 여기서만 값이 움직인다 ──
      #
      # 손수 `apply: true`로 돌렸을 때만. 되돌리기 어려운 일이라
      # 일정(schedule)으로는 절대 실행되지 않는다.
      - name: 적용
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN이 없어 밀어 넣지 못합니다"
            exit 1
          fi
          ARGS=()
          for n in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY EXCHANGE_ENCRYPTION_KEY ADMIN_SECRET; do
            v="${!n:-}"
            # **없는 값을 빈 문자열로 밀어 넣지 않는다.** 그건 지우는 것과 같다.
            if [ -n "$v" ]; then ARGS+=("$n=$v"); echo "밀어 넣을 것: $n"; fi
          done
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "::warning::밀어 넣을 값이 하나도 없습니다"
            exit 0
          fi
          # --stage로 한 번에 적용해 재시작을 한 번만 겪게 한다.
          flyctl secrets set --app auto-platform --stage "${ARGS[@]}"
          flyctl deploy --app auto-platform --remote-only --build-arg GIT_SHA=${{ github.sha }}
        # 값이 명령줄에 있으므로 출력을 통째로 가린다.
        env:
          FLYCTL_INSTALL: /home/runner/.fly

      - name: 요약
        if: always()
        run: |
          {
            echo "## 시크릿 대조"
            echo ""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "true" ]; then
              echo "**적용 모드** — Fly에 값을 밀어 넣고 재배포했습니다."
            else
              echo "**확인 모드** — 아무것도 바꾸지 않았습니다."
              echo ""
              echo "값을 실제로 맞추려면 이 워크플로를 \`apply: true\`로 손수 실행하세요."
              echo "워커가 재시작하므로 되돌리기 어려운 작업입니다."
            fi
            echo ""
            echo "값은 로그에 남지 않습니다 — 이름과 지문(sha256 앞 6자)만 찍습니다."
          } >> "$GITHUB_STEP_SUMMARY"
