# 088이 운영에 **실제로** 적용됐는지 **읽기만** 해서 확인한다.
#
# 왜 필요한가
# ───────────
# `migrate`가 "적용됨"이라고 적는 것과 운영 스키마가 그 의미를 갖는 것은
# 다른 사실이다. 081/082가 그것을 증명했다 — 장부에는 BASELINE으로 박혀
# 있었는데 스키마가 그 모양인지는 아무도 확인하지 않았다(그 감사가
# `audit-production-paper-account-identity`다).
#
# 088은 **돈 장부를 바꾸는** 마이그레이션이다. 칸 하나가 빠진 채로 코드가
# 올라가면 현물 매도가 런타임에 깨지거나, 더 나쁘게는 수수료 귀속이 빈 채로
# 손익이 적힌다. 그래서 적용 직후 한 번 읽어 본다.
#
# ★ migrate보다 먼저 돌면 안 된다
# ────────────────────────────────
# `push: main`으로 걸면 `migrate`와 **동시에** 뜬다. 그러면 아직 088이
# 적용되기 전 스키마를 읽고 FALSE/UNKNOWN을 적는다 — 없는 고장을 보고하는
# 감사가 된다. 그래서 `workflow_run`으로 **migrate가 성공으로 끝난 뒤에만**
# 깨어난다. 그리고 깨운 실행이 정말 main의 성공인지, 감사하는 커밋이
# 그 활성화 커밋과 같은지까지 값으로 확인한다.
#
# 특권 경로에서는 기본 브랜치 코드만 돈다
# ───────────────────────────────────────
# 이 워크플로는 운영 접속 정보를 쥔다. 깨운 쪽의 head_sha를 체크아웃하면
# 그 커밋에 담긴 스크립트가 secret을 쥔 채 실행된다. `vercel-redeploy`가
# 겪은 것과 같은 문제라 같은 해법을 쓴다 — **체크아웃은 main으로 고정**하고,
# 깨운 커밋은 **비교할 값**으로만 쓴다.
#
# 업무 데이터는 읽지 않는다
# ─────────────────────────
# `pg_catalog`·`information_schema`와 `schema_migrations` 한 줄, 그리고
# 판정에 필요한 **개수**뿐이다. 포지션·계좌·원장의 내용은 한 줄도 출력하지
# 않는다. 금액도 심볼도 사용자 id도 로그에 남기지 않는다.
#
# 쓰기는 Postgres가 거부한다
# ──────────────────────────
# `BEGIN TRANSACTION READ ONLY`로 열고 실제로 `READ_ONLY=on`이었는지 값으로
# 확인한다. **돈을 움직이는 RPC는 한 번도 부르지 않는다** — `paper_sell_holding`
# 같은 함수는 존재와 시그니처만 카탈로그에서 본다.
#
# 확인하지 못한 것은 통과가 아니다
# ────────────────────────────────
# 판정 항목에 UNKNOWN이 하나라도 있으면 MATCH를 적지 않고 UNKNOWN으로
# 끝낸다. 접속 실패·질의 실패를 TRUE로 바꾸는 우회는 없다.
#
# ★ 이 감사가 증명할 수 **없는** 것
# ─────────────────────────────────
#   · `entry_fee`가 과거에 안 바뀌었다  — 스냅샷 없이 현재 값만으로는 못 본다.
#     대신 **구조적으로 막혀 있는가**(동결 트리거가 실제로 그 칸을 비교하는가)를
#     본다. 값 보존을 주장하지 않는다.
#   · `open_quantity = quantity`가 영원히 참이다 — 거래가 일어나면 **정상적으로**
#     달라진다. 그래서 이 등식은 **아직 처분된 적 없는 줄에만** 건다
#     (`paper_sell_event_lots`에 그 줄이 없고 아직 열려 있는 경우).
#     활성화 직후의 backfill 증거로만 쓰고 불변식으로 만들지 않는다.
name: audit-production-paper-spot-holdings

on:
  # ★ migrate가 **성공으로 끝난 뒤에만** 깨어난다. push로 걸면 migrate와
  #   경합해 적용 전 스키마를 읽는다.
  workflow_run:
    workflows: [migrate]
    types: [completed]

concurrency:
  group: audit-production-paper-spot-holdings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    # 깨운 실행이 **main의 성공**일 때만 돈다. 둘 중 하나라도 아니면 아예
    # 시작하지 않는다 — 실패한 적용 뒤에 감사를 돌리면 "적용이 안 됐다"를
    # "스키마가 틀렸다"로 적게 된다.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    name: 현물 분할매도 운영 스키마 조회 (읽기 전용)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ACTIVATION_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # **체크아웃은 main으로 고정한다.** 깨운 커밋의 코드를 secret과 함께
      # 실행하지 않는다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 활성화 커밋과 감사 커밋이 같은가
        run: |
          set -euo pipefail
          here="$(git rev-parse HEAD)"
          echo "감사 커밋      ${here}"
          echo "활성화 커밋    ${ACTIVATION_SHA}"
          if [ -z "${ACTIVATION_SHA}" ]; then
            echo "::error::깨운 실행의 커밋을 읽지 못했습니다 — 무엇을 감사하는지 말할 수 없습니다"
            exit 1
          fi
          # 다르면 그 사이 main이 더 움직인 것이다. **다른 커밋을 감사하고
          # 활성화가 확인됐다고 적지 않는다.**
          if [ "${here}" != "${ACTIVATION_SHA}" ]; then
            echo "::error::감사 커밋과 활성화 커밋이 다릅니다 — 그 사이 main이 움직였습니다. 다시 돌리세요"
            exit 1
          fi
          echo "같은 커밋입니다"

      - name: 088이 저장소에 있는가 (없으면 감사할 것이 없다)
        run: |
          set -euo pipefail
          if [ ! -f supabase/migrations/088_paper_spot_holdings.sql ]; then
            echo "::error::088 파일이 main에 없습니다 — 이 감사는 그 파일의 의미를 확인합니다"
            exit 1
          fi
          echo "088 파일 확인"

      - name: DB 접속 정보 확인
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다 — 상태를 확인할 수 없습니다"
            echo "값은 GitHub Secrets에만 있습니다. 이 로그에는 출력하지 않습니다."
            exit 1
          fi
          echo "SUPABASE_DB_URL 존재 확인 (값은 출력하지 않습니다)"

      # ── 1단계: 카탈로그만 본다 ──
      #
      # 칸이 없을 수 있으므로 업무 표의 **칸을 참조하는** 질의를 여기 섞지
      # 않는다. `remaining_entry_fee_basis`가 없으면 그 칸을 읽는 질의는
      # 파싱에서 죽고, 감사가 "MISSING 보고" 대신 "크래시"가 된다.
      - name: 스키마 모양 조회 (BEGIN TRANSACTION READ ONLY)
        run: |
          set -o pipefail

          cat > "${RUNNER_TEMP}/audit-spot-shape.sql" <<'SQL'
          \set ON_ERROR_STOP on

          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '20s';
          SET LOCAL lock_timeout = '3s';

          \echo '=== 0. READ ONLY 증명 ==='
          SELECT 'READ_ONLY=' || current_setting('transaction_read_only') AS assertion;

          \echo ''
          \echo '=== 1. 마이그레이션 장부에 088이 있는가 (사실 기록) ==='
          SELECT version, name
            FROM supabase_migrations.schema_migrations
           WHERE version LIKE '088%' OR name LIKE '088%'
           ORDER BY version;

          \echo ''
          \echo '=== 2. 새 표 ==='
          WITH t(tbl) AS (VALUES ('paper_sell_events'), ('paper_sell_event_lots'))
          SELECT t.tbl,
                 (c.oid IS NOT NULL AND c.relkind = 'r') AS present_in_public
            FROM t
            LEFT JOIN LATERAL (
                 SELECT c.oid, c.relkind FROM pg_class c
                   JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public' AND c.relname = t.tbl
               ) c ON true
           ORDER BY t.tbl;

          \echo ''
          \echo '=== 3. paper_positions 새 칸 ==='
          SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS type, a.attnotnull AS not_null
            FROM pg_attribute a
           WHERE a.attrelid = to_regclass('public.paper_positions')
             AND a.attnum > 0 AND NOT a.attisdropped
             AND a.attname IN ('open_quantity','open_notional','open_margin',
                               'remaining_entry_fee_basis','entry_fee','quantity','notional','margin')
           ORDER BY a.attname;

          \echo ''
          \echo '=== 4. 제약·인덱스 (정의 그대로) ==='
          SELECT con.conrelid::regclass::text AS tbl, con.conname, con.contype,
                 pg_get_constraintdef(con.oid) AS definition
            FROM pg_constraint con
           WHERE con.conrelid IN (to_regclass('public.paper_sell_events'),
                                  to_regclass('public.paper_sell_event_lots'),
                                  to_regclass('public.paper_challenge_cashflows'))
           ORDER BY tbl, con.contype, con.conname;

          SELECT ic.relname AS index_name, pg_get_indexdef(i.indexrelid) AS definition
            FROM pg_index i
            JOIN pg_class ic ON ic.oid = i.indexrelid
           WHERE i.indrelid IN (to_regclass('public.paper_sell_events'),
                                to_regclass('public.paper_sell_event_lots'),
                                to_regclass('public.paper_positions'))
             AND ic.relname IN ('paper_sell_events_account_idx',
                                'paper_sell_event_lots_position_idx',
                                'paper_pos_holdings_idx')
           ORDER BY ic.relname;

          \echo ''
          \echo '=== 5. 함수 — 이름이 아니라 시그니처 ==='
          SELECT p.proname, pg_get_function_arguments(p.oid) AS args
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
           WHERE n.nspname = 'public'
             AND p.proname IN ('paper_sell_holding','paper_holdings','paper_realized_between',
                               'paper_alloc_scale','paper_floor_at',
                               'paper_positions_freeze_open_cols',
                               'paper_open_position','paper_settle_close')
           ORDER BY p.proname, args;

          \echo ''
          \echo '=== 6. 동결 트리거 ==='
          SELECT t.tgname, NOT t.tgisinternal AS user_trigger,
                 pg_get_triggerdef(t.oid) AS definition
            FROM pg_trigger t
           WHERE t.tgrelid = to_regclass('public.paper_positions')
             AND NOT t.tgisinternal
           ORDER BY t.tgname;

          \echo ''
          \echo '=== 7. 최종 판정 (모양) ==='
          WITH v AS (
            SELECT
              -- 표
              (to_regclass('public.paper_sell_events') IS NOT NULL)      AS tbl_sell_events,
              (to_regclass('public.paper_sell_event_lots') IS NOT NULL)  AS tbl_sell_lots,

              -- 칸 (이름이 아니라 실재)
              (SELECT count(*) = 4 FROM pg_attribute a
                WHERE a.attrelid = to_regclass('public.paper_positions')
                  AND a.attnum > 0 AND NOT a.attisdropped
                  AND a.attname IN ('open_quantity','open_notional','open_margin',
                                    'remaining_entry_fee_basis'))        AS cols_present,

              -- 멱등키: 계좌가 키에 들어 있는가. 이름이 아니라 **칸 조합**으로 본다.
              (SELECT bool_or(
                        con.contype = 'u'
                    AND -- `attname`은 `name`이다. 캐스팅하지 않으면 `name[] = text[]`로
                        -- **실행 시점에** 터진다 (이 저장소에 그 이름의 검사기가 있다).
                        (SELECT array_agg(att.attname::text ORDER BY att.attname)
                           FROM unnest(con.conkey) k
                           JOIN pg_attribute att
                             ON att.attrelid = con.conrelid AND att.attnum = k)
                        = ARRAY['client_sell_id','paper_account_id'])
                 FROM pg_constraint con
                WHERE con.conrelid = to_regclass('public.paper_sell_events'))
                                                                          AS sell_idem_key,

              -- 소유권 복합 외래키 (계좌, 사용자) → paper_accounts
              (SELECT bool_or(
                        con.contype = 'f'
                    AND con.confrelid = to_regclass('public.paper_accounts')
                    AND -- `attname`은 `name`이다. 캐스팅하지 않으면 `name[] = text[]`로
                        -- **실행 시점에** 터진다 (이 저장소에 그 이름의 검사기가 있다).
                        (SELECT array_agg(att.attname::text ORDER BY att.attname)
                           FROM unnest(con.conkey) k
                           JOIN pg_attribute att
                             ON att.attrelid = con.conrelid AND att.attnum = k)
                        = ARRAY['paper_account_id','user_id'])
                 FROM pg_constraint con
                WHERE con.conrelid = to_regclass('public.paper_sell_events'))
                                                                          AS sell_owner_fk,

              -- lot 기록은 매도 사건과 포지션 둘 다를 가리켜야 한다
              (SELECT count(*) = 2 FROM pg_constraint con
                WHERE con.conrelid = to_regclass('public.paper_sell_event_lots')
                  AND con.contype = 'f'
                  AND con.confrelid IN (to_regclass('public.paper_sell_events'),
                                        to_regclass('public.paper_positions')))
                                                                          AS lots_fks,

              -- 원장이 POSITION_SELL을 허용하는가 (이게 없으면 매도가 통째로 막힌다)
              (SELECT bool_or(pg_get_constraintdef(con.oid) LIKE '%POSITION_SELL%')
                 FROM pg_constraint con
                WHERE con.conrelid = to_regclass('public.paper_challenge_cashflows')
                  AND con.contype = 'c')                                  AS cashflow_sell_allowed,

              -- 인덱스
              (SELECT count(*) = 3 FROM pg_class ic
                WHERE ic.relname IN ('paper_sell_events_account_idx',
                                     'paper_sell_event_lots_position_idx',
                                     'paper_pos_holdings_idx'))           AS indexes_present,

              -- 함수 시그니처 (이름만 보면 옛 정의도 통과한다)
              (SELECT count(*) = 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname='public' AND p.proname='paper_sell_holding'
                  AND pg_get_function_arguments(p.oid) LIKE '%p_client_sell_id text%'
                  AND pg_get_function_arguments(p.oid) LIKE '%p_event_effective_at timestamp with time zone%')
                                                                          AS fn_sell_sig,
              (SELECT count(*) = 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname='public' AND p.proname='paper_holdings'
                  AND pg_get_function_arguments(p.oid) LIKE '%p_paper_account_id uuid%')
                                                                          AS fn_holdings_sig,
              (SELECT count(*) = 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname='public' AND p.proname='paper_realized_between'
                  AND pg_get_function_arguments(p.oid) LIKE '%p_from timestamp with time zone%')
                                                                          AS fn_realized_sig,

              -- 088판 진입: 원 체결 증거를 INSERT하는가 (본문으로 본다)
              (SELECT bool_or(p.prosrc LIKE '%open_quantity, open_notional, open_margin, remaining_entry_fee_basis%')
                 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname='public' AND p.proname='paper_open_position')
                                                                          AS fn_open_is_088,

              -- 088판 청산: 승패가 앞선 부분매도를 포함하는가 (본문으로 본다)
              (SELECT bool_or(p.prosrc LIKE '%paper_sell_event_lots%'
                          AND p.prosrc LIKE '%v_prior%')
                 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname='public' AND p.proname='paper_settle_close')
                                                                          AS fn_settle_is_088,

              -- 동결 트리거: 존재 + BEFORE UPDATE + 그 칸들을 실제로 비교하는가
              (SELECT bool_or(pg_get_triggerdef(t.oid) LIKE 'CREATE TRIGGER paper_positions_freeze_open_trg BEFORE UPDATE%')
                 FROM pg_trigger t
                WHERE t.tgrelid = to_regclass('public.paper_positions') AND NOT t.tgisinternal)
                                                                          AS freeze_trigger,
              (SELECT bool_or(p.prosrc LIKE '%OLD.entry_fee%'
                          AND p.prosrc LIKE '%OLD.open_quantity%'
                          AND p.prosrc LIKE '%OLD.open_notional%'
                          AND p.prosrc LIKE '%OLD.open_margin%')
                 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname='public' AND p.proname='paper_positions_freeze_open_cols')
                                                                          AS freeze_covers_cols,
              -- **처음 채우기는 막지 않는다** — 이 가드가 없으면 backfill이
              -- 자기 트리거에 막혀 088 재적용이 실패한다(실제로 겪었다).
              (SELECT bool_or(p.prosrc LIKE '%OLD.entry_fee%IS NOT NULL%')
                 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname='public' AND p.proname='paper_positions_freeze_open_cols')
                                                                          AS freeze_allows_first_fill,

              -- 088 장부 행 (판정이 아니라 사실 기록)
              (SELECT count(*) > 0 FROM supabase_migrations.schema_migrations m
                WHERE m.version LIKE '088%' OR m.name LIKE '088%')        AS ledger_088
          )
          SELECT unnest(ARRAY[
            'TBL_SELL_EVENTS='          || upper(coalesce(tbl_sell_events::text,'UNKNOWN')),
            'TBL_SELL_LOTS='            || upper(coalesce(tbl_sell_lots::text,'UNKNOWN')),
            'POS_NEW_COLUMNS='          || upper(coalesce(cols_present::text,'UNKNOWN')),
            'SELL_IDEM_KEY_HAS_ACCOUNT='|| upper(coalesce(sell_idem_key::text,'UNKNOWN')),
            'SELL_OWNER_FK='            || upper(coalesce(sell_owner_fk::text,'UNKNOWN')),
            'LOTS_FKS='                 || upper(coalesce(lots_fks::text,'UNKNOWN')),
            'CASHFLOW_SELL_ALLOWED='    || upper(coalesce(cashflow_sell_allowed::text,'UNKNOWN')),
            'INDEXES_PRESENT='          || upper(coalesce(indexes_present::text,'UNKNOWN')),
            'FN_SELL_SIGNATURE='        || upper(coalesce(fn_sell_sig::text,'UNKNOWN')),
            'FN_HOLDINGS_SIGNATURE='    || upper(coalesce(fn_holdings_sig::text,'UNKNOWN')),
            'FN_REALIZED_SIGNATURE='    || upper(coalesce(fn_realized_sig::text,'UNKNOWN')),
            'FN_OPEN_POSITION_IS_088='  || upper(coalesce(fn_open_is_088::text,'UNKNOWN')),
            'FN_SETTLE_CLOSE_IS_088='   || upper(coalesce(fn_settle_is_088::text,'UNKNOWN')),
            'FREEZE_TRIGGER_BEFORE_UPDATE=' || upper(coalesce(freeze_trigger::text,'UNKNOWN')),
            'FREEZE_COVERS_EVIDENCE_COLS='  || upper(coalesce(freeze_covers_cols::text,'UNKNOWN')),
            'FREEZE_ALLOWS_FIRST_FILL='     || upper(coalesce(freeze_allows_first_fill::text,'UNKNOWN')),
            'LEDGER_088_ROW='           || upper(coalesce(ledger_088::text,'UNKNOWN'))
          ]) AS verdict FROM v;

          COMMIT;
          SQL

          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -X \
            -f "${RUNNER_TEMP}/audit-spot-shape.sql" 2>&1 \
            | sed -E 's#postgres(ql)?://[^ ]*#<접속정보-가림>#g' \
            | tee "${RUNNER_TEMP}/shape-raw.txt"

          # **접속 정보를 로그에 흘리지 않는다.** psql 오류 문구에도 들어 있다.
          grep -E '^[A-Z_]+=(TRUE|FALSE|UNKNOWN)$' "${RUNNER_TEMP}/shape-raw.txt" \
            > "${RUNNER_TEMP}/spot.txt" || true
          if [ ! -s "${RUNNER_TEMP}/spot.txt" ]; then
            echo "::error::판정 줄을 하나도 읽지 못했습니다 — 조회는 끝났는데 결과가 비었습니다"
            exit 1
          fi
          if ! grep -q 'READ_ONLY=on' "${RUNNER_TEMP}/shape-raw.txt"; then
            echo "::error::읽기 전용 트랜잭션이었다는 증거가 없습니다"
            exit 1
          fi
          cat "${RUNNER_TEMP}/spot.txt"

      # ── 2단계: 개수만 센다 ──
      #
      # 칸이 없으면 이 질의는 파싱에서 죽는다. 그래서 1단계가 칸 존재를
      # TRUE로 적었을 때만 돈다. 아니면 **UNKNOWN으로 적고 넘어간다** —
      # 못 읽은 것을 0으로도 TRUE로도 적지 않는다.
      - name: backfill·고아·정합 개수 (BEGIN TRANSACTION READ ONLY)
        run: |
          set -o pipefail

          if ! grep -q '^POS_NEW_COLUMNS=TRUE$' "${RUNNER_TEMP}/spot.txt"; then
            {
              echo 'BACKFILL_NO_NULL=UNKNOWN'
              echo 'BACKFILL_UNTRADED_ROWS_MATCH=UNKNOWN'
              echo 'NO_ORPHAN_SELL_LOTS=UNKNOWN'
              echo 'NO_OWNER_MISMATCH=UNKNOWN'
              echo 'CHALLENGE_ACCOUNT_ONE_TO_ONE=UNKNOWN'
              echo 'CHALLENGE_RECONCILED=UNKNOWN'
            } >> "${RUNNER_TEMP}/spot.txt"
            echo "새 칸이 없어 개수를 세지 않았습니다 — UNKNOWN으로 적었습니다"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/audit-spot-counts.sql" <<'SQL'
          \set ON_ERROR_STOP on

          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '30s';
          SET LOCAL lock_timeout = '3s';

          \echo '=== READ ONLY 증명 ==='
          SELECT 'READ_ONLY=' || current_setting('transaction_read_only') AS assertion;

          \echo ''
          \echo '=== 개수 판정 (내용은 출력하지 않는다) ==='
          WITH c AS (
            SELECT
              -- backfill이 빠뜨린 줄이 있는가. 하나라도 NULL이면 매도가 그 줄에서 멈춘다.
              (SELECT count(*) FROM public.paper_positions pp
                WHERE pp.open_quantity IS NULL OR pp.open_notional IS NULL
                   OR pp.open_margin IS NULL OR pp.remaining_entry_fee_basis IS NULL)
                                                                        AS null_evidence,

              -- ★ **아직 처분된 적 없는 열린 줄에만** 건다.
              --   거래가 일어나면 이 등식은 **정상적으로** 깨진다. 활성화
              --   직후의 backfill 증거로만 쓰고 불변식으로 만들지 않는다.
              (SELECT count(*) FROM public.paper_positions pp
                WHERE pp.status = 'open'
                  AND NOT EXISTS (SELECT 1 FROM public.paper_sell_event_lots l
                                   WHERE l.position_id = pp.id)
                  AND (pp.open_quantity IS DISTINCT FROM pp.quantity
                    OR pp.open_notional IS DISTINCT FROM pp.notional
                    OR pp.open_margin   IS DISTINCT FROM pp.margin
                    OR pp.remaining_entry_fee_basis IS DISTINCT FROM pp.entry_fee))
                                                                        AS untraded_mismatch,

              -- 고아 기록
              (SELECT count(*) FROM public.paper_sell_event_lots l
                WHERE NOT EXISTS (SELECT 1 FROM public.paper_sell_events e WHERE e.id = l.sell_id)
                   OR NOT EXISTS (SELECT 1 FROM public.paper_positions pp WHERE pp.id = l.position_id))
                                                                        AS orphan_lots,

              -- 매도 사건의 계좌 주인이 사건의 주인과 같은가
              (SELECT count(*) FROM public.paper_sell_events e
                 JOIN public.paper_accounts a ON a.id = e.paper_account_id
                WHERE a.user_id IS DISTINCT FROM e.user_id)              AS owner_mismatch,

              -- ★ 챌린지 ↔ 전용 계좌가 1:1인가
              (SELECT count(*) FROM (
                 SELECT c.paper_account_id FROM public.paper_challenges c
                  GROUP BY c.paper_account_id HAVING count(*) > 1) x)    AS acct_shared_by_challenges,

              -- ★ **챌린지 전용 계좌만** 대조한다.
              --   일반/기본 PAPER 계좌에는 챌린지 원장이 없으므로 이 식의
              --   대상이 아니다. 거기에 걸면 멀쩡한 계좌가 전부 FALSE가 된다.
              (SELECT count(*) FROM public.paper_challenges c
                 JOIN public.paper_accounts a ON a.id = c.paper_account_id
                WHERE a.balance IS DISTINCT FROM
                      (SELECT COALESCE(SUM(f.amount), 0)
                         FROM public.paper_challenge_cashflows f
                        WHERE f.challenge_id = c.id))                    AS reconcile_mismatch,

              -- 사실 기록 (판정 아님)
              (SELECT count(*) FROM public.paper_positions)              AS n_positions,
              (SELECT count(*) FROM public.paper_sell_events)            AS n_sell_events,
              (SELECT count(*) FROM public.paper_challenges)             AS n_challenges
          )
          SELECT unnest(ARRAY[
            'BACKFILL_NO_NULL='              || upper((null_evidence = 0)::text),
            'BACKFILL_UNTRADED_ROWS_MATCH='  || upper((untraded_mismatch = 0)::text),
            'NO_ORPHAN_SELL_LOTS='           || upper((orphan_lots = 0)::text),
            'NO_OWNER_MISMATCH='             || upper((owner_mismatch = 0)::text),
            'CHALLENGE_ACCOUNT_ONE_TO_ONE='  || upper((acct_shared_by_challenges = 0)::text),
            'CHALLENGE_RECONCILED='          || upper((reconcile_mismatch = 0)::text)
          ]) AS verdict FROM c;

          \echo ''
          \echo '=== 규모 (내용 아님) ==='
          SELECT (SELECT count(*) FROM public.paper_positions)   AS positions,
                 (SELECT count(*) FROM public.paper_sell_events) AS sell_events,
                 (SELECT count(*) FROM public.paper_challenges)  AS challenges;

          COMMIT;
          SQL

          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -X \
            -f "${RUNNER_TEMP}/audit-spot-counts.sql" 2>&1 \
            | sed -E 's#postgres(ql)?://[^ ]*#<접속정보-가림>#g' \
            | tee "${RUNNER_TEMP}/counts-raw.txt"

          grep -E '^[A-Z_]+=(TRUE|FALSE|UNKNOWN)$' "${RUNNER_TEMP}/counts-raw.txt" \
            >> "${RUNNER_TEMP}/spot.txt" || true
          if ! grep -q 'READ_ONLY=on' "${RUNNER_TEMP}/counts-raw.txt"; then
            echo "::error::읽기 전용 트랜잭션이었다는 증거가 없습니다"
            exit 1
          fi

      # 판정을 **사람이 로그를 눈으로 세어 내리지 않게** 한다.
      - name: 최종 판정 (MATCH / MIXED / MISSING / UNKNOWN)
        run: |
          set -o pipefail

          # 표가 없으면 판정 자체가 성립하지 않는다.
          for key in TBL_SELL_EVENTS TBL_SELL_LOTS; do
            if ! grep -q "^${key}=TRUE$" "${RUNNER_TEMP}/spot.txt"; then
              echo "::error::${key}가 TRUE가 아닙니다 — 088의 표가 운영에 없습니다. 판정을 내리지 않습니다"
              exit 1
            fi
          done

          # 판정 항목. `LEDGER_088_ROW`는 사실 기록이라 넣지 않는다 —
          # 장부에 적혀 있다는 것과 스키마가 그 모양이라는 것은 다른 사실이고,
          # 이 감사는 후자를 본다.
          KEYS="POS_NEW_COLUMNS SELL_IDEM_KEY_HAS_ACCOUNT SELL_OWNER_FK LOTS_FKS
                CASHFLOW_SELL_ALLOWED INDEXES_PRESENT
                FN_SELL_SIGNATURE FN_HOLDINGS_SIGNATURE FN_REALIZED_SIGNATURE
                FN_OPEN_POSITION_IS_088 FN_SETTLE_CLOSE_IS_088
                FREEZE_TRIGGER_BEFORE_UPDATE FREEZE_COVERS_EVIDENCE_COLS FREEZE_ALLOWS_FIRST_FILL
                BACKFILL_NO_NULL BACKFILL_UNTRADED_ROWS_MATCH
                NO_ORPHAN_SELL_LOTS NO_OWNER_MISMATCH
                CHALLENGE_ACCOUNT_ONE_TO_ONE CHALLENGE_RECONCILED"

          t=0; f=0; u=0
          false_list=''; unknown_list=''
          for k in ${KEYS}; do
            v=$(grep -m1 "^${k}=" "${RUNNER_TEMP}/spot.txt" | cut -d= -f2 || true)
            case "${v}" in
              TRUE)    t=$((t+1)) ;;
              FALSE)   f=$((f+1)); false_list="${false_list} ${k}" ;;
              UNKNOWN) u=$((u+1)); unknown_list="${unknown_list} ${k}" ;;
              *)       u=$((u+1)); unknown_list="${unknown_list} ${k}(줄없음)" ;;
            esac
          done

          echo "=== 항목 집계 ==="
          echo "  TRUE ${t} / FALSE ${f} / UNKNOWN ${u}  (판정 항목 $((t+f+u))개)"
          [ -n "${false_list}" ]   && echo "  FALSE:  ${false_list}"
          [ -n "${unknown_list}" ] && echo "  UNKNOWN:${unknown_list}"

          # **확인하지 못한 것은 통과가 아니다.**
          if [ "${u}" -gt 0 ]; then
            verdict='UNKNOWN'
          elif [ "${f}" -eq 0 ]; then
            verdict='MATCH'
          elif [ "${t}" -eq 0 ]; then
            verdict='MISSING'
          else
            verdict='MIXED'
          fi

          echo ""
          echo "=== 판정 ==="
          echo "PAPER_SPOT_HOLDINGS_VERDICT=${verdict}"

          {
            echo "## 현물 분할매도 — 운영 스키마 감사 (088)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **판정** | \`${verdict}\` |"
            echo "| 항목 | TRUE ${t} · FALSE ${f} · UNKNOWN ${u} |"
            echo "| 활성화 커밋 | \`${ACTIVATION_SHA}\` |"
            echo ""
            echo "이 워크플로는 **읽기만** 합니다. 돈을 움직이는 RPC를 부르지 않았고,"
            echo "스키마·장부·포지션을 바꾸지 않았습니다."
            echo ""
            echo "증명하지 않는 것: \`entry_fee\`의 과거 값 보존은 스냅샷 없이 볼 수 없습니다."
            echo "대신 동결 트리거가 그 칸을 실제로 막는지(구조)를 봅니다."
            echo "\`open_* = 현재값\` 등식은 **아직 처분되지 않은 열린 줄에만** 겁니다 —"
            echo "거래가 일어나면 정상적으로 달라지므로 불변식이 아닙니다."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${verdict}" != 'MATCH' ]; then
            echo "::error::판정 ${verdict} — 088의 의미가 운영에 온전히 있지 않습니다. 임의 복구 금지, 결정이 필요합니다"
            exit 1
          fi
          echo "판정 MATCH — 088의 의미가 운영에 실제로 존재합니다"
