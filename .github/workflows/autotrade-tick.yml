# 자동매매 실행기 — 15분마다 예약을 확인한다
#
# 왜 필요한가
# ───────────
# vercel.json에 daily-ladder 크론이 있지만 **Vercel Hobby는 하루 1회만
# 허용한다.** 그래서 지금까지 자동매매는 한국시간 아침 8시 딱 한 번만
# 돌았다. 그 시각에 조건이 안 맞으면 그날은 끝이다 — 하루에 한 번
# 쳐다보는 것을 자동매매라고 부르기는 어렵다.
#
# 화면에 "이 화면이 열려 있는 동안 자주 보기" 스위치가 있지만 그건
# 브라우저가 켜져 있어야 한다. 폰을 닫으면 멈춘다. 사람이 계속 눌러
# 줘야 하는 것은 자동이 아니다.
#
# 이 워크플로는 배포와 무관하게 돈다
# ──────────────────────────────────
# 예약 자체는 DB(autotrade_schedules)에 있다. **배포해도, 이 워크플로를
# 고쳐도 꺼지지 않는다.** 껐다 켜는 것은 화면의 스위치뿐이다.
#
# 얼마나 자주 진입하는가는 여기가 아니라 **예약 줄의 '간격(분)'이
# 정한다.** 이 워크플로는 15분마다 물어보기만 하고, 간격이 안 됐으면
# 라우트가 "아직 간격 안 됨"으로 건너뛴다(그때 last_run_at을 건드리지
# 않으므로 간격이 밀리지 않는다). 간격 60분이면 15분마다 물어봐도
# 실제 진입 기회는 한 시간에 한 번이다.
#
# ── 준비 ──
# watch-tick과 **같은 시크릿을 쓴다.** 이미 넣어 뒀다면 추가 설정 없다.
#   EXIT_MONITOR_URL     예: https://auto-platform-zeta.vercel.app
#   EXIT_MONITOR_SECRET  Vercel의 ADMIN_SECRET 과 같은 값
name: autotrade-tick

on:
  schedule:
    # 15분마다. GitHub는 부하에 따라 몇 분 지연될 수 있다 — 정시 보장이
    # 필요한 전략이면 이 구조를 쓰면 안 된다.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # 겹쳐 돌면 같은 예약이 두 번 실행돼 주문이 두 번 나갈 수 있다.
  # 하루 1회 제약은 DB unique가 잡지만, 거기까지 가기 전에 막는 편이 낫다.
  group: autotrade-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 자동매매 예약 확인
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.EXIT_MONITOR_SECRET }}
        run: |
          set -euo pipefail
          # 끝 슬래시를 떼어 낸다. "https://x.app/"처럼 넣으면 "…app//api/…"가
          # 되고 Vercel이 308로 되돌린다. 가장 흔한 실수인데 로그에는
          # 308 한 줄만 남아 원인을 알기 어렵다.
          BASE="${BASE%/}"
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "EXIT_MONITOR_URL 또는 EXIT_MONITOR_SECRET 시크릿이 없습니다."
            exit 1
          fi

          body=$(mktemp)
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 300 \
            -H "x-admin-secret: ${SECRET}" \
            "${BASE}/api/autotrade/daily-ladder")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          if [ "$code" = "401" ]; then
            echo "──────────────────────────────────────────────"
            echo "인증 실패: GitHub의 EXIT_MONITOR_SECRET과"
            echo "Vercel의 ADMIN_SECRET이 글자 하나까지 같아야 합니다."
            echo "  1) Vercel에 ADMIN_SECRET이 있는지 (없으면 넣고 재배포)"
            echo "  2) 넣은 뒤 Redeploy 했는지 (저장만으로는 반영 안 됨)"
            echo "  3) 복사할 때 앞뒤 공백·줄바꿈이 딸려 들어갔는지"
            echo "──────────────────────────────────────────────"
          fi
          if [ "$code" = "503" ]; then
            echo "──────────────────────────────────────────────"
            echo "서버가 준비되지 않았습니다. 응답의 error를 보세요:"
            echo "  admin_secret_missing → Vercel에 ADMIN_SECRET 넣고 재배포"
            echo "  supabase_not_configured → Supabase 환경변수 확인"
            echo "──────────────────────────────────────────────"
          fi
          if [ "$code" != "200" ]; then
            echo "자동매매 호출 실패 (HTTP ${code})"
            exit 1
          fi

          # **200이 '진입했다'는 뜻은 아니다.**
          # 대부분의 호출은 "아직 간격 안 됨" 또는 "조건 불충족"으로 끝나고
          # 그건 정상이다. 로그에 응답 전문이 남으므로 무엇을 했는지는
          # 위 출력에서 확인한다. 여기서 진입 건수로 실패 판정을 하면
          # 정상적인 관망이 매번 빨간 X로 뜬다.
          echo "완료 — 위 응답의 results/note가 실제로 무엇을 했는지 적고 있습니다."
