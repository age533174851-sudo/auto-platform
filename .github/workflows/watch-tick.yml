# 현물 트레일링·예약 주문 감시
#
# 왜 GitHub Actions인가
# ─────────────────────
# Vercel Hobby 플랜의 Cron은 하루 1회만 허용된다. 하루에 한 번 확인하는
# 트레일링 스톱은 트레일링이 아니다.
#
# 이 주기가 곧 보호 수준이다
# ──────────────────────────
# 15분마다 확인하므로 **최대 15분치 갭을 그대로 맞는다.** 손절선이 100이어도
# 다음 확인 때 92면 92에 팔린다. 이건 구현 결함이 아니라 이 구조의 한계이고,
# /api/watch/tick 응답과 화면이 이 간격을 그대로 표시한다.
#
# 거래소에 올릴 수 있는 보호(지정가 손절)는 거래소에 올리는 편이 낫다 —
# 그건 앱이 꺼져도, 이 워크플로가 멈춰도 살아 있다.
#
# ── 준비 ──
# 저장소 Settings → Secrets and variables → Actions:
#   EXIT_MONITOR_URL     예: https://auto-platform-zeta.vercel.app
#   EXIT_MONITOR_SECRET  Vercel의 ADMIN_SECRET 과 같은 값
name: watch-tick

on:
  schedule:
    # 15분마다. GitHub는 부하에 따라 몇 분 지연될 수 있다.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # 겹쳐 돌면 같은 감시가 두 번 발동해 주문이 두 번 나간다.
  group: watch-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 트레일링·예약 감시
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.EXIT_MONITOR_SECRET }}
        run: |
          set -euo pipefail
          # 끝 슬래시를 떼어 낸다. 시크릿에 "https://x.app/"처럼 넣으면
          # "…app//api/…"가 되고 Vercel이 308로 되돌린다. 사람이 주소를
          # 붙여넣을 때 가장 흔한 실수인데, 그때 나오는 것은 308 한 줄뿐이라
          # 원인을 알기 어렵다.
          BASE="${BASE%/}"
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "EXIT_MONITOR_URL 또는 EXIT_MONITOR_SECRET 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          body=$(mktemp)
          # -L: 리다이렉트를 따라간다. 308은 메서드와 바디를 유지하므로
          #     헤더(x-admin-secret)도 그대로 간다.
          # url_effective: 실제로 어디에 닿았는지. 리다이렉트가 났으면
          #     그 사실이 로그에 남아야 다음에 주소를 고칠 수 있다.
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 90 \
            -H "x-admin-secret: ${SECRET}" \
            "${BASE}/api/watch/tick")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          # 조용히 지나가면 감시가 멈춘 것을 알 수 없다.
          if [ "$code" != "200" ]; then
            echo "감시 호출 실패 (HTTP ${code})"
            exit 1
          fi
