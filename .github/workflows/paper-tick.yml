# 모의 자동매매 실행기 — 15분마다 깨운다
#
# 무엇이 문제였나
# ───────────────
# 모의 자동매매 전체(진입과 청산 둘 다)를 깨우는 곳이 **하나뿐이었다**:
#
#   worker/src/index.ts → POST /api/paper/exit-monitor → runDuePaperAutomation()
#
# `/api/paper/automation`은 사람이 켜고 끄는 화면용이고, 회차를 돌리지
# 않는다. `vercel.json`의 크론 다섯 개와 GitHub의 다른 예약 전부가 이
# 라우트를 부르지 않는다. `paper-automation.yml`은 예약이 아니라 **경로
# 필터**다(그 파일이 바뀔 때 시험을 돌린다).
#
# 그래서 **Fly 워커가 꺼져 있으면 모의매매는 한 건도 돌지 않고, 안전망이
# 0이다.** 진입이 안 되는 것은 기회를 놓치는 것이지만, 청산이 안 되는 것은
# 손절이 안 걸리는 것이다 — 잃는 것이 다르다.
#
# 자동매매(실거래) 쪽은 이미 길이 셋이다: 워커 · `vercel.json` 크론 ·
# GitHub 예약(`autotrade-tick.yml`). **모의 쪽만 하나였다** — 같은 판단이
# 두 곳에 있는데 한쪽만 고친, 이 저장소에서 가장 자주 나는 고장이다.
#
# 왜 vercel.json이 아닌가
# ───────────────────────
# **Vercel Hobby 크론은 하루 한 번만 허용한다.** 하루 한 번 쳐다보는
# 청산 감시는 청산 감시가 아니다. `0 * * * *`로 넣어 봤다가 **배포가
# 실패한 기록**이 `src/app/api/cron/reconcile/route.ts`에 남아 있다 —
# 배포가 실패하면 이 라우트 하나가 아니라 전부가 안 올라간다.
#
# `/api/watch/tick`이 같은 이유로 이미 GitHub Actions 15분을 쓴다.
#
# 워커와 같이 돌아도 되는가 — 된다, 그렇게 설계돼 있다
# ────────────────────────────────────────────────────
# 두 길이 동시에 깨워도 회차는 하나만 돈다. `paper_auto_claim()`이
# 토큰 하나만 내주고(마이그레이션 101), PG 시험이 **동시 8회 깨우기를
# 30회 반복해 토큰이 항상 1개**임을 고정한다
# (`scripts/paper-automation-pg.test.mjs`). 청산은 `paper_settle_close`
# 한 트랜잭션으로 정산된다. 겹침은 사고가 아니라 **이 구조가 막도록
# 만들어진 것**이고, 그래서 두 번째 길을 놓을 수 있다.
#
# ── 인증 ──
# 서버의 `ADMIN_SECRET`과 `x-admin-secret`을 비교한다. **새 시크릿 이름을
# 만들지 않는다.** 같은 비밀에 이름이 둘이면 언젠가 갈리고, 실제로
# 갈렸다 — `autotrade-tick.yml`의 주석이 **30회 넘게 연속 401**이었던
# 사고를 기록하고 있다.
#   EXIT_MONITOR_URL  예: https://auto-platform-zeta.vercel.app
#   ADMIN_SECRET      sync-secrets가 Vercel·Fly로 밀어 넣는 그 값
name: paper-tick

on:
  schedule:
    # 15분마다. GitHub는 부하에 따라 몇 분 지연될 수 있다 — 그 지연은
    # 응답의 cadence telemetry에 그대로 남고, 화면이 실제 간격을 적는다.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # 겹쳐 돌아도 DB가 막지만, 거기까지 가기 전에 막는 편이 낫다.
  # **진행 중인 것을 취소하지 않는다** — 청산 중간에 끊는 것이 더 나쁘다.
  group: paper-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 모의 자동매매 깨우기
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail
          # 끝 슬래시를 떼어 낸다. "https://x.app/"는 "…app//api/…"가 되고
          # Vercel이 308로 되돌린다 — 로그에는 308 한 줄만 남는다.
          BASE="${BASE%/}"
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "EXIT_MONITOR_URL 또는 ADMIN_SECRET 시크릿이 없습니다."
            exit 1
          fi

          body=$(mktemp)
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 300 \
            -H "x-admin-secret: ${SECRET}" \
            -H "x-traigo-source: github-actions" \
            "${BASE}/api/paper/exit-monitor")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          # **사람 할 일 목록을 여기에 적지 않는다.** 남은 401은 사람이
          # 손으로 맞출 일이 아니라 동기화나 배포가 밀린 것이다.
          if [ "$code" = "401" ]; then
            echo "managed ADMIN_SECRET rejected — secret sync/deployment drift"
          fi
          if [ "$code" = "405" ]; then
            echo "route does not accept GET — 깨우기 경로가 사라졌습니다"
          fi
          if [ "$code" != "200" ]; then
            echo "모의 자동매매 호출 실패 (HTTP ${code})"
            exit 1
          fi

          # **200이 '진입했다'는 뜻은 아니다.** 대부분은 "간격 안 됨" ·
          # "조건 불충족"으로 끝나고 그건 정상이다. 무엇을 했는지는 위
          # 응답에 그대로 남는다. 여기서 진입 건수로 실패를 판정하면
          # 정상적인 관망이 매번 빨간 X로 뜬다.
          echo "완료 — 위 응답이 실제로 무엇을 했는지 적고 있습니다."
