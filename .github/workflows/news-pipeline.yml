# 뉴스 수집 → AI 분석
#
# 왜 GitHub Actions인가
# ─────────────────────
# Vercel Hobby의 Cron은 하루 1회만 허용되고, 그 한 자리는 이미 exit-monitor가
# 쓰고 있다. 하루에 한 번 모으는 뉴스는 뉴스가 아니다.
#
# 왜 두 단계로 나누는가
# ─────────────────────
# 수집은 외부 뉴스 API를, 분석은 AI API를 쓴다. 요금 체계도 실패 방식도
# 다르다. 붙여 두면 AI가 429를 뱉을 때 수집까지 같이 죽고, 다음 회차에
# 원문을 처음부터 다시 받는다. 원문은 사실이라 한 번만 받으면 된다.
#
# 분석이 실패해도 워크플로를 실패로 만들지 않는 이유
# ───────────────────────────────────────────────────
# 기사 하나가 이상해서 분석이 안 되는 것은 흔한 일이고, 그때마다 빨간
# 표시가 뜨면 진짜 고장을 놓친다. 대신 응답을 그대로 로그에 남긴다.
#
# ── 준비 ──
# 저장소 Settings → Secrets and variables → Actions:
#   EXIT_MONITOR_URL     예: https://auto-platform-zeta.vercel.app
#   NEWS_CRON_SECRET     Vercel의 CRON_SECRET 과 같은 값
#
# Vercel 환경변수에 뉴스 공급자 키(FINNHUB_API_KEY 등)와 AI 키
# (OPENAI_API_KEY 등)가 없으면 각 단계가 503으로 그 사실을 알려준다.
name: news-pipeline

on:
  schedule:
    # 30분마다. 뉴스는 15분 단위로 급하지 않고, 자주 돌수록 AI 요금이 는다.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  # 겹쳐 돌면 같은 기사를 두 번 분석한다 — 결과는 같고 요금만 두 배다.
  group: news-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 뉴스 수집 (원문만)
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "EXIT_MONITOR_URL 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer ${SECRET:-}" \
            "${BASE}/api/cron/news-sync")

          echo "HTTP ${code}"
          cat "$body"
          echo

          # 503은 키가 없다는 뜻이다. 설정 문제라 실패로 표시해 눈에 띄게 한다.
          if [ "$code" != "200" ]; then
            echo "수집 실패 (HTTP ${code})"
            exit 1
          fi

      - name: AI 분석 붙이기
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer ${SECRET:-}" \
            "${BASE}/api/cron/ai-enrichment?limit=5")

          echo "HTTP ${code}"
          cat "$body"
          echo

          # 기사 하나가 이상해서 분석이 안 되는 것은 흔하다. 그때마다 빨간
          # 표시를 띄우면 진짜 고장을 놓친다. 503(키 없음)만 실패로 본다.
          if [ "$code" = "503" ]; then
            echo "AI 키 또는 테이블 설정 문제 — 위 응답을 확인하세요."
            exit 1
          fi
