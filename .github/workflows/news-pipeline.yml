# 뉴스 수집 → 경제 캘린더 → AI 분석
#
# 왜 GitHub Actions인가
# ─────────────────────
# Vercel Hobby의 Cron은 하루 1회만 허용되고, 그 한 자리는 이미 exit-monitor가
# 쓰고 있다. 하루에 한 번 모으는 뉴스는 뉴스가 아니다.
#
# 왜 두 단계로 나누는가
# ─────────────────────
# 수집은 외부 뉴스 API를, 분석은 AI API를 쓴다. 요금 체계도 실패 방식도
# 다르다. 붙여 두면 AI가 429를 뱉을 때 수집까지 같이 죽고, 다음 회차에
# 원문을 처음부터 다시 받는다. 원문은 사실이라 한 번만 받으면 된다.
#
# 분석이 실패해도 워크플로를 실패로 만들지 않는 이유
# ───────────────────────────────────────────────────
# 기사 하나가 이상해서 분석이 안 되는 것은 흔한 일이고, 그때마다 빨간
# 표시가 뜨면 진짜 고장을 놓친다. 대신 응답을 그대로 로그에 남긴다.
#
# ── 준비 ──
# 저장소 Settings → Secrets and variables → Actions:
#   EXIT_MONITOR_URL     예: https://auto-platform-zeta.vercel.app
#   CRON_SECRET          Vercel의 CRON_SECRET 과 **같은 이름, 같은 값**
#
# 왜 이름이 `CRON_SECRET`인가 — 예전에는 `NEWS_CRON_SECRET`이었다
# ──────────────────────────────────────────────────────────────
# 이 워크플로는 첫 실행부터 성공이 **한 번도 없었다**(#582). 실행 로그가
# 이유를 그대로 보여 준다:
#
#     env:
#       BASE: ***
#       SECRET:          <- 비어 있다. 설정된 비밀은 ***로 가려진다
#     HTTP 401 . ***api/cron/news-sync
#
# `NEWS_CRON_SECRET`이라는 비밀은 **저장소에 없다.** 그래서 빈 문자열이
# 나가고, 서버(`/api/cron/*`는 `process.env.CRON_SECRET`과 비교한다)가
# 401로 거절했다.
#
# 반면 `scheduled-exit.yml`은 `secrets.CRON_SECRET`으로 같은 서버를 불러
# **계속 성공한다.** 즉 맞는 값은 이미 저장소에 `CRON_SECRET`이라는
# 이름으로 있다. 사람에게 비밀을 하나 더 넣어 달라고 하는 것보다
# **두 이름을 하나로 줄여 실패 지점 자체를 없애는 것**이 맞다.
#
# 서버 쪽 비교는 그대로다 — 같은 주소, 같은 헤더, 같은 검사. 달라진 것은
# 워크플로가 빈 문자열 대신 실제 값을 보낸다는 것뿐이다.
#
# Vercel 환경변수에 뉴스 공급자 키(FINNHUB_API_KEY 등)와 AI 키
# (OPENAI_API_KEY 등)가 없으면 각 단계가 503으로 그 사실을 알려준다.
name: news-pipeline

on:
  schedule:
    # 30분마다. 뉴스는 15분 단위로 급하지 않고, 자주 돌수록 AI 요금이 는다.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  # 겹쳐 돌면 같은 기사를 두 번 분석한다 — 결과는 같고 요금만 두 배다.
  group: news-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 뉴스 수집 (원문만)
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # 끝 슬래시를 떼어 낸다. 시크릿에 "https://x.app/"처럼 넣으면
          # "…app//api/…"가 되고 Vercel이 308로 되돌린다. 사람이 주소를
          # 붙여넣을 때 가장 흔한 실수인데, 그때 나오는 것은 308 한 줄뿐이라
          # 원인을 알기 어렵다.
          BASE="${BASE%/}"
          if [ -z "${BASE:-}" ]; then
            echo "EXIT_MONITOR_URL 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          # **비어 있으면 보내지 않는다.** 예전에는 빈 문자열을 그대로
          # 보냈고 돌아오는 것은 401 한 줄이었다 — 값이 틀린 것인지 아예
          # 없는 것인지 구분이 안 됐다. `scheduled-exit.yml`은 처음부터
          # 이 선행 검사를 갖고 있었는데 이쪽에만 없었다.
          if [ -z "${SECRET:-}" ]; then
            echo "CRON_SECRET 시크릿이 설정되지 않았습니다 (Settings -> Secrets and variables -> Actions)."
            echo "Vercel 환경변수 CRON_SECRET과 같은 값을 같은 이름으로 넣으세요."
            exit 1
          fi

          body=$(mktemp)
          # -L: 리다이렉트를 따라간다. 308은 메서드와 바디를 유지하므로
          #     헤더(x-admin-secret)도 그대로 간다.
          # url_effective: 실제로 어디에 닿았는지. 리다이렉트가 났으면
          #     그 사실이 로그에 남아야 다음에 주소를 고칠 수 있다.
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 120 \
            -H "Authorization: Bearer ${SECRET:-}" \
            "${BASE}/api/cron/news-sync")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          # 503은 키가 없다는 뜻이다. 설정 문제라 실패로 표시해 눈에 띄게 한다.
          #
          # **이 단계는 `Authorization: Bearer CRON_SECRET`으로 부른다.**
          # 서버(`/api/cron/*`)가 비교하는 것도 `CRON_SECRET`이다 — 이름이
          # 같으므로 "어느 쪽 이름이 맞나"를 다시 묻지 않는다.
          #
          # 비어 있는 경우는 위 선행 검사가 이미 걸렀으므로, 여기까지 온
          # 401은 **값이 다르다**는 뜻이다(GitHub과 Vercel의 CRON_SECRET).
          if [ "$code" = "401" ]; then
            echo "CRON_SECRET이 거절됐습니다 — GitHub의 값과 Vercel의 CRON_SECRET이 다릅니다"
          fi
          if [ "$code" != "200" ]; then
            echo "수집 실패 (HTTP ${code})"
            exit 1
          fi

      - name: 경제 캘린더 동기화
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          # -L: 리다이렉트를 따라간다. 308은 메서드와 바디를 유지하므로
          #     헤더(x-admin-secret)도 그대로 간다.
          # url_effective: 실제로 어디에 닿았는지. 리다이렉트가 났으면
          #     그 사실이 로그에 남아야 다음에 주소를 고칠 수 있다.
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 120 \
            -H "Authorization: Bearer ${SECRET:-}" \
            "${BASE}/api/cron/calendar-sync")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          # 503은 키가 없다는 뜻이라 설정 문제다. 그 외에는 일정이 없거나
          # 일부만 저장된 것이라 워크플로를 실패로 만들지 않는다 —
          # 그때마다 빨간 표시가 뜨면 진짜 고장을 놓친다.
          if [ "$code" = "503" ]; then
            echo "캘린더 공급자 키 또는 테이블 설정 문제 — 위 응답을 확인하세요."
            exit 1
          fi

      - name: AI 분석 붙이기
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          # -L: 리다이렉트를 따라간다. 308은 메서드와 바디를 유지하므로
          #     헤더(x-admin-secret)도 그대로 간다.
          # url_effective: 실제로 어디에 닿았는지. 리다이렉트가 났으면
          #     그 사실이 로그에 남아야 다음에 주소를 고칠 수 있다.
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 300 \
            -H "Authorization: Bearer ${SECRET:-}" \
            "${BASE}/api/cron/ai-enrichment?limit=5")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          # 기사 하나가 이상해서 분석이 안 되는 것은 흔하다. 그때마다 빨간
          # 표시를 띄우면 진짜 고장을 놓친다. 503(키 없음)만 실패로 본다.
          if [ "$code" = "503" ]; then
            echo "AI 키 또는 테이블 설정 문제 — 위 응답을 확인하세요."
            exit 1
          fi

      # 하루 한 번만 돌리면 충분하다. 30분마다 지울 이유가 없고,
      # 삭제는 자주 할수록 사고 확률만 는다.
      - name: 오래된 데이터 정리 (하루 한 번)
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          hour=$(date -u +%H)
          if [ "$hour" != "18" ]; then
            echo "정리는 UTC 18시대(KST 새벽 3시)에만 돕니다. 지금 ${hour}시 — 건너뜁니다."
            exit 0
          fi

          body=$(mktemp)
          # -L: 리다이렉트를 따라간다. 308은 메서드와 바디를 유지하므로
          #     헤더(x-admin-secret)도 그대로 간다.
          # url_effective: 실제로 어디에 닿았는지. 리다이렉트가 났으면
          #     그 사실이 로그에 남아야 다음에 주소를 고칠 수 있다.
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 120 \
            -H "Authorization: Bearer ${SECRET:-}" \
            "${BASE}/api/cron/cleanup?apply=1")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          # 정리가 실패해도 워크플로를 실패로 만들지 않는다. 지울 게 없거나
          # 상한에 걸린 것은 정상이고, 그때마다 빨간 표시가 뜨면 진짜 고장을
          # 놓친다. 응답은 위에 그대로 남는다.
          if [ "$code" = "401" ] || [ "$code" = "503" ]; then
            echo "정리 크론 설정 문제 — 위 응답을 확인하세요."
            exit 1
          fi
