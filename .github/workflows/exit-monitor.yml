# 계단식 거래의 트레일링 · 본전 이동 · 시간 청산 감시 — **백업**
#
# 주 실행자는 Fly Worker다
# ────────────────────────
# 워커가 5분마다 `/api/autotrade/exit-monitor`를 부른다. 워커는 이미
# `ADMIN_SECRET`을 가지고 있어서 **맞춰야 할 비밀이 따로 없다.**
#
# 이 워크플로는 왜 남아 있는가
# ────────────────────────────
# 워커가 죽었을 때의 그물이다. 다만 **이제 필수가 아니다.**
#
# 예전에는 이것이 유일한 실행자였고, 그러려면 GitHub의
# `EXIT_MONITOR_SECRET`이 Vercel의 `ADMIN_SECRET`과 글자 하나까지 같아야
# 했다. 사람이 두 대시보드를 오가며 맞추는 일이고, 한 글자만 달라도 401이다.
#
# **2026-08-03부터 30번 연속 401이었다.** 그동안 트레일링·본전 이동·
# 시간 청산은 한 번도 돌지 않았다. 워크플로는 매번 빨간불만 남겼다.
#
# 시크릿을 맞추는 일을 자동화하는 것보다 **그 시크릿이 필요 없게 만드는
# 것**이 낫다. 그래서 주 경로를 워커로 옮겼고, 여기는 시크릿이 있을 때만
# 돈다. 없으면 실패가 아니라 건너뛴다 — 없는 백업 때문에 빨간불이 쌓이면
# 사람은 곧 이 화면을 안 본다.
#
# 시간
# ────
# 워커가 5분마다 보므로 여기는 한 시간에 한 번이면 충분하다. 겹쳐 돌아도
# 라우트가 같은 판단을 다시 할 뿐이고, 손절 이동은 이미 옮긴 자리면
# 다시 옮기지 않는다.
name: exit-monitor

on:
  schedule:
    # 한 시간에 한 번. 주 실행자(Fly Worker)는 5분마다 본다.
    - cron: '7 * * * *'
  workflow_dispatch:   # 수동 실행 (테스트용)

concurrency:
  # 이전 실행이 끝나지 않았으면 겹쳐 돌리지 않는다.
  # 같은 포지션에 대해 손절 이동이 두 번 나가는 것을 막는다.
  group: exit-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 청산 조건 점검 및 실행
        env:
          BASE:   ${{ secrets.EXIT_MONITOR_URL }}
          SECRET: ${{ secrets.EXIT_MONITOR_SECRET }}
        run: |
          set -euo pipefail
          # 끝 슬래시를 떼어 낸다. 시크릿에 "https://x.app/"처럼 넣으면
          # "…app//api/…"가 되고 Vercel이 308로 되돌린다.
          BASE="${BASE%/}"

          # ── 시크릿이 없으면 실패가 아니라 건너뛴다 ──
          #
          # 주 실행자는 Fly Worker다. 이 백업이 설정돼 있지 않다는 것은
          # 고장이 아니다. **없는 백업 때문에 빨간불이 쌓이면 사람은 곧
          # 이 화면을 안 본다** — 그게 지난 다섯 달이었다.
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::백업 청산 감시가 설정돼 있지 않습니다 (EXIT_MONITOR_URL/SECRET 없음)."
            echo "주 실행자는 Fly Worker이며 ADMIN_SECRET으로 직접 부릅니다 — 이 단계는 건너뜁니다."
            exit 0
          fi

          body=$(mktemp)
          out=$(curl -sSL -o "$body" -w '%{http_code} %{url_effective}' \
            --max-time 90 \
            -H "x-admin-secret: ${SECRET}" \
            -H "x-traigo-source: github-backup" \
            "${BASE}/api/autotrade/exit-monitor")

          code="${out%% *}"
          final="${out#* }"
          echo "HTTP ${code} · ${final}"
          cat "$body"
          echo

          # ── 401도 실패로 만들지 않는다 ──
          #
          # 이 백업의 시크릿이 어긋난 것은 **청산 감시가 멈춘 것과 다르다.**
          # 주 경로(워커)는 자기 ADMIN_SECRET으로 돌고 있다. 여기서 exit 1을
          # 하면 30번 연속 빨간불이 다시 쌓이고, 진짜 고장이 그 안에 묻힌다.
          #
          # 값 자체는 절대 찍지 않는다. 지문(sha256 앞 6자)만 남긴다.
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            mine=$(printf '%s' "${SECRET}" | sha256sum | cut -c1-6)
            echo "::warning::백업 청산 감시가 인증을 거부당했습니다 (HTTP ${code}, 보낸 값의 지문 ${mine})."
            echo "주 실행자(Fly Worker)는 자기 ADMIN_SECRET으로 계속 돕니다."
            echo "이 백업을 살리려면 EXIT_MONITOR_SECRET을 Vercel의 ADMIN_SECRET과 같게 두면 됩니다 —"
            echo "필수는 아닙니다. 살리지 않아도 감시는 멈추지 않습니다."
            exit 0
          fi

          # 서버 오류는 남긴다. 주 경로도 같은 라우트를 부르므로,
          # 여기서 500이면 워커 쪽에서도 500이다 — 그건 진짜 고장이다.
          if [ "$code" != "200" ]; then
            echo "::error::청산 감시 라우트가 HTTP ${code}로 응답했습니다 — 워커 경로도 같은 상태입니다"
            exit 1
          fi
