# production `exchange_connections`의 정체(UNIQUE 제약·인덱스) 상태를 **읽기만** 한다.
#
# 왜 필요한가
# ───────────
# 096은 연결의 정체를 `(user_id, exchange_id)`에서
# `(user_id, exchange_id, is_testnet)`으로 바꾼다. 그러지 않으면 Binance
# 실전 연결이 있는 사용자가 테스트넷을 등록할 때 **기존 실전 row가 갱신된다**
# — 실전 키가 테스트넷 키로 덮인다.
#
# 그런데 `schema_migrations`에는 096이 적용된 것으로 적혀 있는데
# **그 기록을 뒷받침하는 확인이 없다.** `migrationTargets()`는 표·칸·
# 인덱스·정책·함수만 대상으로 보고 **제약은 보지 않는다.** 게다가 096의
# `ADD CONSTRAINT`는 DO 블록 안에 있어서 대상 시야(`stripNoise`)에서
# 아예 보이지 않는다. 그래서 `verifyTargets()`가 `NO_TARGET`을 돌려주고,
# 적용 파이프라인은 096의 효과를 **한 번도 카탈로그에 묻지 않았다.**
#
# 기록이 있는 것과 확인된 것은 다르다. **확인하지 못한 것은 통과가 아니다.**
# 그래서 고치기 전에 **보는 것**부터 한다.
#
# 왜 이렇게 좁게 트리거하나
# ─────────────────────────
#   · `pull_request` 없음      — PR 검토 중에는 운영 DB 접속 0이어야 한다.
#   · `workflow_dispatch` 없음 — 사람이 아무 때나 운영 DB를 두드리는 문을
#                                 만들지 않는다.
#   · `push` + 이 파일 경로    — 이 파일이 main에 들어오는 **그 순간 한 번**만 돈다.
#
# 무엇을 읽는가
# ─────────────
# 카탈로그(`pg_constraint`·`pg_index`·`pg_attribute`)와 마이그레이션 기록
# 한 줄, 그리고 **집계 수치**뿐이다. 겹치는 그룹이 몇 개인지는 096이 애초에
# 성공할 수 있는지를 가르므로 세지만, **어느 사용자인지·키 값은 한 글자도
# 읽지 않는다.** row 내용은 선택하지 않는다.
#
# 쓰기는 Postgres가 거부한다
# ──────────────────────────
# "SELECT만 적었다"는 사람의 보증이다. 그것에 기대지 않는다.
# `BEGIN TRANSACTION READ ONLY`로 열어서, 실수로 mutation이 섞여도
# **DB 자신이 거부**하게 한다. 실제로 그런지 로그에 값으로 남긴다.
#
# 값은 로그에 남지 않는다
# ───────────────────────
# 접속 문자열은 존재 여부만 확인하고, psql이 뱉는 오류에서도 접속 정보를
# 지우고 출력한다. `set -x`는 쓰지 않는다.
name: audit-production-exchange-connection-identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-exchange-connection-identity.yml'

concurrency:
  group: audit-production-exchange-connection-identity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: 연결 표 정체 상태 조회 (읽기 전용)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: DB 접속 정보 확인
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다 — 상태를 확인할 수 없습니다"
            echo "값은 GitHub Secrets에만 있습니다. 이 로그에는 출력하지 않습니다."
            exit 1
          fi
          echo "SUPABASE_DB_URL 존재 확인 (값은 출력하지 않습니다)"

      - name: 상태 조회 (BEGIN TRANSACTION READ ONLY)
        run: |
          set -o pipefail

          cat > /tmp/audit.sql <<'SQL'
          \set ON_ERROR_STOP on

          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '15s';
          SET LOCAL lock_timeout = '3s';

          \echo '=== 0. READ ONLY 증명 ==='
          SELECT 'READ_ONLY=' || current_setting('transaction_read_only') AS assertion;

          \echo ''
          \echo '=== 1. exchange_connections UNIQUE 제약 ==='
          SELECT con.conname                                   AS constraint_name,
                 (SELECT string_agg(att.attname::text, ', ' ORDER BY u.ord)
                    FROM unnest(con.conkey) WITH ORDINALITY AS u(attnum, ord)
                    JOIN pg_attribute att
                      ON att.attrelid = con.conrelid AND att.attnum = u.attnum) AS columns_in_order
            FROM pg_constraint con
            JOIN pg_class     rel ON rel.oid = con.conrelid
            JOIN pg_namespace ns  ON ns.oid  = rel.relnamespace
           WHERE ns.nspname = 'public'
             AND rel.relname = 'exchange_connections'
             AND con.contype = 'u'
           ORDER BY con.conname;

          \echo ''
          \echo '=== 2. exchange_connections 인덱스 전체 ==='
          SELECT idx.relname                                   AS index_name,
                 i.indisunique                                 AS is_unique,
                 (SELECT string_agg(att.attname::text, ', ' ORDER BY k.ord)
                    FROM unnest(i.indkey::smallint[]) WITH ORDINALITY AS k(attnum, ord)
                    JOIN pg_attribute att
                      ON att.attrelid = i.indrelid AND att.attnum = k.attnum) AS columns_in_order,
                 con.conname                                   AS backing_constraint
            FROM pg_index     i
            JOIN pg_class     idx ON idx.oid = i.indexrelid
            JOIN pg_class     rel ON rel.oid = i.indrelid
            JOIN pg_namespace ns  ON ns.oid  = rel.relnamespace
            LEFT JOIN pg_constraint con ON con.conindid = i.indexrelid
           WHERE ns.nspname = 'public'
             AND rel.relname = 'exchange_connections'
           ORDER BY idx.relname;

          \echo ''
          \echo '=== 3. 마이그레이션 096 적용 기록 ==='
          SELECT filename, checksum, status, verified, applied_by, applied_at, verify_detail
            FROM public.schema_migrations
           WHERE filename = '096_exchange_connections_environment_identity.sql';

          \echo ''
          \echo '=== 4. 집계만 — 096 preflight가 멈출 상황인가 ==='
          -- **어느 사용자인지는 읽지 않는다.** 겹치는 그룹이 몇 개인지만 센다.
          SELECT (SELECT count(*) FROM (
                    SELECT 1 FROM public.exchange_connections
                     GROUP BY user_id, exchange_id, is_testnet
                    HAVING count(*) > 1) d)              AS duplicate_env_groups,
                 (SELECT count(*) FROM (
                    SELECT 1 FROM public.exchange_connections
                     GROUP BY user_id, exchange_id
                    HAVING count(*) > 1) d)              AS multi_env_users,
                 (SELECT count(*) FROM public.exchange_connections
                   WHERE is_testnet IS TRUE)             AS testnet_rows,
                 (SELECT count(*) FROM public.exchange_connections
                   WHERE is_testnet IS FALSE)            AS live_rows,
                 (SELECT count(*) FROM public.exchange_connections
                   WHERE is_testnet IS NULL)             AS null_env_rows;

          \echo ''
          \echo '=== 5. 판정 ==='
          -- **이름에 기대지 않는다.** 제약 이름이 예상과 달라도, 제약 없는
          -- UNIQUE 인덱스라도 같은 효과를 내므로 **칸 조합**으로 판정한다.
          WITH uniq AS (
            SELECT idx.relname::text AS index_name,
                   con.conname::text AS constraint_name,
                   (SELECT array_agg(att.attname::text ORDER BY att.attname::text)
                      FROM unnest(i.indkey::smallint[]) AS k(attnum)
                      JOIN pg_attribute att
                        ON att.attrelid = i.indrelid AND att.attnum = k.attnum) AS cols_sorted,
                   i.indisunique
              FROM pg_index     i
              JOIN pg_class     idx ON idx.oid = i.indexrelid
              JOIN pg_class     rel ON rel.oid = i.indrelid
              JOIN pg_namespace ns  ON ns.oid  = rel.relnamespace
              LEFT JOIN pg_constraint con ON con.conindid = i.indexrelid
             WHERE ns.nspname = 'public' AND rel.relname = 'exchange_connections'
          )
          SELECT
            EXISTS (SELECT 1 FROM uniq
                     WHERE indisunique AND cols_sorted = ARRAY['exchange_id','user_id'])
              AS legacy_user_exchange_unique_exists,
            (SELECT coalesce(string_agg(coalesce(constraint_name, '(제약 없는 인덱스)'), ' | '), '(없음)')
               FROM uniq WHERE indisunique AND cols_sorted = ARRAY['exchange_id','user_id'])
              AS legacy_name,
            EXISTS (SELECT 1 FROM uniq
                     WHERE indisunique AND cols_sorted = ARRAY['exchange_id','is_testnet','user_id'])
              AS env_identity_unique_exists,
            (SELECT coalesce(string_agg(coalesce(constraint_name, '(제약 없는 인덱스)'), ' | '), '(없음)')
               FROM uniq WHERE indisunique AND cols_sorted = ARRAY['exchange_id','is_testnet','user_id'])
              AS env_identity_name,
            (SELECT coalesce(string_agg(status || '/' || coalesce(verified::text, 'null'), ' | '), '(기록 없음)')
               FROM public.schema_migrations
              WHERE filename = '096_exchange_connections_environment_identity.sql')
              AS migration_096_record;

          COMMIT;
          SQL

          # ── 가려야 할 조각을 접속 문자열에서 뽑는다. 어디에도 출력하지 않는다 ──
          _u="${SUPABASE_DB_URL}"
          _creds="${_u#*://}"; _creds="${_creds%%@*}"
          _hostpart="${_u#*@}"; _hostpart="${_hostpart%%/*}"; _hostpart="${_hostpart%%\?*}"
          _host="${_hostpart%%:*}"

          rc=0
          out=$(psql "${SUPABASE_DB_URL}" -X -v ON_ERROR_STOP=1 -f /tmp/audit.sql 2>&1) || rc=$?

          scrubbed="${out}"
          scrubbed="${scrubbed//"${_u}"/<접속 문자열 가림>}"
          if [ -n "${_creds}" ] && [ "${_creds}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_creds}"/<접속 정보 가림>}"
          fi
          if [ -n "${_host}" ] && [ "${_host}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_host}"/<host 가림>}"
          fi
          printf '%s\n' "${scrubbed}" | sed -E \
            -e 's#postgres(ql)?://[^[:space:]]*#<접속 문자열 가림>#g' \
            -e 's#(host|hostaddr|password|user)=[^[:space:]]*#\1=<가림>#g'

          if [ "${rc}" -ne 0 ]; then
            echo "::error::조회에 실패했습니다 — '확인하지 못함'을 '없음'으로 적지 않습니다 (psql 종료코드 ${rc})"
            exit "${rc}"
          fi

          if ! printf '%s' "${out}" | grep -q 'READ_ONLY=on'; then
            echo "::error::읽기 전용 트랜잭션이 아니었습니다 — BEGIN TRANSACTION READ ONLY가 빠졌거나 무효화됐습니다"
            exit 1
          fi
          echo "읽기 전용 트랜잭션 확인 (READ_ONLY=on)"

      - name: 다음 단계 안내
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## 연결 표 정체 상태 조회 완료

          위 로그의 `=== 5. 판정 ===` 표를 보세요.

          | env_identity_unique_exists | legacy_user_exchange_unique_exists | 뜻 | 다음 |
          |---|---|---|---|
          | `t` | `f` | 096이 실제로 적용돼 있다 | TESTNET 연결을 추가해도 실전이 덮이지 않습니다 |
          | `f` | `t` | **096이 기록만 있고 실행되지 않았다** | 기록을 바로잡고 096을 실제로 실행해야 합니다 |
          | `t` | `t` | 둘 다 있다 | 옛 제약이 남아 두 번째 환경 등록이 막힙니다 — 그 제약만 지우는 cleanup이 필요합니다 |
          | `f` | `f` | 유일성이 아예 없다 | 같은 환경에 중복 연결이 생길 수 있습니다 |

          `=== 4. 집계 ===`의 `duplicate_env_groups`가 0이 아니면 096의 preflight가
          `RAISE`로 멈춥니다. **그 경우 이 저장소는 데이터를 고치지 않습니다** —
          어느 연결이 맞는지는 사람이 정합니다.

          이 워크플로는 읽기만 합니다. 스키마를 바꾸지 않았습니다.
          MD
