# **배포됐는지 눈으로 보지 말고 값으로 확인한다.**
#
# 왜 이 워크플로가 있나
# ─────────────────────
# `fly-deploy`가 success로 끝난 것과 **운영 서버가 그 커밋으로 돌고 있는
# 것**은 다른 사실이다. #136에서 그 차이 때문에 하루를 잃었다 — 배포
# 실행 기록은 초록인데 Fly에는 옛 코드가 떠 있었고, 아무도 그걸 몰랐다.
#
# `/api/system/deployment`가 그 답을 갖고 있다: Vercel이 어느 SHA로 떠
# 있는지, Fly Worker heartbeat가 어느 SHA를 보고하는지, 둘이 main과 같은지.
# **인증이 필요 없는 경로다** — 여기서 부를 때 시크릿을 쓰지 않는다.
#
# 사람이 브라우저로 열어서 캡처해 보내는 대신, 필요할 때 눌러서 값으로
# 받는다. 캡처는 다시 확인할 수 없고 로그는 남는다.
name: deployment-check

on:
  workflow_dispatch:
    inputs:
      main:
        description: '비교할 main SHA (비우면 서버가 아는 값으로만 판정)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 배포 SHA 확인
        env:
          # exit-monitor가 쓰는 것과 같은 주소 시크릿. **값은 안 찍는다** —
          # 아래에서 URL을 그대로 echo하지 않는 이유다.
          BASE: ${{ secrets.EXIT_MONITOR_URL }}
          MAIN: ${{ github.event.inputs.main }}
        run: |
          set -euo pipefail
          BASE="${BASE%/}"
          if [ -z "${BASE:-}" ]; then
            echo "EXIT_MONITOR_URL 시크릿이 없습니다 — 확인할 주소를 모릅니다."
            exit 1
          fi

          url="${BASE}/api/system/deployment"
          if [ -n "${MAIN:-}" ]; then url="${url}?main=${MAIN}"; fi

          body=$(mktemp)
          # 이 경로는 인증이 없다. 헤더를 붙이지 않는다.
          code=$(curl -sSL -o "$body" -w '%{http_code}' --max-time 60 "$url")
          echo "HTTP ${code}"
          cat "$body"
          echo

          if [ "$code" != "200" ]; then
            echo "배포 상태를 읽지 못했습니다 (HTTP ${code})"
            exit 1
          fi

          # **판정을 로그 맨 끝에 한 줄로 남긴다.** 본문이 길어도
          # 결론은 한 줄에서 읽힌다.
          verdict=$(python3 -c "import json,sys; d=json.load(open('$body')); print(d.get('verdict') or '(없음)')")
          echo "verdict: ${verdict}"
          if [ -n "${MAIN:-}" ] && [ "$verdict" != "MATCHED" ]; then
            echo "main(${MAIN})과 실제 배포가 다릅니다 — 위 vercel.sha · fly.sha를 보세요."
            exit 1
          fi
