# **배포됐는지 눈으로 보지 말고 값으로 확인한다.**
#
# 왜 이 워크플로가 있나
# ─────────────────────
# `fly-deploy`가 success로 끝난 것과 **운영 서버가 그 커밋으로 돌고 있는
# 것**은 다른 사실이다. #136에서 그 차이 때문에 하루를 잃었다 — 배포
# 실행 기록은 초록인데 Fly에는 옛 코드가 떠 있었고, 아무도 그걸 몰랐다.
#
# `/api/system/deployment`가 그 답을 갖고 있다: Vercel이 어느 SHA로 떠
# 있는지, Fly Worker heartbeat가 어느 SHA를 보고하는지, 둘이 main과 같은지.
# **인증이 필요 없는 경로다** — 여기서 부를 때 시크릿을 쓰지 않는다.
#
# 사람이 브라우저로 열어서 캡처해 보내는 대신, 값으로 받는다. 캡처는
# 다시 확인할 수 없고 로그는 남는다.
#
# ⚠ **누르는 것도 사람이 하는 일이다.**
#
# 이 워크플로는 오랫동안 `workflow_dispatch`뿐이었다. 그래서 배포가
# 끝나도 아무도 안 눌렀고, 마지막 실행은 #206 시점(797639c9)에 멈춰
# 있었다 — 그 뒤로 #207·#208·#209·#210이 main에 들어가는 동안
# **main·Vercel·Fly가 같은 커밋인지 확인한 적이 한 번도 없다.**
#
# 최상위 규칙이 말하는 그대로다: 자동화할 수 있는 절차를 사람에게
# 넘기지 않는다. fly-deploy가 끝나면 여기가 스스로 깨어난다.
name: deployment-check

on:
  workflow_dispatch:
    inputs:
      main:
        description: '비교할 main SHA (비우면 서버가 아는 값으로만 판정)'
        required: false

  # 워커 배포가 끝난 뒤에 본다. `fly-deploy`의 마지막 단계는 워커가
  # 살아났는지만 보고(`wait-worker-alive`), **main·Vercel·Fly 세 SHA가
  # 같은지**는 여기서만 본다. 둘은 다른 질문이다.
  workflow_run:
    workflows: [fly-deploy]
    types: [completed]

jobs:
  check:
    # 배포가 성공한 main에 대해서만 본다. 실패한 배포나 다른 브랜치를
    # 두고 "배포가 어긋났다"고 적으면, 그 빨강은 진짜 어긋난 날의
    # 빨강과 구별되지 않는다.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # **판정을 YAML 안에 두지 않는다.**
      #
      # 여기 있던 한 줄짜리 python이 `verdict`를 문자열로 취급했다.
      # 실제로는 객체(`{code, matched, reason}`)라 문자열 `MATCHED`와
      # 절대 같아지지 않았고, **8번 실행해서 8번 다 실패**했다 —
      # 그동안 배포는 멀쩡했다. 언제나 빨강인 검사는 진짜 어긋난 날의
      # 빨강과 구별되지 않는다.
      #
      # 판정은 src/lib/ops/deploymentCheck.ts에 있고 테스트가 붙어 있다.
      - name: 배포 SHA 확인
        env:
          # exit-monitor가 쓰는 것과 같은 주소 시크릿. **값은 안 찍는다.**
          BASE: ${{ secrets.EXIT_MONITOR_URL }}
          # 손으로 돌리면 입력값, 배포 뒤 자동이면 **그 배포가 만든 커밋**.
          # 비워 두면 서버가 아는 값끼리만 비교하고 main과는 대조하지 않는다.
          MAIN: ${{ github.event.inputs.main || github.event.workflow_run.head_sha }}
        run: node scripts/verify-deployment.mjs
