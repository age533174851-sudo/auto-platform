# production의 LEGACY runtime 스키마가 canonical migration이 기대할 모양과
# 실제로 같은지 **읽기만** 해서 확인한다.
#
# 왜 필요한가
# ───────────
# `kill_switch.sql`·`jobs.sql`은 번호 없는 LEGACY 파일이라 자동 적용 대상이
# 아니다. 그런데 그 둘이 표 6개의 **유일한 출처**이고 번호 마이그레이션
# 5개(054·057·066·067·073)가 그 표에 의존한다. 그래서 언젠가 번호를 붙여
# 정본에 넣어야 한다.
#
# 문제는 그때 운영 DB에서 무슨 일이 벌어지느냐다. `apply-migrations.mjs`의
# 채택 판정(`catalogHas`)은 **이름만** 본다:
#
#   table  -> information_schema.tables (table_name)
#   index  -> pg_indexes (indexname)
#   policy -> pg_policies (tablename, policyname)
#
# column·type·default·제약·RLS는 보지 않는다. 그래서 **이름은 전부 있는데
# 정의가 다르면** runner는 그것을 모른 채 BASELINE으로 채택하고 SQL을
# 실행하지 않는다. 정본과 운영이 갈린 채로 "적용됨"으로 기록된다.
#
# 반대로 이름이 하나라도 없으면 그 파일이 **실제로 실행된다.** 그 안에는
# `DROP POLICY` + `CREATE POLICY`가 있으므로 운영 보안 정책을 갈아엎는다.
#
# 그래서 이 감사는 두 질문을 **갈라서** 답한다:
#   ① runner가 BASELINE 채택할 것인가
#   ② 채택해도 의미상 안전한가 (정의가 정말 같은가)
#
# 가장 위험한 것은 ①=YES · ②=NO다. runner가 어긋남을 못 보고 실행을
# 생략하는 상태다.
#
# 기대값은 어디서 왔나
# ────────────────────
# **canonical fresh chain의 최종 결과**다:
#   kill_switch.sql -> jobs.sql -> 022 -> 054 -> 057 -> 066 -> 067 -> 073
# legacy 파일 원본과만 비교하면 후속 ALTER(054·057·066·067·073)가 빠진다.
# production에는 그 ALTER가 이미 적용돼 있으므로 최종 모양과 비교해야 한다.
#
# 022가 `kill_switch_log`에도 `_service` 정책을 만든다는 것도 이 과정에서
# 드러났다 — 022의 대상 배열은 넷이다(worker_lock · worker_heartbeat ·
# telegram_alert_log · kill_switch_log). 그래서 기대 정책은 7개다.
#
# 왜 이렇게 좁게 트리거하나
# ─────────────────────────
#   · `pull_request` 없음      — PR 검토 중에는 운영 DB 접속이 0이어야 한다
#   · `workflow_dispatch` 없음 — 아무 때나 운영 DB를 두드리는 문을 만들지 않는다
#   · `push` + 이 파일 경로    — 이 파일이 main에 들어오는 그때 한 번 돈다
#
# 이름만 보는 감사는 감사가 아니다
# ─────────────────────────────
# 첫 판은 세 곳에서 거짓 초록이 났다:
#
#   · RLS를 `relrowsecurity`만 보고 `relforcerowsecurity`는 출력만 했다.
#     FORCE RLS는 표 소유자에게도 RLS를 적용하느냐를 바꾸는 **보안 계약**이라
#     canonical과 달라도 통과할 수 있었다.
#   · 칸 비교에서 `attnum`(순서)·`attidentity`·`attgenerated`를 출력만 하고
#     판정에서 뺐다. 이름·타입·null·default가 같으면 순서가 달라도 통과했다.
#   · 표를 이름으로 먼저 잡고 나중에 public으로 걸렀다. public에는 없고 다른
#     스키마에 같은 이름이 있으면 **그 대상 줄이 통째로 사라졌다.**
#
# 셋 다 고쳤고, 각각을 되돌린 픽스처로 FALSE가 나오는 것을 확인했다.
#
# 쓰기는 Postgres가 거부한다
# ──────────────────────────
# `BEGIN TRANSACTION READ ONLY`로 열고, 실제로 `READ_ONLY=on`이었는지 값으로
# 확인한다. 확인이 안 되면 실패로 끝난다. 업무 데이터는 한 줄도 읽지 않는다 —
# `pg_catalog`·`information_schema`와 마이그레이션 기록뿐이다.
name: audit-production-legacy-runtime-schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-legacy-runtime-schema.yml'

concurrency:
  group: audit-production-legacy-runtime-schema
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: LEGACY runtime 스키마 조회 (읽기 전용)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      # 접속 정보가 없으면 여기서 멈춘다. 없이 내려가면 "아무것도 안 나왔다"가
      # "없다"처럼 보인다. **확인하지 못한 것은 통과가 아니다.**
      - name: DB 접속 정보 확인
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다 — 상태를 확인할 수 없습니다"
            echo "값은 GitHub Secrets에만 있습니다. 이 로그에는 출력하지 않습니다."
            exit 1
          fi
          echo "SUPABASE_DB_URL 존재 확인 (값은 출력하지 않습니다)"

      - name: 스키마 조회 (BEGIN TRANSACTION READ ONLY)
        run: |
          set -o pipefail

          cat > /tmp/audit-legacy.sql <<'SQL'
          \set ON_ERROR_STOP on

          -- 쓰기를 Postgres 자신이 거부하게 만든다.
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '15s';
          SET LOCAL lock_timeout = '3s';

          \echo '=== 0. READ ONLY 증명 ==='
          SELECT 'READ_ONLY=' || current_setting('transaction_read_only') AS assertion;

          \echo ''
          \echo '=== 1. TABLE EXISTENCE ==='
          -- **public relation을 직접 찾는다.** 이름으로 먼저 잡고 나중에 public으로
          -- 거르면, public에는 없고 다른 스키마에 같은 이름이 있을 때 그 대상 줄이
          -- 통째로 사라진다. 대상 6개는 언제나 6줄이 나와야 한다.
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs'))
          SELECT t.tbl                              AS table_name,
                 (pub.oid IS NOT NULL)              AS table_present,
                 'public'                           AS schema,
                 coalesce(pub.relkind::text, '(없음)') AS relkind,
                 coalesce(pub.oid::text, '(없음)')     AS pg_class_oid
            FROM target_tables t
            LEFT JOIN LATERAL (
                   SELECT c.oid, c.relkind, c.relrowsecurity, c.relforcerowsecurity
                     FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public' AND c.relname = t.tbl
                 ) pub ON true
           ORDER BY t.tbl;

          \echo ''
          \echo '=== 2. COLUMN SHAPE (production 전수) ==='
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs'))
          SELECT c.relname AS table_name, a.attnum, a.attname AS column_name,
                 tp.typname AS data_type,
                 format_type(a.atttypid, a.atttypmod) AS formatted_type,
                 (NOT a.attnotnull) AS nullable,
                 coalesce(pg_get_expr(d.adbin, d.adrelid), '') AS default_expr,
                 a.attidentity::text  AS identity,
                 a.attgenerated::text AS generated
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
            JOIN pg_type tp ON tp.oid = a.atttypid
            LEFT JOIN pg_attrdef d ON d.adrelid = c.oid AND d.adnum = a.attnum
           WHERE n.nspname = 'public' AND c.relname IN (SELECT tbl FROM target_tables)
           ORDER BY c.relname, a.attnum;

          \echo ''
          \echo '=== 2-1. COLUMN DIFF (기대 vs production) — 비어 있어야 정상 ==='
          -- **출력만 하고 판정에서 빼지 않는다.** attnum(칸 순서)·identity·generated도
          -- 비교한다. 이름·타입·null·default가 같아도 순서나 identity가 다르면 그건
          -- 다른 스키마다.
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs')),
          expected_columns(tbl, attnum, col, ftype, nn, def, ident, gen) AS (VALUES
          ('jobs',1,'id','uuid','true','gen_random_uuid()','',''),
            ('jobs',2,'user_id','uuid','false','','',''),
            ('jobs',3,'connection_id','text','false','','',''),
            ('jobs',4,'exchange','text','false','''binance''::text','',''),
            ('jobs',5,'mode','text','false','','',''),
            ('jobs',6,'action','text','true','','',''),
            ('jobs',7,'symbol','text','false','','',''),
            ('jobs',8,'side','text','false','','',''),
            ('jobs',9,'quantity','numeric','false','','',''),
            ('jobs',10,'percent','numeric','false','','',''),
            ('jobs',11,'payload','jsonb','false','''{}''::jsonb','',''),
            ('jobs',12,'status','text','false','''PENDING''::text','',''),
            ('jobs',13,'priority','integer','false','5','',''),
            ('jobs',14,'attempts','integer','false','0','',''),
            ('jobs',15,'max_attempts','integer','false','5','',''),
            ('jobs',16,'locked_by','text','false','','',''),
            ('jobs',17,'locked_until','timestamp with time zone','false','','',''),
            ('jobs',18,'result','jsonb','false','','',''),
            ('jobs',19,'error','text','false','','',''),
            ('jobs',20,'created_at','timestamp with time zone','false','now()','',''),
            ('jobs',21,'updated_at','timestamp with time zone','false','now()','',''),
            ('jobs',22,'completed_at','timestamp with time zone','false','','',''),
            ('kill_switch_log',1,'id','uuid','true','gen_random_uuid()','',''),
            ('kill_switch_log',2,'user_id','uuid','false','','',''),
            ('kill_switch_log',3,'connection_id','text','false','','',''),
            ('kill_switch_log',4,'at','timestamp with time zone','false','now()','',''),
            ('kill_switch_log',5,'reason','text','false','','',''),
            ('kill_switch_log',6,'equity','numeric','false','','',''),
            ('kill_switch_log',7,'drawdown_pct','numeric','false','','',''),
            ('kill_switch_log',8,'action','text','false','','',''),
            ('kill_switch_log',9,'mode','text','false','','',''),
            ('kill_switch_state',1,'user_id','uuid','true','','',''),
            ('kill_switch_state',2,'connection_id','text','true','','',''),
            ('kill_switch_state',3,'enabled','boolean','false','true','',''),
            ('kill_switch_state',4,'daily_limit_pct','numeric','false','5','',''),
            ('kill_switch_state',5,'weekly_limit_pct','numeric','false','10','',''),
            ('kill_switch_state',6,'monthly_limit_pct','numeric','false','20','',''),
            ('kill_switch_state',7,'abs_limit_usdt','numeric','false','0','',''),
            ('kill_switch_state',8,'action_mode','text','false','''BC''::text','',''),
            ('kill_switch_state',9,'active','boolean','false','false','',''),
            ('kill_switch_state',10,'triggered_at','timestamp with time zone','false','','',''),
            ('kill_switch_state',11,'trigger_reason','text','false','','',''),
            ('kill_switch_state',12,'daily_start_equity','numeric','false','','',''),
            ('kill_switch_state',13,'daily_start_at','timestamp with time zone','false','','',''),
            ('kill_switch_state',14,'weekly_start_equity','numeric','false','','',''),
            ('kill_switch_state',15,'weekly_start_at','timestamp with time zone','false','','',''),
            ('kill_switch_state',16,'monthly_start_equity','numeric','false','','',''),
            ('kill_switch_state',17,'monthly_start_at','timestamp with time zone','false','','',''),
            ('kill_switch_state',18,'updated_at','timestamp with time zone','false','now()','',''),
            ('kill_switch_state',19,'effective_action_mode','text','false','','',''),
            ('kill_switch_state',20,'targeted_pending','boolean','false','','',''),
            ('telegram_alert_log',1,'id','uuid','true','gen_random_uuid()','',''),
            ('telegram_alert_log',2,'created_at','timestamp with time zone','false','now()','',''),
            ('telegram_alert_log',3,'severity','text','false','','',''),
            ('telegram_alert_log',4,'channel','text','false','','',''),
            ('telegram_alert_log',5,'event_type','text','false','','',''),
            ('telegram_alert_log',6,'exchange','text','false','','',''),
            ('telegram_alert_log',7,'symbol','text','false','','',''),
            ('telegram_alert_log',8,'dedup_key','text','false','','',''),
            ('telegram_alert_log',9,'message','text','false','','',''),
            ('telegram_alert_log',10,'sent','boolean','false','false','',''),
            ('telegram_alert_log',11,'throttled','boolean','false','false','',''),
            ('telegram_alert_log',12,'escalated','boolean','false','false','',''),
            ('telegram_alert_log',13,'aggregated_count','integer','false','0','',''),
            ('telegram_alert_log',14,'error','text','false','','',''),
            ('worker_heartbeat',1,'worker_id','text','true','','',''),
            ('worker_heartbeat',2,'last_seen','timestamp with time zone','false','now()','',''),
            ('worker_heartbeat',3,'status','text','false','','',''),
            ('worker_heartbeat',4,'current_task','text','false','','',''),
            ('worker_heartbeat',5,'error_count','integer','false','0','',''),
            ('worker_heartbeat',6,'updated_at','timestamp with time zone','false','now()','',''),
            ('worker_heartbeat',7,'version','text','false','','',''),
            ('worker_heartbeat',8,'provider','text','false','','',''),
            ('worker_heartbeat',9,'region','text','false','','',''),
            ('worker_heartbeat',10,'machine_id','text','false','','',''),
            ('worker_heartbeat',11,'started_at','timestamp with time zone','false','','',''),
            ('worker_heartbeat',12,'tick_count','bigint','false','','',''),
            ('worker_heartbeat',13,'supabase_fingerprint','text','false','','',''),
            ('worker_heartbeat',14,'encryption_fingerprint','text','false','','',''),
            ('worker_heartbeat',15,'startup_ok','boolean','false','','',''),
            ('worker_heartbeat',16,'startup_detail','text','false','','',''),
            ('worker_heartbeat',17,'project_ref','text','false','','',''),
            ('worker_heartbeat',18,'scheduler','jsonb','false','','',''),
            ('worker_lock',1,'name','text','true','','',''),
            ('worker_lock',2,'holder','text','false','','',''),
            ('worker_lock',3,'expires_at','timestamp with time zone','false','','',''),
            ('worker_lock',4,'acquired_at','timestamp with time zone','false','now()','','')),
          actual AS (
            SELECT c.relname AS tbl, a.attnum, a.attname AS col,
                   format_type(a.atttypid, a.atttypmod) AS ftype,
                   a.attnotnull::text AS nn,
                   coalesce(pg_get_expr(d.adbin, d.adrelid), '') AS def,
                   a.attidentity::text AS ident, a.attgenerated::text AS gen
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
              LEFT JOIN pg_attrdef d ON d.adrelid = c.oid AND d.adnum = a.attnum
             WHERE n.nspname = 'public' AND c.relname IN (SELECT tbl FROM target_tables)
          )
          SELECT coalesce(e.tbl, a.tbl) AS table_name,
                 coalesce(e.col, a.col) AS column_name,
                 CASE WHEN a.col IS NULL THEN 'production에 없음'
                      WHEN e.col IS NULL THEN 'production에만 있음(정본 밖)'
                      ELSE 'shape 다름' END AS diff,
                 e.attnum AS expected_attnum, a.attnum AS actual_attnum,
                 e.ftype  AS expected_type,   a.ftype  AS actual_type,
                 e.nn     AS expected_notnull, a.nn    AS actual_notnull,
                 e.def    AS expected_default, a.def   AS actual_default,
                 e.ident  AS expected_identity, a.ident AS actual_identity,
                 e.gen    AS expected_generated, a.gen  AS actual_generated
            FROM expected_columns e
            FULL OUTER JOIN actual a ON a.tbl = e.tbl AND a.col = e.col
           WHERE     a.col IS NULL OR e.col IS NULL
              OR e.attnum IS DISTINCT FROM a.attnum
              OR e.ftype  IS DISTINCT FROM a.ftype
              OR e.nn     IS DISTINCT FROM a.nn
              OR e.def    IS DISTINCT FROM a.def
              OR e.ident  IS DISTINCT FROM a.ident
              OR e.gen    IS DISTINCT FROM a.gen
           ORDER BY 1, 2;

          \echo ''
          \echo '=== 3. CONSTRAINTS (production 전수) ==='
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs'))
          SELECT c.relname AS table_name, con.conname AS constraint_name, con.contype::text AS contype,
                 (SELECT string_agg(att.attname::text, ', ' ORDER BY u.ord)
                    FROM unnest(con.conkey) WITH ORDINALITY AS u(attnum, ord)
                    JOIN pg_attribute att ON att.attrelid = con.conrelid AND att.attnum = u.attnum) AS columns_in_order,
                 pg_get_constraintdef(con.oid) AS condef
            FROM pg_constraint con JOIN pg_class c ON c.oid = con.conrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
           WHERE n.nspname = 'public' AND c.relname IN (SELECT tbl FROM target_tables)
           ORDER BY c.relname, con.conname;

          \echo ''
          \echo '=== 3-1. CONSTRAINT DIFF — 비어 있어야 정상 ==='
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs')),
          expected_constraints(tbl, conname, contype, condef) AS (VALUES
          ('jobs','jobs_action_chk','c','CHECK ((action = ANY (ARRAY[''CLOSE_POSITION''::text, ''CLOSE_ALL_POSITIONS''::text, ''CANCEL_ALL_ORDERS''::text, ''PLACE_ORDER''::text, ''SET_TPSL''::text, ''REVERSE_POSITION''::text, ''KILL_SWITCH_EXECUTE''::text])))'),
            ('jobs','jobs_pkey','p','PRIMARY KEY (id)'),
            ('jobs','jobs_status_chk','c','CHECK ((status = ANY (ARRAY[''PENDING''::text, ''PROCESSING''::text, ''COMPLETED''::text, ''FAILED''::text, ''CANCELLED''::text])))'),
            ('kill_switch_log','kill_switch_log_pkey','p','PRIMARY KEY (id)'),
            ('kill_switch_state','kill_switch_state_pkey','p','PRIMARY KEY (user_id, connection_id)'),
            ('telegram_alert_log','telegram_alert_log_pkey','p','PRIMARY KEY (id)'),
            ('worker_heartbeat','worker_heartbeat_pkey','p','PRIMARY KEY (worker_id)'),
            ('worker_lock','worker_lock_pkey','p','PRIMARY KEY (name)')),
          actual AS (
            SELECT c.relname AS tbl, con.conname AS conname, con.contype::text AS contype,
                   pg_get_constraintdef(con.oid) AS condef
              FROM pg_constraint con JOIN pg_class c ON c.oid = con.conrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public' AND c.relname IN (SELECT tbl FROM target_tables)
          )
          SELECT coalesce(e.tbl, a.tbl) AS table_name, coalesce(e.conname, a.conname) AS constraint_name,
                 CASE WHEN a.conname IS NULL THEN 'production에 없음'
                      WHEN e.conname IS NULL THEN 'production에만 있음(정본 밖)'
                      ELSE '정의 다름' END AS diff,
                 e.condef AS expected_def, a.condef AS actual_def
            FROM expected_constraints e
            FULL OUTER JOIN actual a ON a.tbl = e.tbl AND a.conname = e.conname
           WHERE a.conname IS NULL OR e.conname IS NULL
              OR e.contype IS DISTINCT FROM a.contype OR e.condef IS DISTINCT FROM a.condef
           ORDER BY 1, 2;

          \echo ''
          \echo '=== 4. INDEXES (production 전수) ==='
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs'))
          SELECT c.relname AS table_name, i.relname AS index_name,
                 idx.indisunique AS is_unique, idx.indisprimary AS is_primary,
                 (SELECT string_agg(att.attname::text, ', ' ORDER BY k.ord)
                    FROM unnest(idx.indkey::smallint[]) WITH ORDINALITY AS k(attnum, ord)
                    JOIN pg_attribute att ON att.attrelid = idx.indrelid AND att.attnum = k.attnum) AS columns_in_order,
                 (idx.indexprs IS NOT NULL) AS has_expression,
                 coalesce(pg_get_expr(idx.indpred, idx.indrelid), '') AS predicate,
                 pg_get_indexdef(idx.indexrelid) AS indexdef,
                 con.conname AS backing_constraint
            FROM pg_index idx JOIN pg_class i ON i.oid = idx.indexrelid
            JOIN pg_class c ON c.oid = idx.indrelid JOIN pg_namespace n ON n.oid = c.relnamespace
            LEFT JOIN pg_constraint con ON con.conindid = idx.indexrelid
           WHERE n.nspname = 'public' AND c.relname IN (SELECT tbl FROM target_tables)
           ORDER BY c.relname, i.relname;

          \echo ''
          \echo '=== 4-1. 이름 붙은 인덱스 4개 — 이름이 아니라 정의로 판정 ==='
          WITH expected_indexes(tbl, idxname, iddef) AS (VALUES
          ('jobs','idx_jobs_conn','CREATE INDEX idx_jobs_conn ON public.jobs USING btree (connection_id, status)'),
            ('jobs','idx_jobs_pending','CREATE INDEX idx_jobs_pending ON public.jobs USING btree (status, priority, created_at) WHERE (status = ''PENDING''::text)'),
            ('jobs','jobs_pkey','CREATE UNIQUE INDEX jobs_pkey ON public.jobs USING btree (id)'),
            ('kill_switch_log','kill_switch_log_pkey','CREATE UNIQUE INDEX kill_switch_log_pkey ON public.kill_switch_log USING btree (id)'),
            ('kill_switch_state','idx_kill_switch_conn','CREATE INDEX idx_kill_switch_conn ON public.kill_switch_state USING btree (connection_id)'),
            ('kill_switch_state','kill_switch_state_pkey','CREATE UNIQUE INDEX kill_switch_state_pkey ON public.kill_switch_state USING btree (user_id, connection_id)'),
            ('telegram_alert_log','idx_tg_dedup','CREATE INDEX idx_tg_dedup ON public.telegram_alert_log USING btree (dedup_key, created_at DESC)'),
            ('telegram_alert_log','telegram_alert_log_pkey','CREATE UNIQUE INDEX telegram_alert_log_pkey ON public.telegram_alert_log USING btree (id)'),
            ('worker_heartbeat','worker_heartbeat_pkey','CREATE UNIQUE INDEX worker_heartbeat_pkey ON public.worker_heartbeat USING btree (worker_id)'),
            ('worker_lock','worker_lock_pkey','CREATE UNIQUE INDEX worker_lock_pkey ON public.worker_lock USING btree (name)')),
          named(idxname) AS (VALUES ('idx_kill_switch_conn'),('idx_tg_dedup'),('idx_jobs_pending'),('idx_jobs_conn')),
          actual AS (
            SELECT i.relname AS idxname, pg_get_indexdef(idx.indexrelid) AS iddef, idx.indisunique,
                   coalesce(pg_get_expr(idx.indpred, idx.indrelid), '') AS predicate,
                   (SELECT string_agg(att.attname::text, ', ' ORDER BY k.ord)
                      FROM unnest(idx.indkey::smallint[]) WITH ORDINALITY AS k(attnum, ord)
                      JOIN pg_attribute att ON att.attrelid = idx.indrelid AND att.attnum = k.attnum) AS cols
              FROM pg_index idx JOIN pg_class i ON i.oid = idx.indexrelid
              JOIN pg_class c ON c.oid = idx.indrelid JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
          )
          SELECT nm.idxname AS index_name,
                 (a.idxname IS NOT NULL) AS index_present,
                 coalesce(a.cols, '(없음)') AS actual_columns,
                 coalesce(a.indisunique::text, '(없음)') AS actual_unique,
                 coalesce(a.predicate, '(없음)') AS actual_predicate,
                 coalesce(e.iddef, '(기대 없음)') AS expected_def,
                 coalesce(a.iddef, '(없음)') AS actual_def,
                 (a.iddef IS NOT NULL AND a.iddef = e.iddef) AS semantic_match
            FROM named nm
            LEFT JOIN actual a ON a.idxname = nm.idxname
            LEFT JOIN expected_indexes e ON e.idxname = nm.idxname
           ORDER BY nm.idxname;

          \echo ''
          \echo '=== 5. RLS (relrowsecurity + relforcerowsecurity 둘 다 판정한다) ==='
          -- **FORCE RLS도 계약이다.** 켜져 있는지만 보면, canonical이 FORCE off인데
          -- production이 FORCE on으로 바뀌어 있어도 통과한다. FORCE는 표 소유자에게도
          -- RLS를 적용하느냐를 바꾸므로 보안 의미가 다르다.
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs')),
          expected_rls(tbl, exp_rls, exp_force) AS (VALUES
          ('jobs','true','false'),
            ('kill_switch_log','true','false'),
            ('kill_switch_state','true','false'),
            ('telegram_alert_log','true','false'),
            ('worker_heartbeat','true','false'),
            ('worker_lock','true','false'))
          SELECT t.tbl AS table_name,
                 coalesce(pub.relrowsecurity::text, '(표 없음)')      AS actual_rls,
                 coalesce(pub.relforcerowsecurity::text, '(표 없음)') AS actual_force_rls,
                 coalesce(r.exp_rls, '(기대 없음)')                   AS expected_rls,
                 coalesce(r.exp_force, '(기대 없음)')                 AS expected_force_rls,
                 (pub.oid IS NOT NULL
                  AND pub.relrowsecurity::text      IS NOT DISTINCT FROM r.exp_rls
                  AND pub.relforcerowsecurity::text IS NOT DISTINCT FROM r.exp_force) AS rls_match
            FROM target_tables t
            LEFT JOIN expected_rls r ON r.tbl = t.tbl
            LEFT JOIN LATERAL (
                   SELECT c.oid, c.relkind, c.relrowsecurity, c.relforcerowsecurity
                     FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public' AND c.relname = t.tbl
                 ) pub ON true
           ORDER BY t.tbl;

          \echo ''
          \echo '=== 6. POLICIES (production 전수 + 기대 비교) ==='
          WITH target_tables(tbl) AS (VALUES
            ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
            ('worker_heartbeat'),('worker_lock'),('jobs')),
          expected_policies(tbl, polname, permissive, cmd, roles, qual, withcheck) AS (VALUES
          ('jobs','jobs_owner','PERMISSIVE','SELECT','public','(auth.uid() = user_id)',''),
            ('kill_switch_log','kill_switch_log_service','PERMISSIVE','ALL','service_role','true','true'),
            ('kill_switch_log','ks_log_owner','PERMISSIVE','SELECT','public','(auth.uid() = user_id)',''),
            ('kill_switch_state','ks_state_owner','PERMISSIVE','ALL','public','(auth.uid() = user_id)','(auth.uid() = user_id)'),
            ('telegram_alert_log','telegram_alert_log_service','PERMISSIVE','ALL','service_role','true','true'),
            ('worker_heartbeat','worker_heartbeat_service','PERMISSIVE','ALL','service_role','true','true'),
            ('worker_lock','worker_lock_service','PERMISSIVE','ALL','service_role','true','true')),
          actual AS (
            SELECT tablename AS tbl, policyname AS polname, permissive, cmd,
                   coalesce(array_to_string(roles, ','), '') AS roles,
                   coalesce(qual, '') AS qual, coalesce(with_check, '') AS withcheck
              FROM pg_policies
             WHERE schemaname = 'public' AND tablename IN (SELECT tbl FROM target_tables)
          )
          SELECT coalesce(e.tbl, a.tbl) AS table_name, coalesce(e.polname, a.polname) AS policy_name,
                 (a.polname IS NOT NULL) AS policy_present,
                 coalesce(a.permissive, '(없음)') AS actual_permissive,
                 coalesce(a.cmd, '(없음)') AS actual_cmd,
                 coalesce(a.roles, '(없음)') AS actual_roles,
                 coalesce(a.qual, '(없음)') AS actual_using,
                 coalesce(a.withcheck, '(없음)') AS actual_with_check,
                 (a.cmd IS NOT DISTINCT FROM e.cmd)             AS command_match,
                 (a.roles IS NOT DISTINCT FROM e.roles)         AS roles_match,
                 (a.qual IS NOT DISTINCT FROM e.qual)           AS using_match,
                 (a.withcheck IS NOT DISTINCT FROM e.withcheck) AS with_check_match,
                 (a.polname IS NOT NULL AND e.polname IS NOT NULL
                  AND a.permissive IS NOT DISTINCT FROM e.permissive
                  AND a.cmd IS NOT DISTINCT FROM e.cmd
                  AND a.roles IS NOT DISTINCT FROM e.roles
                  AND a.qual IS NOT DISTINCT FROM e.qual
                  AND a.withcheck IS NOT DISTINCT FROM e.withcheck) AS semantic_match
            FROM expected_policies e
            FULL OUTER JOIN actual a ON a.tbl = e.tbl AND a.polname = e.polname
           ORDER BY 1, 2;

          \echo ''
          \echo '=== 9. migration metadata (관련 파일만) ==='
          SELECT filename, status, verified, checksum, applied_by, applied_at
            FROM public.schema_migrations
           WHERE filename IN ('022_rls_worker_tables.sql','054_worker_version.sql','057_worker_runtime.sql',
                              '066_worker_project_ref.sql','067_kill_switch_effective_mode.sql','073_worker_scheduler.sql')
           ORDER BY filename;

          \echo ''
          \echo '=== 7. RUNNER BASELINE TARGET (apply-migrations.mjs의 catalogHas 재현) ==='
          -- **여기는 일부러 스키마를 지정하지 않는다.** 목적이 "runner가 어떻게
          -- 판정하는가"의 재현이기 때문이다. runner의 catalogHas는 지금 이렇게 본다:
          --   table  -> information_schema.tables (table_name, 스키마 미지정)
          --   index  -> pg_indexes (indexname, 스키마 미지정)
          --   policy -> pg_policies (tablename, policyname, 스키마 미지정)
          -- semantic 판정은 위에서 public 정본 기준으로 엄격하게 따로 본다.
          WITH targets(candidate, kind, tbl, nm) AS (VALUES
            ('kill-switch','table','kill_switch_state','kill_switch_state'),
            ('kill-switch','table','kill_switch_log','kill_switch_log'),
            ('kill-switch','table','telegram_alert_log','telegram_alert_log'),
            ('kill-switch','table','worker_heartbeat','worker_heartbeat'),
            ('kill-switch','table','worker_lock','worker_lock'),
            ('kill-switch','index','kill_switch_state','idx_kill_switch_conn'),
            ('kill-switch','index','telegram_alert_log','idx_tg_dedup'),
            ('kill-switch','policy','kill_switch_state','ks_state_owner'),
            ('kill-switch','policy','kill_switch_log','ks_log_owner'),
            ('jobs','table','jobs','jobs'),
            ('jobs','index','jobs','idx_jobs_pending'),
            ('jobs','index','jobs','idx_jobs_conn'),
            ('jobs','policy','jobs','jobs_owner')
          )
          SELECT candidate, kind, tbl AS target_table, nm AS target_name,
                 CASE kind
                   WHEN 'table'  THEN EXISTS (SELECT 1 FROM information_schema.tables
                                               WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_name = tbl)
                   WHEN 'index'  THEN EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = nm)
                   WHEN 'policy' THEN EXISTS (SELECT 1 FROM pg_policies WHERE tablename = tbl AND policyname = nm)
                 END AS catalog_has
            FROM targets
           ORDER BY candidate, kind, nm;

