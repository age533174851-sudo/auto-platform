          act_idx AS (
            SELECT c.relname AS tbl, i.relname AS idxname, pg_get_indexdef(idx.indexrelid) AS iddef
              FROM pg_index idx JOIN pg_class i ON i.oid = idx.indexrelid JOIN pg_class c ON c.oid = idx.indrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public' AND c.relname IN (SELECT tbl FROM target_tables)),
          idx_bad AS (
            SELECT coalesce(e.tbl, a.tbl) AS tbl FROM expected_indexes e
            FULL OUTER JOIN act_idx a ON a.tbl = e.tbl AND a.idxname = e.idxname
            WHERE a.idxname IS NULL OR e.idxname IS NULL OR e.iddef IS DISTINCT FROM a.iddef),
          act_pol AS (
            SELECT tablename AS tbl, policyname AS polname, permissive, cmd,
                   coalesce(array_to_string(roles, ','), '') AS roles, coalesce(qual, '') AS qual,
                   coalesce(with_check, '') AS withcheck
              FROM pg_policies WHERE schemaname = 'public' AND tablename IN (SELECT tbl FROM target_tables)),
          pol_bad AS (
            SELECT coalesce(e.tbl, a.tbl) AS tbl FROM expected_policies e
            FULL OUTER JOIN act_pol a ON a.tbl = e.tbl AND a.polname = e.polname
            WHERE a.polname IS NULL OR e.polname IS NULL
               OR e.permissive IS DISTINCT FROM a.permissive OR e.cmd IS DISTINCT FROM a.cmd
               OR e.roles IS DISTINCT FROM a.roles OR e.qual IS DISTINCT FROM a.qual
               OR e.withcheck IS DISTINCT FROM a.withcheck),
          rls AS (
            SELECT t.tbl,
                   (pub.oid IS NOT NULL
                    AND pub.relrowsecurity::text      IS NOT DISTINCT FROM r.exp_rls
                    AND pub.relforcerowsecurity::text IS NOT DISTINCT FROM r.exp_force) AS ok
              FROM target_tables t
              LEFT JOIN expected_rls r ON r.tbl = t.tbl
              LEFT JOIN LATERAL (
                   SELECT c.oid, c.relkind, c.relrowsecurity, c.relforcerowsecurity
                     FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public' AND c.relname = t.tbl
                 ) pub ON true),
          tabs AS (
            SELECT t.tbl, (pub.oid IS NOT NULL AND pub.relkind = 'r') AS ok
              FROM target_tables t
              LEFT JOIN LATERAL (
                   SELECT c.oid, c.relkind, c.relrowsecurity, c.relforcerowsecurity
                     FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public' AND c.relname = t.tbl
                 ) pub ON true),
          base AS (
            SELECT
              (SELECT bool_and(ok) FROM tabs WHERE tbl IN (SELECT tbl FROM ks_tabs))    AS ks_tables,
              (SELECT bool_and(ok) FROM tabs WHERE tbl = 'jobs')                        AS jobs_table,
              NOT EXISTS (SELECT 1 FROM col_bad WHERE tbl IN (SELECT tbl FROM ks_tabs)) AS ks_cols,
              NOT EXISTS (SELECT 1 FROM col_bad WHERE tbl = 'jobs')                     AS jobs_cols,
              NOT EXISTS (SELECT 1 FROM con_bad WHERE tbl IN (SELECT tbl FROM ks_tabs)) AS ks_cons,
              NOT EXISTS (SELECT 1 FROM con_bad WHERE tbl = 'jobs')                     AS jobs_cons,
              NOT EXISTS (SELECT 1 FROM idx_bad WHERE tbl IN (SELECT tbl FROM ks_tabs)) AS ks_idx,
              NOT EXISTS (SELECT 1 FROM idx_bad WHERE tbl = 'jobs')                     AS jobs_idx,
              (SELECT bool_and(ok) FROM rls WHERE tbl IN (SELECT tbl FROM ks_tabs))     AS ks_rls,
              (SELECT bool_and(ok) FROM rls WHERE tbl = 'jobs')                         AS jobs_rls,
              NOT EXISTS (SELECT 1 FROM pol_bad WHERE tbl IN (SELECT tbl FROM ks_tabs)) AS ks_pol,
              NOT EXISTS (SELECT 1 FROM pol_bad WHERE tbl = 'jobs')                     AS jobs_pol,
              (EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_name = 'kill_switch_state')
               AND EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_name = 'kill_switch_log')
               AND EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_name = 'telegram_alert_log')
               AND EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_name = 'worker_heartbeat')
               AND EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_name = 'worker_lock')
               AND EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'idx_kill_switch_conn')
               AND EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'idx_tg_dedup')
               AND EXISTS (SELECT 1 FROM pg_policies WHERE tablename = 'kill_switch_state' AND policyname = 'ks_state_owner')
               AND EXISTS (SELECT 1 FROM pg_policies WHERE tablename = 'kill_switch_log' AND policyname = 'ks_log_owner')) AS ks_baseline,
              (EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_name = 'jobs')
               AND EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'idx_jobs_pending')
               AND EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'idx_jobs_conn')
               AND EXISTS (SELECT 1 FROM pg_policies WHERE tablename = 'jobs' AND policyname = 'jobs_owner')) AS jobs_baseline
          )
          SELECT unnest(ARRAY[
            'KILL_SWITCH_TABLES_EXIST='             || upper(coalesce(ks_tables::text, 'UNKNOWN')),
            'KILL_SWITCH_COLUMNS_MATCH='            || upper(coalesce(ks_cols::text, 'UNKNOWN')),
            'KILL_SWITCH_CONSTRAINTS_MATCH='        || upper(coalesce(ks_cons::text, 'UNKNOWN')),
            'KILL_SWITCH_INDEXES_MATCH='            || upper(coalesce(ks_idx::text, 'UNKNOWN')),
            'KILL_SWITCH_RLS_MATCH='                || upper(coalesce(ks_rls::text, 'UNKNOWN')),
            'KILL_SWITCH_POLICIES_MATCH='           || upper(coalesce(ks_pol::text, 'UNKNOWN')),
            'JOBS_TABLE_EXISTS='                    || upper(coalesce(jobs_table::text, 'UNKNOWN')),
            'JOBS_COLUMNS_MATCH='                   || upper(coalesce(jobs_cols::text, 'UNKNOWN')),
            'JOBS_CONSTRAINTS_MATCH='               || upper(coalesce(jobs_cons::text, 'UNKNOWN')),
            'JOBS_INDEXES_MATCH='                   || upper(coalesce(jobs_idx::text, 'UNKNOWN')),
            'JOBS_RLS_MATCH='                       || upper(coalesce(jobs_rls::text, 'UNKNOWN')),
            'JOBS_POLICY_MATCH='                    || upper(coalesce(jobs_pol::text, 'UNKNOWN')),
            'KILL_SWITCH_RUNNER_BASELINE_EXPECTED=' || upper(coalesce(ks_baseline::text, 'UNKNOWN')),
            'KILL_SWITCH_SEMANTIC_MATCH='           || upper(coalesce((ks_tables AND ks_cols AND ks_cons AND ks_idx AND ks_rls AND ks_pol)::text, 'UNKNOWN')),
            'JOBS_RUNNER_BASELINE_EXPECTED='        || upper(coalesce(jobs_baseline::text, 'UNKNOWN')),
            'JOBS_SEMANTIC_MATCH='                  || upper(coalesce((jobs_table AND jobs_cols AND jobs_cons AND jobs_idx AND jobs_rls AND jobs_pol)::text, 'UNKNOWN'))
          ]) AS verdict FROM base;

          COMMIT;
          SQL

          # ── 가려야 할 조각을 접속 문자열에서 뽑는다. 어디에도 출력하지 않는다 ──
          #
          # 정규식만으로는 샌다. psql은 접속에 실패하면 제 문구로 호스트를 그대로
          # 찍는다(could not translate host name "..."). postgres:// 나 host= 모양이
          # 아니라 정규식이 못 거른다. 그래서 실제 값을 문자 그대로 지운다.
          _u="${SUPABASE_DB_URL}"
          _creds="${_u#*://}"; _creds="${_creds%%@*}"
          _hostpart="${_u#*@}"; _hostpart="${_hostpart%%/*}"; _hostpart="${_hostpart%%\?*}"
          _host="${_hostpart%%:*}"

          rc=0
          out=$(psql "${SUPABASE_DB_URL}" -X -v ON_ERROR_STOP=1 -f /tmp/audit-legacy.sql 2>&1) || rc=$?

          scrubbed="${out}"
          scrubbed="${scrubbed//"${_u}"/<접속 문자열 가림>}"
          if [ -n "${_creds}" ] && [ "${_creds}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_creds}"/<접속 정보 가림>}"
          fi
          if [ -n "${_host}" ] && [ "${_host}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_host}"/<host 가림>}"
          fi
          printf '%s\n' "${scrubbed}" | sed -E \
            -e 's#postgres(ql)?://[^[:space:]]*#<접속 문자열 가림>#g' \
            -e 's#(host|hostaddr|password|user)=[^[:space:]]*#\1=<가림>#g'

          if [ "${rc}" -ne 0 ]; then
            echo "::error::조회에 실패했습니다 — '확인하지 못함'을 '없음'으로 적지 않습니다 (psql 종료코드 ${rc})"
            exit "${rc}"
          fi

          # ── READ ONLY가 실제로 켜져 있었는지 값으로 확인한다 ──
          #
          # BEGIN TRANSACTION READ ONLY를 누가 지우면 조회는 그대로 성공하고
          # 아무도 모른다. 그러면 다음 사람이 mutation 한 줄을 얹을 때 막아 줄
          # 것이 없다.
          if ! printf '%s' "${out}" | grep -q 'READ_ONLY=on'; then
            echo "::error::읽기 전용 트랜잭션이 아니었습니다 — BEGIN TRANSACTION READ ONLY가 빠졌거나 무효화됐습니다"
            exit 1
          fi
          echo "읽기 전용 트랜잭션 확인 (READ_ONLY=on)"

      - name: 판정 읽는 법
        if: success()
        run: |
          # 마크다운에 역따옴표가 있어서 echo '...'로 적으면 shellcheck가
          # SC2016으로 잡는다. 따옴표 히어독은 그 위험 자체가 없다.
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## LEGACY runtime 스키마 조회 완료

          위 로그의 `=== 10. 최종 판정 ===` 블록을 보세요. 두 판정을 **갈라서** 읽습니다.

          | RUNNER_BASELINE_EXPECTED | SEMANTIC_MATCH | 뜻 | 다음 |
          |---|---|---|---|
          | `TRUE` | `TRUE` | 가장 안전 | canonical 번호 부여 시 운영에서 SQL 실행 없이 BASELINE 채택 |
          | `TRUE` | `FALSE` | **매우 위험** | runner가 어긋남을 못 보고 실행을 생략한다 — 번호 부여 전에 정의 차이를 먼저 해결 |
          | `FALSE` | — | 새 migration이 운영에서 **실제로 실행**된다 | `DROP POLICY` + `CREATE POLICY`가 있으므로 별도 결정 필요 |
          | `UNKNOWN` | — | 확인하지 못함 | `FALSE`로 취급하지 않습니다 |

          이 워크플로는 읽기만 합니다. 스키마를 바꾸지 않았습니다.
          MD
