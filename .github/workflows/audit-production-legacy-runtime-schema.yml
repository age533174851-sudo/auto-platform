          ),
          act_con AS (
            SELECT c.relname AS tbl, con.conname, con.contype::text AS contype, pg_get_constraintdef(con.oid) AS condef
              FROM pg_constraint con JOIN pg_class c ON c.oid = con.conrelid JOIN pg_namespace n ON n.oid = c.relnamespace
