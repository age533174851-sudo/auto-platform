# Exact100X TESTNET 실측이 왜 시작되지 않는지를 **읽기만** 해서 단계별로 가른다.
#
# 왜 필요한가
# ───────────
# "표본 0건"만 알고 있으면 다음 할 일을 정할 수 없다. 막힌 자리가
# 연결이 없는 것인지 · 권한이 없는 것인지 · 포지션이 없는 것인지 ·
# 관측 기록만 비어 있는 것인지에 따라 다음 작업이 완전히 달라진다.
#
# 이 감사는 **DB가 아는 사실만** 답한다. 거래소 인증 성공 여부는 여기서
# 답할 수 없다 — 그것은 시크릿 복호화가 필요하고, 이 워크플로는
# 복호화 키를 받지 않는다. 그 단계는 `/api/binance/futures/diagnose`가
# 사용자 세션으로 수행한다. **둘을 섞어 적지 않는다.**
#
# 무엇을 읽는가
# ─────────────
#   · exchange_connections: 환경·활성·선언된 권한 플래그와 **암호문의 존재 여부**
#     — api_key·api_secret_enc의 **값은 선택하지 않는다.** 길이도 읽지 않는다.
#   · exact100x_risk_observations / exact100x_exit_escape_observations: env별 건수
#   · live_orders: Exact100X 프로필 주문 건수 (mode별)
# 전부 집계이거나 불리언이다. 업무 데이터의 내용은 읽지 않는다.
#
# 쓰기는 Postgres가 거부한다
# ──────────────────────────
# `BEGIN TRANSACTION READ ONLY`로 열고, `READ_ONLY=on`을 값으로 확인한다.
# 빠지면 **실행이 실패한다.**
#
# 왜 이렇게 좁게 트리거하나
# ─────────────────────────
#   · `pull_request` 없음   — PR 검토 중 운영 DB 접속 0.
#   · `push` + 이 파일 경로 — 이 파일이 main에 들어오는 그 순간 한 번만 돈다.
#
# 수동 실행을 **왜 결국 열었나**
# ──────────────────────────────
# 처음에는 `workflow_dispatch`를 일부러 두지 않았다 — "사람이 아무 때나
# 운영 DB를 두드리는 문을 만들지 않는다". 그 판단의 대가가 드러났다:
# 최신 상태를 보려면 **이 파일을 건드리는 커밋을 밀어야** 했다. 즉
# "읽기만 하는 조회"를 하려고 main에 커밋이 쌓인다. 그래서 상태가 3일
# 묵은 채로 판단에 쓰였다.
#
# 문을 열면서 **권한은 넓히지 않는다.** 세 겹으로 좁힌다:
#   ① `workflow_dispatch`는 이미 저장소 쓰기 권한자만 부를 수 있다
#   ② 거기에 **저장소 소유자**만으로 한 번 더 좁힌다
#   ③ 오타·오클릭으로 돌지 않게 확인 문구를 **그대로** 입력받는다
#
# 비밀정보는 새로 늘지 않는다 — `SUPABASE_DB_URL` 하나를 그대로 쓰고,
# 값은 어디에도 출력하지 않는다. 더 강한 문(Environment 필수 승인자)은
# 저장소 설정이 필요해 여기서 확인할 수 없으므로 코드로 걸지 않는다.
name: audit-production-exact100x-testnet-readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-exact100x-testnet-readiness.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: '읽기 전용 운영 감사를 실행하려면 READ-ONLY-AUDIT 를 그대로 입력하세요'
        required: true
        default: ''

concurrency:
  group: audit-production-exact100x-testnet-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Exact100X TESTNET 실측 준비 상태 조회 (읽기 전용)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      # ── 수동 실행이면 누가·무엇을 확인하고 넘긴다 ──
      #
      #   `push`로 돈 경우에는 이 단계가 아무것도 하지 않는다.
      #   **실패하면 DB 접속 단계로 가지 않는다.**
      - name: 수동 실행 관문 (소유자 · 확인 문구)
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${ACTOR}" != "${OWNER}" ]; then
            echo "::error::저장소 소유자만 이 감사를 수동 실행할 수 있습니다"
            exit 1
          fi
          if [ "${CONFIRM}" != "READ-ONLY-AUDIT" ]; then
            echo "::error::확인 문구가 일치하지 않습니다 — READ-ONLY-AUDIT 를 그대로 입력하세요"
            exit 1
          fi
          echo "수동 실행 승인 (소유자 확인 · 확인 문구 일치)"

      - name: DB 접속 정보 확인
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다 — 상태를 확인할 수 없습니다"
            echo "값은 GitHub Secrets에만 있습니다. 이 로그에는 출력하지 않습니다."
            exit 1
          fi
          echo "SUPABASE_DB_URL 존재 확인 (값은 출력하지 않습니다)"

      - name: 상태 조회 (BEGIN TRANSACTION READ ONLY)
        run: |
          set -o pipefail

          cat > /tmp/audit.sql <<'SQL'
          \set ON_ERROR_STOP on

          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '20s';
          SET LOCAL lock_timeout = '3s';

          \echo '=== 0. READ ONLY 증명 ==='
          SELECT 'READ_ONLY=' || current_setting('transaction_read_only') AS assertion;

          \echo ''
          \echo '=== 1. 연결 — 환경별 선언 사실 (키 값은 읽지 않는다) ==='
          -- api_key·api_secret_enc는 **존재 여부만** 본다. 값도 길이도 선택하지 않는다.
          SELECT exchange_id,
                 is_testnet,
                 count(*)                                             AS rows,
                 count(*) FILTER (WHERE is_active)                     AS active,
                 count(*) FILTER (WHERE perm_read)                     AS perm_read,
                 count(*) FILTER (WHERE perm_trading)                  AS perm_trading,
                 count(*) FILTER (WHERE has_withdrawal)                AS has_withdrawal,
                 count(*) FILTER (WHERE auto_trading_enabled)          AS auto_trading_on,
                 count(*) FILTER (WHERE coalesce(api_key, '') <> '')    AS key_present,
                 count(*) FILTER (WHERE coalesce(api_secret_enc, '') <> '') AS secret_cipher_present
            FROM public.exchange_connections
           GROUP BY exchange_id, is_testnet
           ORDER BY exchange_id, is_testnet;

          \echo ''
          \echo '=== 2. Exact100X 관측 표본 — env별 (장부를 합산하지 않는다) ==='
          SELECT 'risk' AS kind, env, count(*) AS rows, max(observed_at) AS newest
            FROM public.exact100x_risk_observations GROUP BY env
          UNION ALL
          SELECT 'escape' AS kind, env, count(*) AS rows, max(observed_at) AS newest
            FROM public.exact100x_exit_escape_observations GROUP BY env
           ORDER BY 1, 2;

          \echo ''
          \echo '=== 2b. 칸이 실제로 있는가 (없는 칸의 NULL을 0으로 읽지 않기 위해) ==='
          -- 아래 분해는 `to_jsonb(...)->>'...'`로 칸이 없어도 죽지 않게
          -- 적었다. 그런데 **칸이 없어서 NULL인 것**과 **있는데 비어
          -- 있는 것**은 완전히 다른 사실이다. 그래서 먼저 존재를 적는다.
          SELECT c.col,
                 (EXISTS (SELECT 1 FROM information_schema.columns ic
                           WHERE ic.table_schema='public' AND ic.table_name=c.tbl
                             AND ic.column_name=c.col)) AS present,
                 c.tbl AS table_name
            FROM (VALUES
                   ('live_orders','status'),
                   ('live_orders','strategy_id'),
                   ('live_orders','strategy_account_id'),
                   ('live_orders','execution_profile_id'),
                   ('live_orders','filled_qty'),
                   ('autotrade_schedules','execution_profile_id'),
                   ('autotrade_schedules','execution_preset_id'),
                   ('autotrade_schedules','execution_contract_version'),
                   ('autotrade_schedules','margin_allocation_pct'),
                   ('autotrade_schedules','last_run_at'),
                   ('autotrade_schedules','last_result')
                 ) AS c(tbl,col)
           ORDER BY c.tbl, c.col;

          \echo ''
          \echo '=== 3. Exact100X 주문 장부 — mode별 ==='
          SELECT mode,
                 count(*)                                                    AS orders,
                 count(*) FILTER (WHERE execution_profile_id = 'MAX_LEV_100X') AS exact100x_orders,
                 max(created_at)                                             AS newest
            FROM public.live_orders
           GROUP BY mode
           ORDER BY mode;

          \echo ''
          \echo '=== 3b. 주문을 status로 분해 (136건이 무엇이었나) ==='
          -- 합계만 보면 "주문이 136건 있었다"까지만 알 수 있다. 그중
          -- 몇 건이 거래소까지 갔는지는 **status가 말한다** — INTENT만
          -- 쌓인 것과 체결된 것은 완전히 다른 사실이다.
          SELECT mode, status,
                 count(*) AS orders,
                 count(*) FILTER (WHERE execution_profile_id = 'MAX_LEV_100X') AS exact100x,
                 max(created_at) AS newest
            FROM public.live_orders
           GROUP BY mode, status
           ORDER BY mode, orders DESC;

          \echo ''
          \echo '=== 3c. 주문을 전략으로 분해 (칸이 없으면 NULL로 나온다 — 2b를 함께 보라) ==='
          -- `strategy_id`는 이 표에 없을 수 있다(041은 `strategy_account_id`를
          -- 더했다). 직접 적으면 칸이 없을 때 **감사 전체가 실패한다.**
          -- `to_jsonb`로 읽으면 없는 칸은 NULL이 되고 조회는 산다.
          -- `strategy_id`는 'scalp' 같은 **전략 이름**이라 식별정보가 아니다.
          -- `strategy_account_id`는 내부 계정 식별자이므로 **값을 찍지 않고**
          -- 비었는지만 적는다.
          SELECT to_jsonb(lo) ->> 'strategy_id'                        AS strategy_id,
                 ((to_jsonb(lo) ->> 'strategy_account_id') IS NOT NULL) AS has_strategy_account,
                 lo.mode,
                 count(*) AS orders,
                 count(*) FILTER (WHERE lo.execution_profile_id = 'MAX_LEV_100X') AS exact100x
            FROM public.live_orders lo
           GROUP BY 1, 2, 3
           ORDER BY orders DESC
           LIMIT 30;

          \echo ''
          \echo '=== 3d. Exact100X 주문·체결만 따로 ==='
          -- 주문이 나간 것과 **체결된 것**은 다르다. 체결 수량이 0보다
          -- 큰 줄만 따로 센다.
          SELECT mode,
                 count(*)                                                      AS exact100x_orders,
                 count(*) FILTER (WHERE coalesce(filled_qty, 0) > 0)           AS with_fill,
                 count(*) FILTER (WHERE status = 'FILLED')                     AS status_filled,
                 min(created_at)                                               AS first_at,
                 max(created_at)                                               AS newest
            FROM public.live_orders
           WHERE execution_profile_id = 'MAX_LEV_100X'
           GROUP BY mode
           ORDER BY mode;

          \echo ''
          \echo '=== 3e. 예약 — Exact100X 조합이 켜져 있는가 ==='
          -- **이 질문이 빠져 있었다.** 연결도 되고 권한도 맞는데 진입이
          -- 0건이면, 다음에 볼 곳은 예약이다. 예약이 없거나 꺼져 있으면
          -- 거래소·키를 아무리 들여다봐도 원인이 거기 없다.
          --
          -- 계약 적합성은 `dormantGate`의 열린 조합과 같은 기준으로 센다:
          --   scalp + MAX_LEV_100X + EXACT_100X + 계약 v2 + TESTNET + 증거금 배정
          SELECT to_jsonb(sc) ->> 'execution_profile_id'        AS profile_id,
                 to_jsonb(sc) ->> 'execution_preset_id'         AS preset_id,
                 to_jsonb(sc) ->> 'execution_contract_version'  AS contract_version,
                 to_jsonb(sc) ->> 'strategy_id'                 AS strategy_id,
                 sc.mode,
                 count(*)                                       AS rows,
                 count(*) FILTER (WHERE sc.enabled)             AS enabled_rows,
                 count(*) FILTER (
                   WHERE (to_jsonb(sc) ->> 'margin_allocation_pct') IS NOT NULL
                 )                                              AS margin_alloc_set
            FROM public.autotrade_schedules sc
           WHERE (to_jsonb(sc) ->> 'execution_profile_id') IS NOT NULL
           GROUP BY 1, 2, 3, 4, 5
           ORDER BY rows DESC
           LIMIT 30;

          \echo ''
          \echo '=== 3f. 예약 전체 — 실행 모드·활성·최근 실행 (내용은 적지 않는다) ==='
          -- `last_result`는 자유 문자열이라 **원문을 찍지 않는다.**
          -- 비었는가 / 뭔가 적혔는가로만 센다.
          SELECT sc.mode,
                 count(*)                                            AS rows,
                 count(*) FILTER (WHERE sc.enabled)                  AS enabled_rows,
                 count(*) FILTER (
                   WHERE (to_jsonb(sc) ->> 'last_run_at') IS NOT NULL
                 )                                                   AS ever_ran,
                 count(*) FILTER (
                   WHERE (to_jsonb(sc) ->> 'last_result') IS NOT NULL
                 )                                                   AS has_last_result,
                 max((to_jsonb(sc) ->> 'last_run_at')::timestamptz)  AS newest_run
            FROM public.autotrade_schedules sc
           GROUP BY sc.mode
           ORDER BY sc.mode;

          \echo ''
          \echo '=== 3g. 왜 진입이 0건인가 — 평가 결과를 경계 있는 값으로만 센다 ==='
          -- **자유 문자열을 찍지 않는다.** `last_decision`·`last_result`에는
          -- 무엇이 들어 있을지 모른다. 그래서 알려진 값만 그대로 두고
          -- 나머지는 'OTHER'로 접는다. 집계 수만 나온다.
          WITH ex AS (
            SELECT sc.*,
                   (to_jsonb(sc) -> 'last_decision' ->> 'outcome') AS outcome_raw,
                   coalesce(
                     to_jsonb(sc) -> 'last_decision' ->> 'reasonCode',
                     to_jsonb(sc) -> 'last_decision' ->> 'reason_code'
                   ) AS code_raw
              FROM public.autotrade_schedules sc
             WHERE (to_jsonb(sc) ->> 'execution_profile_id') = 'MAX_LEV_100X'
          )
          SELECT
            CASE WHEN outcome_raw IN ('ENTERED','NO_SIGNAL','BLOCKED','FAILED')
                 THEN outcome_raw
                 WHEN outcome_raw IS NULL THEN 'NOT_RECORDED'
                 ELSE 'OTHER' END                                    AS outcome,
            CASE WHEN code_raw IN ('NO_BREAKOUT','VOLUME_BELOW_THRESHOLD',
                                   'VOLUME_UNAVAILABLE','BARS_UNAVAILABLE',
                                   'BARS_INSUFFICIENT','BAR_DATA_INVALID',
                                   'PRICE_UNAVAILABLE','ATR_UNAVAILABLE',
                                   'STOP_INVALID','COST_EXCEEDS_TARGET',
                                   'UNKNOWN_REASON')
                 THEN code_raw
                 WHEN code_raw IS NULL THEN 'NOT_RECORDED'
                 ELSE 'OTHER' END                                    AS reason_code,
            count(*)                                                 AS schedules,
            count(*) FILTER (WHERE enabled)                           AS enabled_rows,
            max(last_run_at)                                          AS newest_run
            FROM ex
           GROUP BY 1, 2
           ORDER BY schedules DESC;

          \echo ''
          \echo '=== 3h. 미결 청산·주문이 쌓여 있는가 (내구성 공백의 흔적) ==='
          -- `UNKNOWN`·`ACKED`는 **끝나지 않은 상태**다. 쌓여 있으면
          -- 재조회가 돌지 않았다는 뜻이다.
          SELECT mode, status,
                 count(*)                                             AS orders,
                 count(*) FILTER (WHERE reduce_only)                   AS reduce_only_rows,
                 min(created_at)                                       AS oldest,
                 max(created_at)                                       AS newest
            FROM public.live_orders
           WHERE status IN ('INTENT','SENT','ACKED','UNKNOWN')
           GROUP BY mode, status
           ORDER BY orders DESC;

          \echo ''
          \echo '=== 4. 판정 — 어느 단계에서 막혀 있는가 ==='
          WITH tn AS (
            SELECT * FROM public.exchange_connections
             WHERE exchange_id = 'binance' AND is_testnet IS TRUE
          )
          SELECT
            (SELECT count(*) FROM tn)                                    AS binance_testnet_rows,
            (SELECT count(*) FROM tn WHERE is_active)                    AS active_rows,
            (SELECT count(*) FROM tn WHERE perm_read AND perm_trading
                                       AND NOT has_withdrawal)           AS declared_ok_rows,
            (SELECT count(*) FROM tn WHERE coalesce(api_secret_enc,'') <> '')
                                                                         AS secret_cipher_rows,
            (SELECT count(*) FROM public.exact100x_risk_observations
              WHERE env = 'TESTNET')                                     AS testnet_risk_samples,
            (SELECT count(*) FROM public.exact100x_exit_escape_observations
              WHERE env = 'TESTNET')                                     AS testnet_escape_samples,
            (SELECT count(*) FROM public.live_orders
              WHERE mode = 'TESTNET' AND execution_profile_id = 'MAX_LEV_100X')
                                                                         AS testnet_exact100x_orders,
            -- ── 진입 0건의 **다음 질문**을 여기서 답한다 ──
            --   예약이 아예 없는가 · 있는데 꺼져 있는가 · 켜져 있는데
            --   한 번도 안 돌았는가. 셋은 다음 할 일이 전부 다르다.
            (SELECT count(*) FROM public.autotrade_schedules sc
              WHERE (to_jsonb(sc) ->> 'execution_profile_id') = 'MAX_LEV_100X')
                                                                         AS exact100x_schedules,
            (SELECT count(*) FROM public.autotrade_schedules sc
              WHERE (to_jsonb(sc) ->> 'execution_profile_id') = 'MAX_LEV_100X'
                AND sc.enabled)                                          AS exact100x_enabled,
            (SELECT count(*) FROM public.autotrade_schedules sc
              WHERE (to_jsonb(sc) ->> 'execution_profile_id') = 'MAX_LEV_100X'
                AND sc.enabled AND sc.mode = 'TESTNET'
                AND (to_jsonb(sc) ->> 'execution_preset_id') = 'EXACT_100X'
                AND (to_jsonb(sc) ->> 'execution_contract_version') = '2'
                AND (to_jsonb(sc) ->> 'strategy_id') = 'scalp'
                AND (to_jsonb(sc) ->> 'margin_allocation_pct') IS NOT NULL)
                                                                         AS exact100x_combo_ok,
            (SELECT count(*) FROM public.autotrade_schedules sc
              WHERE (to_jsonb(sc) ->> 'execution_profile_id') = 'MAX_LEV_100X'
                AND (to_jsonb(sc) ->> 'last_run_at') IS NOT NULL)        AS exact100x_ever_ran,
            (SELECT count(*) FROM public.live_orders
              WHERE execution_profile_id = 'MAX_LEV_100X'
                AND coalesce(filled_qty, 0) > 0)                         AS exact100x_filled;

          COMMIT;
          SQL

          # ── 가려야 할 조각을 접속 문자열에서 뽑는다. 어디에도 출력하지 않는다 ──
          _u="${SUPABASE_DB_URL}"
          _creds="${_u#*://}"; _creds="${_creds%%@*}"
          _hostpart="${_u#*@}"; _hostpart="${_hostpart%%/*}"; _hostpart="${_hostpart%%\?*}"
          _host="${_hostpart%%:*}"

          rc=0
          out=$(psql "${SUPABASE_DB_URL}" -X -v ON_ERROR_STOP=1 -f /tmp/audit.sql 2>&1) || rc=$?

          scrubbed="${out}"
          scrubbed="${scrubbed//"${_u}"/<접속 문자열 가림>}"
          if [ -n "${_creds}" ] && [ "${_creds}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_creds}"/<접속 정보 가림>}"
          fi
          if [ -n "${_host}" ] && [ "${_host}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_host}"/<host 가림>}"
          fi
          printf '%s\n' "${scrubbed}" | sed -E \
            -e 's#postgres(ql)?://[^[:space:]]*#<접속 문자열 가림>#g' \
            -e 's#(host|hostaddr|password|user)=[^[:space:]]*#\1=<가림>#g'

          if [ "${rc}" -ne 0 ]; then
            echo "::error::조회에 실패했습니다 — '확인하지 못함'을 '없음'으로 적지 않습니다 (psql 종료코드 ${rc})"
            exit "${rc}"
          fi

          if ! printf '%s' "${out}" | grep -q 'READ_ONLY=on'; then
            echo "::error::읽기 전용 트랜잭션이 아니었습니다 — BEGIN TRANSACTION READ ONLY가 빠졌거나 무효화됐습니다"
            exit 1
          fi
