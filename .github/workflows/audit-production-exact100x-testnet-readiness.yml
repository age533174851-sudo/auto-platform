# Exact100X TESTNET 실측이 왜 시작되지 않는지를 **읽기만** 해서 단계별로 가른다.
#
# 왜 필요한가
# ───────────
# "표본 0건"만 알고 있으면 다음 할 일을 정할 수 없다. 막힌 자리가
# 연결이 없는 것인지 · 권한이 없는 것인지 · 포지션이 없는 것인지 ·
# 관측 기록만 비어 있는 것인지에 따라 다음 작업이 완전히 달라진다.
#
# 이 감사는 **DB가 아는 사실만** 답한다. 거래소 인증 성공 여부는 여기서
# 답할 수 없다 — 그것은 시크릿 복호화가 필요하고, 이 워크플로는
# 복호화 키를 받지 않는다. 그 단계는 `/api/binance/futures/diagnose`가
# 사용자 세션으로 수행한다. **둘을 섞어 적지 않는다.**
#
# 무엇을 읽는가
# ─────────────
#   · exchange_connections: 환경·활성·선언된 권한 플래그와 **암호문의 존재 여부**
#     — api_key·api_secret_enc의 **값은 선택하지 않는다.** 길이도 읽지 않는다.
#   · exact100x_risk_observations / exact100x_exit_escape_observations: env별 건수
#   · live_orders: Exact100X 프로필 주문 건수 (mode별)
# 전부 집계이거나 불리언이다. 업무 데이터의 내용은 읽지 않는다.
#
# 쓰기는 Postgres가 거부한다
# ──────────────────────────
# `BEGIN TRANSACTION READ ONLY`로 열고, `READ_ONLY=on`을 값으로 확인한다.
# 빠지면 **실행이 실패한다.**
#
# 왜 이렇게 좁게 트리거하나
# ─────────────────────────
#   · `pull_request` 없음      — PR 검토 중 운영 DB 접속 0.
#   · `workflow_dispatch` 없음 — 사람이 아무 때나 운영 DB를 두드리는 문을 만들지 않는다.
#   · `push` + 이 파일 경로    — 이 파일이 main에 들어오는 그 순간 한 번만 돈다.
name: audit-production-exact100x-testnet-readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-exact100x-testnet-readiness.yml'

concurrency:
  group: audit-production-exact100x-testnet-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Exact100X TESTNET 실측 준비 상태 조회 (읽기 전용)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: DB 접속 정보 확인
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 없습니다 — 상태를 확인할 수 없습니다"
            echo "값은 GitHub Secrets에만 있습니다. 이 로그에는 출력하지 않습니다."
            exit 1
          fi
          echo "SUPABASE_DB_URL 존재 확인 (값은 출력하지 않습니다)"

      - name: 상태 조회 (BEGIN TRANSACTION READ ONLY)
        run: |
          set -o pipefail

          cat > /tmp/audit.sql <<'SQL'
          \set ON_ERROR_STOP on

          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '20s';
          SET LOCAL lock_timeout = '3s';

          \echo '=== 0. READ ONLY 증명 ==='
          SELECT 'READ_ONLY=' || current_setting('transaction_read_only') AS assertion;

          \echo ''
          \echo '=== 1. 연결 — 환경별 선언 사실 (키 값은 읽지 않는다) ==='
          -- api_key·api_secret_enc는 **존재 여부만** 본다. 값도 길이도 선택하지 않는다.
          SELECT exchange_id,
                 is_testnet,
                 count(*)                                             AS rows,
                 count(*) FILTER (WHERE is_active)                     AS active,
                 count(*) FILTER (WHERE perm_read)                     AS perm_read,
                 count(*) FILTER (WHERE perm_trading)                  AS perm_trading,
                 count(*) FILTER (WHERE has_withdrawal)                AS has_withdrawal,
                 count(*) FILTER (WHERE auto_trading_enabled)          AS auto_trading_on,
                 count(*) FILTER (WHERE coalesce(api_key, '') <> '')    AS key_present,
                 count(*) FILTER (WHERE coalesce(api_secret_enc, '') <> '') AS secret_cipher_present
            FROM public.exchange_connections
           GROUP BY exchange_id, is_testnet
           ORDER BY exchange_id, is_testnet;

          \echo ''
          \echo '=== 2. Exact100X 관측 표본 — env별 (장부를 합산하지 않는다) ==='
          SELECT 'risk' AS kind, env, count(*) AS rows, max(observed_at) AS newest
            FROM public.exact100x_risk_observations GROUP BY env
          UNION ALL
          SELECT 'escape' AS kind, env, count(*) AS rows, max(observed_at) AS newest
            FROM public.exact100x_exit_escape_observations GROUP BY env
           ORDER BY 1, 2;

          \echo ''
          \echo '=== 3. Exact100X 주문 장부 — mode별 ==='
          SELECT mode,
                 count(*)                                                    AS orders,
                 count(*) FILTER (WHERE execution_profile_id = 'MAX_LEV_100X') AS exact100x_orders,
                 max(created_at)                                             AS newest
            FROM public.live_orders
           GROUP BY mode
           ORDER BY mode;

          \echo ''
          \echo '=== 4. 판정 — 어느 단계에서 막혀 있는가 ==='
          WITH tn AS (
            SELECT * FROM public.exchange_connections
             WHERE exchange_id = 'binance' AND is_testnet IS TRUE
          )
          SELECT
            (SELECT count(*) FROM tn)                                    AS binance_testnet_rows,
            (SELECT count(*) FROM tn WHERE is_active)                    AS active_rows,
            (SELECT count(*) FROM tn WHERE perm_read AND perm_trading
                                       AND NOT has_withdrawal)           AS declared_ok_rows,
            (SELECT count(*) FROM tn WHERE coalesce(api_secret_enc,'') <> '')
                                                                         AS secret_cipher_rows,
            (SELECT count(*) FROM public.exact100x_risk_observations
              WHERE env = 'TESTNET')                                     AS testnet_risk_samples,
            (SELECT count(*) FROM public.exact100x_exit_escape_observations
              WHERE env = 'TESTNET')                                     AS testnet_escape_samples,
            (SELECT count(*) FROM public.live_orders
              WHERE mode = 'TESTNET' AND execution_profile_id = 'MAX_LEV_100X')
                                                                         AS testnet_exact100x_orders;

          COMMIT;
          SQL

          # ── 가려야 할 조각을 접속 문자열에서 뽑는다. 어디에도 출력하지 않는다 ──
          _u="${SUPABASE_DB_URL}"
          _creds="${_u#*://}"; _creds="${_creds%%@*}"
          _hostpart="${_u#*@}"; _hostpart="${_hostpart%%/*}"; _hostpart="${_hostpart%%\?*}"
          _host="${_hostpart%%:*}"

          rc=0
          out=$(psql "${SUPABASE_DB_URL}" -X -v ON_ERROR_STOP=1 -f /tmp/audit.sql 2>&1) || rc=$?

          scrubbed="${out}"
          scrubbed="${scrubbed//"${_u}"/<접속 문자열 가림>}"
          if [ -n "${_creds}" ] && [ "${_creds}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_creds}"/<접속 정보 가림>}"
          fi
          if [ -n "${_host}" ] && [ "${_host}" != "${_u}" ]; then
            scrubbed="${scrubbed//"${_host}"/<host 가림>}"
          fi
          printf '%s\n' "${scrubbed}" | sed -E \
            -e 's#postgres(ql)?://[^[:space:]]*#<접속 문자열 가림>#g' \
            -e 's#(host|hostaddr|password|user)=[^[:space:]]*#\1=<가림>#g'

          if [ "${rc}" -ne 0 ]; then
            echo "::error::조회에 실패했습니다 — '확인하지 못함'을 '없음'으로 적지 않습니다 (psql 종료코드 ${rc})"
            exit "${rc}"
          fi

          if ! printf '%s' "${out}" | grep -q 'READ_ONLY=on'; then
            echo "::error::읽기 전용 트랜잭션이 아니었습니다 — BEGIN TRANSACTION READ ONLY가 빠졌거나 무효화됐습니다"
            exit 1
          fi
          echo "읽기 전용 트랜잭션 확인 (READ_ONLY=on)"

      - name: 다음 단계 안내
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Exact100X TESTNET 실측 준비 상태 조회 완료

          위 로그의 `=== 4. 판정 ===`을 보세요. 막힌 자리에 따라 다음 작업이 다릅니다.

          | 어디까지 왔나 | 다음 |
          |---|---|
          | `binance_testnet_rows = 0` | Binance TESTNET 연결을 **추가**합니다 (기존 LIVE 연결은 건드리지 않습니다) |
          | `declared_ok_rows = 0` | 키 권한이 read+trade·출금 비허용인지 확인합니다 |
          | `testnet_exact100x_orders = 0` | 연결은 있으나 Exact100X 진입이 **한 번도 없었습니다** |
          | `testnet_*_samples = 0` 인데 주문은 있음 | 관측 기록 경로가 돌지 않았습니다 |

          **이 감사가 답하지 않는 것**: 저장된 시크릿으로 Binance TESTNET
          **인증이 실제로 되는지**. 그것은 복호화가 필요하고 이 워크플로는
          복호화 키를 받지 않습니다. `/api/binance/futures/diagnose`가
          사용자 세션으로 그 단계를 수행합니다 — 두 결과를 섞어 적지 마세요.

          이 워크플로는 읽기만 합니다. 스키마와 데이터를 바꾸지 않았습니다.
          MD
