# 공식 Supabase 로컬 스택에서 번호 마이그레이션만으로 빈 DB를 세운다.
#
# 왜 필요한가
# ───────────
# 지금까지의 fresh 검증은 맨 PostgreSQL 위에 `auth.users` · `auth.uid()` ·
# `auth.role()` · `service_role`/`authenticated`/`anon`을 손으로 흉내낸
# fixture였다. 그것으로도 42P01·42883·42703은 잡혔지만, **흉내낸 것이 틀리면
# 그 틀린 것에 맞춰 통과한다.** `auth.uid()`의 반환 타입, 역할의 기본 권한,
# `search_path`, Supabase가 미리 깔아 두는 확장 — 어느 하나라도 실제와 다르면
# 우리가 본 초록은 우리 fixture에 대한 초록이지 Supabase에 대한 초록이 아니다.
#
# 그래서 여기서는 공식 CLI가 공식 이미지를 띄우고, 저장소의
# `supabase/migrations`를 **CLI가 직접 읽어** 재생한다. 파일을 임시 디렉터리로
# 복사하지 않는다 — 복사하는 순간 "저장소가 재생된다"가 아니라 "우리가 고른
# 것이 재생된다"가 된다.
#
# reset이 0으로 끝난 것만으로 통과시키지 않는다
# ──────────────────────────────────────────────
# 이 저장소에서 가장 자주 난 사고가 "실행은 성공했는데 생기지 않았다"였다.
# 022는 표가 없으면 조용히 건너뛰고 0으로 끝난다. 그래서 여기서는
#   · 공식 마이그레이션 기록(supabase_migrations.schema_migrations)이
#     파일 목록과 정확히 같은가
#   · Supabase가 관리하는 auth 스키마·함수·역할이 실제로 있는가
#   · kill-switch·jobs의 표·인덱스·정책·RLS가 실제로 생겼는가
#   · 번호 없는 legacy가 끼어들지 않았는가
# 를 값으로 확인한다.
#
# 운영과 연결되지 않는다
# ──────────────────────
# secret을 하나도 쓰지 않는다. `supabase link` · `db push` · `--linked` ·
# `--db-url` · `migration repair`도 쓰지 않는다. Docker 안 로컬 DB뿐이다.
# 이 계약은 scripts/check-migrations.mjs가 정적으로 지킨다.
name: supabase-replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/sql/**'
      # 챌린지 회계 게이트 자신이 바뀔 때도 돌아야 한다. 여기 없으면 게이트를
      # 고쳐 놓고 한 번도 돌려 보지 않은 채 머지된다.
      - 'scripts/paper-challenge-concurrency.sh'
      - 'scripts/paper-challenge-mutations.mjs'
      - 'scripts/paper-challenge-finalizer-concurrency.sh'
      - 'scripts/paper-challenge-finalizer-mutations.mjs'
      - 'scripts/check-paper-challenge-finalizer.mjs'
      # 취소 경로 — 087과 그 증명·뮤테이션·배선 검사기
      - 'scripts/paper-challenge-cancel-mutations.mjs'
      - 'scripts/check-paper-challenge-wiring.mjs'
      - 'scripts/lib/paper-money-path.mjs'
      # 위험 마이그레이션 승인 경로 — 러너와 그 증명이 바뀌면 반드시 돌아야 한다
      - 'scripts/apply-migrations.mjs'
      - 'scripts/approval-path-proof.mjs'
      - 'scripts/approval-path-mutations.mjs'
      - '.github/workflows/supabase-replay.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/sql/**'
      # 챌린지 회계 게이트 자신이 바뀔 때도 돌아야 한다. 여기 없으면 게이트를
      # 고쳐 놓고 한 번도 돌려 보지 않은 채 머지된다.
      - 'scripts/paper-challenge-concurrency.sh'
      - 'scripts/paper-challenge-mutations.mjs'
      - 'scripts/paper-challenge-finalizer-concurrency.sh'
      - 'scripts/paper-challenge-finalizer-mutations.mjs'
      - 'scripts/check-paper-challenge-finalizer.mjs'
      # 취소 경로 — 087과 그 증명·뮤테이션·배선 검사기
      - 'scripts/paper-challenge-cancel-mutations.mjs'
      - 'scripts/check-paper-challenge-wiring.mjs'
      - 'scripts/lib/paper-money-path.mjs'
      # 위험 마이그레이션 승인 경로 — 러너와 그 증명이 바뀌면 반드시 돌아야 한다
      - 'scripts/apply-migrations.mjs'
      - 'scripts/approval-path-proof.mjs'
      - 'scripts/approval-path-mutations.mjs'
      - '.github/workflows/supabase-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ══════════════════════════════════════════════════════════════════
  #  왜 job이 둘인가
  # ══════════════════════════════════════════════════════════════════
  #
  # **하나였을 때 25분에서 잘렸다.**
  #
  # main c61271eb의 #54는 계약이 깨져서 실패한 것이 아니다. 086 증명·동시성·
  # 뮤테이션과 승인 경로 증명까지 전부 통과한 뒤, 마지막 승인 경로 뮤테이션이
  # 18분52초 지점에서 job timeout에 잘렸다. 같은 트리가 34분 전 #53에서는
  # 23분35초로 통과했다 — 러너 편차 2분이 곧 실패가 되는 자리였다.
  #
  # **timeout을 40분으로 늘리지 않는다.** 그건 절벽을 뒤로 미루는 것이지
  # 없애는 것이 아니고, 다음 증명이 하나 붙는 날 같은 일이 또 난다.
  #
  # 승인 경로 뮤테이션(혼자 17분)은 재생 DB에 의존하지 않는다 —
  # `approval-path-proof.mjs`가 같은 서버에 **전용 DB를 만들어** 그 안에서만
  # 돌고 끝나면 지운다. 그래서 다른 러너로 떼어 내도 검사하는 대상이 달라지지
  # 않는다. 러너가 다르면 Docker도 Postgres도 작업공간도 따로다 — 두 job이
  # 서로의 DB를 볼 수 있는 자리가 구조적으로 없다.
  #
  # 검사는 하나도 줄이지 않았다. 단계의 내용·임계값·요구 문구가 전부 그대로다.
  #
  # 이름에 대하여
  # ─────────────
  # 최종 판정 job이 **원래 이름을 그대로 쓴다**. 이 이름이 브랜치 보호의
  # required check으로 물려 있을 수 있고, 이름이 바뀌면 검사가 사라진 채로
  # 초록이 된다 — **검사가 대상을 잃으면 조용히 통과한다.** 실제 작업은
  # `replay-core` · `approval-mutations`라는 내부 이름으로 나뉜다.

  replay-core:
    name: 재생 본체 (스키마 · 제약 · RPC · 085 · 086 · 087 · 승인 증명)
    runs-on: ubuntu-latest
    # Docker 이미지를 처음 받아 오는 시간이 있다. 너무 짧게 잡으면 실패가
    # 아니라 시간 초과가 보고된다.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.2.2

      - name: 공식 Supabase 로컬 스택 (준비는 한 곳에만 있다)
        uses: ./.github/actions/supabase-local

      - name: 재생 대상 확인 (번호 있는 것만)
        id: expected
        run: |
          set -euo pipefail
          # CLI가 마이그레이션으로 인식하는 것과 같은 모양으로만 센다.
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | grep -E '^[0-9]+_.*\.sql$' \
            | sed -E 's/^([0-9]+)_.*/\1/' | sort > /tmp/expected-versions.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | grep -vE '^[0-9]+_.*\.sql$' | sort > /tmp/legacy-files.txt
          n_expected="$(wc -l < /tmp/expected-versions.txt | tr -d ' ')"
          n_legacy="$(wc -l < /tmp/legacy-files.txt | tr -d ' ')"
          echo "번호 있는 마이그레이션 ${n_expected}개 — 이것만 재생돼야 합니다"
          echo "번호 없는 legacy ${n_legacy}개 — 하나도 재생되면 안 됩니다"
          sed 's/^/  · /' /tmp/legacy-files.txt
          if [ "${n_expected}" -eq 0 ]; then
            echo "::error::번호 있는 마이그레이션을 하나도 찾지 못했습니다 — 0개를 통과로 적지 않습니다"
            exit 1
          fi
          echo "count=${n_expected}" >> "$GITHUB_OUTPUT"

      - name: 공식 마이그레이션 기록이 파일 목록과 같은가
        run: |
          set -euo pipefail
          psql "$(cat /tmp/db-url)" -Atc \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            | sort > /tmp/actual-versions.txt
          n_actual="$(wc -l < /tmp/actual-versions.txt | tr -d ' ')"
          n_expected="$(wc -l < /tmp/expected-versions.txt | tr -d ' ')"
          echo "기대 ${n_expected}개 / 실제 ${n_actual}개"

          dup="$(sort /tmp/actual-versions.txt | uniq -d)"
          if [ -n "${dup}" ]; then
            echo "::error::마이그레이션 기록에 같은 version이 두 번 있습니다: ${dup}"
            exit 1
          fi
          missing="$(comm -23 /tmp/expected-versions.txt /tmp/actual-versions.txt)"
          extra="$(comm -13 /tmp/expected-versions.txt /tmp/actual-versions.txt)"
          rc=0
          if [ -n "${missing}" ]; then
            echo "::error::파일에는 있는데 적용 기록에 없는 version: $(echo "${missing}" | tr '\n' ' ')"
            rc=1
          fi
          if [ -n "${extra}" ]; then
            echo "::error::파일에 없는데 적용 기록에 있는 version: $(echo "${extra}" | tr '\n' ' ')"
            echo "   → 번호 없는 legacy가 끼어들었을 수 있습니다."
            rc=1
          fi
          exit "${rc}"

      - name: Supabase가 관리하는 것들이 실제로 있는가
        run: |
          set -euo pipefail
          cat > /tmp/managed.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          SELECT 'AUTH_USERS=' || CASE WHEN to_regclass('auth.users') IS NULL THEN 'FAIL' ELSE 'ok' END;
          SELECT 'AUTH_UID=' || CASE WHEN count(*) = 0 THEN 'FAIL' ELSE 'ok' END
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
           WHERE n.nspname = 'auth' AND p.proname = 'uid';
          SELECT 'AUTH_ROLE=' || CASE WHEN count(*) = 0 THEN 'FAIL' ELSE 'ok' END
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
           WHERE n.nspname = 'auth' AND p.proname = 'role';
          SELECT 'ROLE_' || upper(r.want) || '=' ||
                 CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r.want) THEN 'ok' ELSE 'FAIL' END
            FROM (VALUES ('anon'),('authenticated'),('service_role')) AS r(want);
          SQL
          psql "$(cat /tmp/db-url)" -v ON_ERROR_STOP=1 -Xf /tmp/managed.sql | tee /tmp/managed.out
          if grep -q '=FAIL' /tmp/managed.out; then
            echo "::error::Supabase가 관리하는 스키마·함수·역할이 없습니다 — 이것은 공식 스택이 아닙니다"
            exit 1
          fi

      - name: 재생 결과가 정본과 같은가 (kill-switch · jobs · legacy 미실행)
        run: |
          set -euo pipefail
          cat > /tmp/postcondition.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned

          -- kill-switch: 001이 만드는 표 다섯
          SELECT 'KS_TABLE_' || t.want || '=' ||
                 CASE WHEN to_regclass('public.' || t.want) IS NULL THEN 'FAIL' ELSE 'ok' END
            FROM (VALUES ('kill_switch_state'),('kill_switch_log'),('telegram_alert_log'),
                         ('worker_heartbeat'),('worker_lock')) AS t(want);

          -- 001이 만드는 인덱스 둘
          SELECT 'KS_INDEX_' || i.want || '=' ||
                 CASE WHEN EXISTS (SELECT 1 FROM pg_indexes
                                    WHERE schemaname='public' AND indexname = i.want)
                      THEN 'ok' ELSE 'FAIL' END
            FROM (VALUES ('idx_kill_switch_conn'),('idx_tg_dedup')) AS i(want);

          -- 001의 소유자 정책 둘 + 022의 service 정책 넷
          SELECT 'POLICY_' || p.want || '=' ||
                 CASE WHEN EXISTS (SELECT 1 FROM pg_policies
                                    WHERE schemaname='public' AND policyname = p.want)
                      THEN 'ok' ELSE 'FAIL' END
            FROM (VALUES ('ks_state_owner'),('ks_log_owner'),
                         ('kill_switch_log_service'),('telegram_alert_log_service'),
                         ('worker_heartbeat_service'),('worker_lock_service')) AS p(want);

          -- 022가 표 없음으로 건너뛰면 여기가 FAIL이 된다.
          SELECT 'KS_RLS_' || c.relname || '=' ||
                 CASE WHEN c.relrowsecurity AND NOT c.relforcerowsecurity THEN 'ok' ELSE 'FAIL' END
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
           WHERE n.nspname = 'public'
             AND c.relname IN ('kill_switch_state','kill_switch_log','telegram_alert_log',
                               'worker_heartbeat','worker_lock');

          -- jobs: 076이 만드는 것
          SELECT 'JOBS_TABLE=' || CASE WHEN to_regclass('public.jobs') IS NULL THEN 'FAIL' ELSE 'ok' END;
          SELECT 'JOBS_COLUMNS=' || CASE WHEN count(*) = 22 THEN 'ok' ELSE 'FAIL(' || count(*) || ')' END
            FROM pg_attribute
           WHERE attrelid = to_regclass('public.jobs') AND attnum > 0 AND NOT attisdropped;
          SELECT 'JOBS_CONSTRAINT_' || c.want || '=' ||
                 CASE WHEN EXISTS (SELECT 1 FROM pg_constraint
                                    WHERE conrelid = to_regclass('public.jobs') AND conname = c.want)
                      THEN 'ok' ELSE 'FAIL' END
            FROM (VALUES ('jobs_pkey'),('jobs_status_chk'),('jobs_action_chk')) AS c(want);
          SELECT 'JOBS_INDEX_' || i.want || '=' ||
                 CASE WHEN EXISTS (SELECT 1 FROM pg_indexes
                                    WHERE schemaname='public' AND tablename='jobs' AND indexname = i.want)
                      THEN 'ok' ELSE 'FAIL' END
            FROM (VALUES ('idx_jobs_pending'),('idx_jobs_conn')) AS i(want);
          SELECT 'JOBS_RLS=' ||
                 CASE WHEN c.relrowsecurity AND NOT c.relforcerowsecurity THEN 'ok' ELSE 'FAIL' END
            FROM pg_class c WHERE c.oid = to_regclass('public.jobs');
          -- 이름이 아니라 뜻으로 본다: SELECT 하나, USING은 본인 행, WITH CHECK 없음.
          SELECT 'JOBS_OWNER_POLICY=' ||
                 CASE WHEN count(*) = 1 THEN 'ok' ELSE 'FAIL' END
            FROM pg_policies
           WHERE schemaname='public' AND tablename='jobs' AND policyname='jobs_owner'
             AND permissive='PERMISSIVE' AND cmd='SELECT'
             AND qual = '(auth.uid() = user_id)' AND with_check IS NULL;
          SELECT 'JOBS_POLICY_COUNT=' || CASE WHEN count(*) = 1 THEN 'ok' ELSE 'FAIL(' || count(*) || ')' END
            FROM pg_policies WHERE schemaname='public' AND tablename='jobs';

          -- 번호 없는 legacy가 끼어들지 않았다는 카나리.
          -- strategy_profiles.sql만 이 표를 만들고,
          -- exchange_connections_rls.sql만 ec_insert 정책을 만든다.
          SELECT 'CANARY_NO_STRATEGY_PROFILES=' ||
                 CASE WHEN to_regclass('public.strategy_profiles') IS NULL THEN 'ok' ELSE 'FAIL' END;
          SELECT 'CANARY_NO_EC_INSERT=' ||
                 CASE WHEN EXISTS (SELECT 1 FROM pg_policies
                                    WHERE schemaname='public' AND policyname='ec_insert')
                      THEN 'FAIL' ELSE 'ok' END;
          SQL
          psql "$(cat /tmp/db-url)" -v ON_ERROR_STOP=1 -Xf /tmp/postcondition.sql | tee /tmp/postcondition.out
          if grep -q '=FAIL' /tmp/postcondition.out; then
            echo "::error::재생은 끝났지만 정본과 다릅니다 — 위에서 FAIL인 줄을 보세요"
            exit 1
          fi
          n_ok="$(grep -c '=ok$' /tmp/postcondition.out)"
          echo "확인 ${n_ok}건 전부 통과"

      # 제약이 파일에 **적혀 있는가**는 scripts/check-paper-challenge-core.mjs가
      # 본다. 그런데 이 저장소에서 가장 자주 난 사고는 "실행은 성공했는데
      # 생기지 않았다"였다 — `DO $$ ... IF NOT EXISTS` 블록이 조용히 건너뛰거나,
      # CHECK 식이 NULL을 만나 늘 참이 되거나.
      #
      # 그래서 여기서는 **실제로 위반하는 문장을 넣어 보고 거부당하는지** 본다.
      # 틀린 이유(오타로 인한 42703 같은)로 실패한 것은 통과로 적지 않는다 —
      # 시험 파일이 기대 SQLSTATE까지 맞춘다. 반드시 통과해야 하는 경우도
      # 함께 넣어서 "전부 거부하는 제약"이 만점을 받지 못하게 한다.
      #
      # 전부 한 트랜잭션 안에서 하고 ROLLBACK한다 — 한 줄도 남기지 않는다.
      - name: 제약이 정말로 거부하는가 (083 챌린지 코어)
        run: |
          set -euo pipefail
          psql "$(cat /tmp/db-url)" -v ON_ERROR_STOP=1 \
            -Xf scripts/sql/083_paper_challenge_core_constraints.sql \
            > /tmp/constraints.out 2>&1 || {
              echo "::error::제약 시험이 실패했습니다 — 아래에서 FAIL인 줄을 보세요"
              cat /tmp/constraints.out
              exit 1
            }
          cat /tmp/constraints.out
          # 0건을 통과로 적지 않는다. 파일이 통째로 건너뛰어도 psql은 0으로 끝난다.
          n_ok="$(grep -c 'ok  ' /tmp/constraints.out || true)"
          echo "제약 확인 ${n_ok}건"
          if [ "${n_ok}" -lt 30 ]; then
            echo "::error::제약 확인이 ${n_ok}건뿐입니다 — 시험이 실제로 돌지 않았습니다"
            exit 1
          fi
          if ! grep -q '제약 시험 전부 통과' /tmp/constraints.out; then
            echo "::error::제약 시험이 끝까지 가지 못했습니다"
            exit 1
          fi

      # ── 만들어졌다와 돌아간다는 다른 사실이다 ──
      #
      # `075`의 paper_open_position은 실행할 때마다 42702로 터졌다. 그런데 모든
      # 검사가 초록이었다: plpgsql은 질의를 **실행할 때** 계획하므로 CREATE는
      # 성공하고, 재생도 성공하고, 모양 검사도 통과한다. 이 저장소의 검사기는
      # 전부 SQL 파일의 **글자**를 읽는다 — 함수를 부르는 자리가 0곳이었다.
      #
      # 그래서 여기서 **실제로 호출한다.** 다른 답이 나와야 하는 경우
      # (DUPLICATE · INSUFFICIENT_MARGIN · NO_ACCOUNT)도 함께 봐서, 무엇이든
      # OPENED를 돌려주는 함수가 만점을 받지 못하게 한다.
      - name: RPC가 실제로 돌아가는가 (모의투자 실행 연기)
        run: |
          set -euo pipefail
          psql "$(cat /tmp/db-url)" -v ON_ERROR_STOP=1 \
            -Xf scripts/sql/paper_rpc_runtime_smoke.sql \
            > /tmp/rpc-smoke.out 2>&1 || {
              echo "::error::모의투자 RPC가 실행되지 않습니다 — 아래에서 FAIL/ERROR 줄을 보세요"
              cat /tmp/rpc-smoke.out
              exit 1
            }
          cat /tmp/rpc-smoke.out
          # 0건을 통과로 적지 않는다. 파일이 통째로 건너뛰어도 psql은 0으로 끝난다.
          n_ok="$(grep -c 'ok  ' /tmp/rpc-smoke.out || true)"
          echo "RPC 실행 확인 ${n_ok}건"
          if [ "${n_ok}" -lt 15 ]; then
            echo "::error::RPC 확인이 ${n_ok}건뿐입니다 — 연기가 실제로 돌지 않았습니다"
            exit 1
          fi
          if ! grep -q 'RPC 실행 연기 전부 통과' /tmp/rpc-smoke.out; then
            echo "::error::연기가 끝까지 가지 못했습니다"
            exit 1
          fi

      - name: 챌린지 회계가 실제로 돌아가는가 (085 실행 증명)
        run: |
          set -euo pipefail
          psql "$(cat /tmp/db-url)" -v ON_ERROR_STOP=1 \
            -Xf scripts/sql/085_paper_challenge_accounting_proof.sql \
            > /tmp/ch-proof.out 2>&1 || {
              echo "::error::챌린지 회계가 계약대로 돌지 않습니다 — 아래 FAIL/ERROR 줄을 보세요"
              cat /tmp/ch-proof.out
              exit 1
            }
          cat /tmp/ch-proof.out
          # 0건을 통과로 적지 않는다. 파일이 통째로 건너뛰어도 psql은 0으로 끝난다.
          n_ok="$(grep -c 'ok  ' /tmp/ch-proof.out || true)"
          echo "챌린지 회계 확인 ${n_ok}건"
          if [ "${n_ok}" -lt 50 ]; then
            echo "::error::회계 확인이 ${n_ok}건뿐입니다 — 증명이 실제로 돌지 않았습니다"
            exit 1
          fi
          if ! grep -q '챌린지 회계 실행 증명 전부 통과' /tmp/ch-proof.out; then
            echo "::error::증명이 끝까지 가지 못했습니다"
            exit 1
          fi
          {
            echo "### 챌린지 회계 실행 증명"
            echo ""
            echo "확인 ${n_ok}건 통과 (불변식 SUM(원장)=잔고 포함)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 동시에 일어나는 일을 동시에 일으켜서 본다 (085 동시성)
        run: |
          set -euo pipefail
          # 포트·비밀번호를 박지 않는다 — CLI가 알려 준 URL을 그대로 넘긴다.
          PAPER_DB_URL="$(cat /tmp/db-url)"
          export PAPER_DB_URL
          bash scripts/paper-challenge-concurrency.sh > /tmp/ch-conc.out 2>&1 || {
            echo "::error::동시성 계약이 지켜지지 않습니다 — 아래 FAIL 줄을 보세요"
            cat /tmp/ch-conc.out
            exit 1
          }
          cat /tmp/ch-conc.out
          n_ok="$(grep -c '^ok  ' /tmp/ch-conc.out || true)"
          if [ "${n_ok}" -lt 14 ]; then
            echo "::error::동시성 확인이 ${n_ok}건뿐입니다"
            exit 1
          fi
          # **출발선에 정말 모였는지**까지 본다. 겹치지 않은 채 통과한 적이 있다.
          if ! grep -q '출발선에 8명이 동시에 모였다' /tmp/ch-conc.out; then
            echo "::error::동시 생성이 실제로 겹치지 않았습니다 — 경합을 만들지 못한 통과입니다"
            exit 1
          fi
          {
            echo "### 챌린지 회계 동시성"
            echo ""
            echo "확인 ${n_ok}건 통과 (동시 생성 출발선 · 선점 실패 · 교착 0건)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 검사가 무엇을 지키는지 망가뜨려 본다 (085 뮤테이션)
        run: |
          set -euo pipefail
          PAPER_DB_URL="$(cat /tmp/db-url)"
          export PAPER_DB_URL
          node scripts/paper-challenge-mutations.mjs > /tmp/ch-mut.out 2>&1 || {
            echo "::error::규칙을 깨뜨렸는데 검사가 초록입니다 — 그 규칙은 아무도 지키지 않습니다"
            cat /tmp/ch-mut.out
            exit 1
          }
          cat /tmp/ch-mut.out
          n_red="$(grep -c '^      RED' /tmp/ch-mut.out || true)"
          if [ "${n_red}" -lt 19 ]; then
            echo "::error::RED로 확인된 뮤테이션이 ${n_red}건뿐입니다"
            exit 1
          fi
          {
            echo "### 뮤테이션"
            echo ""
            echo "${n_red}건 전부 RED · 주석만 바꾼 대조군 GREEN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 생명주기가 실제로 끝까지 닫히는가 (086 실행 증명)
        run: |
          set -euo pipefail
          psql "$(cat /tmp/db-url)" -v ON_ERROR_STOP=1 \
            -Xf scripts/sql/086_paper_challenge_finalizer_proof.sql \
            > /tmp/fin-proof.out 2>&1 || {
              echo "::error::생명주기가 계약대로 닫히지 않습니다 — 아래 FAIL/ERROR 줄을 보세요"
              cat /tmp/fin-proof.out
              exit 1
            }
          cat /tmp/fin-proof.out
          # 0건을 통과로 적지 않는다. 파일이 통째로 건너뛰어도 psql은 0으로 끝난다.
          n_ok="$(grep -c 'ok  ' /tmp/fin-proof.out || true)"
          if [ "${n_ok}" -lt 45 ]; then
            echo "::error::생명주기 확인이 ${n_ok}건뿐입니다 — 증명이 실제로 돌지 않았습니다"
            exit 1
          fi
          # **거부만 확인하는 증명은 만점을 받는다.** 중재 부등식과 진입 계약이
          # 실제로 확인됐는지 문구로 붙든다.
          for need in '어느 순간에도 둘 다 참이 아니다' \
                      'READY에서는 진입이 막힌다' \
                      'RUNNING에서는 진입이 열린다' \
                      '일반 계좌는 신선도에 걸리지 않는다' \
                      '포지션 0 + 원장 일치' \
                      '챌린지 생명주기 실행 증명 전부 통과'; do
            if ! grep -q "${need}" /tmp/fin-proof.out; then
              echo "::error::증명에 이 확인이 없습니다: ${need}"
              exit 1
            fi
          done
          {
            echo "### 챌린지 생명주기 실행 증명"
            echo ""
            echo "확인 ${n_ok}건 통과 (중재 부등식 · RUNNING only 진입 · 마감 계약)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 마감을 동시에 두 번 해 본다 (086 동시성)
        run: |
          set -euo pipefail
          PAPER_DB_URL="$(cat /tmp/db-url)"
          export PAPER_DB_URL
          bash scripts/paper-challenge-finalizer-concurrency.sh > /tmp/fin-conc.out 2>&1 || {
            echo "::error::마감 동시성 계약이 지켜지지 않습니다 — 아래 FAIL 줄을 보세요"
            cat /tmp/fin-conc.out
            exit 1
          }
          cat /tmp/fin-conc.out
          n_ok="$(grep -c '^ok  ' /tmp/fin-conc.out || true)"
          if [ "${n_ok}" -lt 18 ]; then
            echo "::error::마감 동시성 확인이 ${n_ok}건뿐입니다"
            exit 1
          fi
          # **출발선에 정말 모였는지**까지 본다. 겹치지 않은 채 통과한 적이 있다.
          if [ "$(grep -c '둘이 출발선에 모였다' /tmp/fin-conc.out || true)" -lt 3 ]; then
            echo "::error::세 판이 실제로 겹치지 않았습니다 — 경합을 만들지 못한 통과입니다"
            exit 1
          fi
          {
            echo "### 챌린지 마감 동시성"
            echo ""
            echo "확인 ${n_ok}건 통과 (이중 마감 0 · 부분 마감 0 · 교착 0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 마감 규칙을 하나씩 빼 본다 (086 뮤테이션)
        run: |
          set -euo pipefail
          PAPER_DB_URL="$(cat /tmp/db-url)"
          export PAPER_DB_URL
          node scripts/paper-challenge-finalizer-mutations.mjs > /tmp/fin-mut.out 2>&1 || {
            echo "::error::규칙을 깼는데 검사가 초록입니다 — 그 규칙은 아무도 지키지 않습니다"
            cat /tmp/fin-mut.out
            exit 1
          }
          cat /tmp/fin-mut.out
          n_red="$(grep -c '      RED' /tmp/fin-mut.out || true)"
          if [ "${n_red}" -lt 15 ]; then
            echo "::error::RED로 확인된 뮤테이션이 ${n_red}건뿐입니다"
            exit 1
          fi
          {
            echo "### 챌린지 마감 뮤테이션"
            echo ""
            echo "${n_red}건 전부 RED · 주석만 바꾼 대조군 GREEN"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 취소 (087) ──
      #
      # 취소는 겉보기에 상태 한 칸이라 "시험까지는" 하고 넘어가기 쉽다. 그런데
      # 이 한 칸이 틀리면 **달성한 챌린지가 취소로 기록되고**, 남의 챌린지가
      # 닫히고, 취소가 직접 정산해서 회계 권위가 둘이 된다. 그래서 글자로
      # 읽지 않고 불러 본다.
      - name: 취소가 돈을 만들지 않는가 (087 실행 증명)
        run: |
          set -euo pipefail
          psql "$(cat /tmp/db-url)" -v ON_ERROR_STOP=1 \
            -Xf scripts/sql/087_paper_challenge_cancel_proof.sql \
            > /tmp/cancel-proof.out 2>&1 || {
              echo "::error::취소가 계약대로 동작하지 않습니다 — 아래 FAIL/ERROR 줄을 보세요"
              cat /tmp/cancel-proof.out
              exit 1
            }
          cat /tmp/cancel-proof.out
          # 0건을 통과로 적지 않는다. 파일이 통째로 건너뛰어도 psql은 0으로 끝난다.
          n_ok="$(grep -c 'ok  ' /tmp/cancel-proof.out || true)"
          if [ "${n_ok}" -lt 38 ]; then
            echo "::error::취소 확인이 ${n_ok}건뿐입니다 — 증명이 실제로 돌지 않았습니다"
            exit 1
          fi
          # **거부만 확인하는 증명은 만점을 받는다.** 핵심 계약을 문구로 붙든다.
          for need in '잔고 변화 0 — 취소는 돈을 만들지 않는다' \
                      '열린 포지션 그대로 — 취소가 청산하지 않는다' \
                      '달성이 먼저면 취소가 진다' \
                      '남의 챌린지는 NOT_FOUND다' \
                      '없는 챌린지도 같은 NOT_FOUND다' \
                      '전이 로그가 두 줄이 되지 않는다' \
                      '최종 상태는 동결된 CANCELLED의 복사다' \
                      '일반 모의 주문은 지금까지처럼 열린다' \
                      '챌린지 취소 실행 증명 전부 통과'; do
            if ! grep -q "${need}" /tmp/cancel-proof.out; then
              echo "::error::증명에 이 확인이 없습니다: ${need}"
              exit 1
            fi
          done
          {
            echo "### 챌린지 취소 실행 증명"
            echo ""
            echo "확인 ${n_ok}건 통과 (돈 불변 · 사유 동결 · 소유권 · 멱등)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 취소 규칙을 하나씩 빼 본다 (087 뮤테이션)
        run: |
          set -euo pipefail
          PAPER_DB_URL="$(cat /tmp/db-url)"
          export PAPER_DB_URL
          node scripts/paper-challenge-cancel-mutations.mjs > /tmp/cancel-mut.out 2>&1 || {
            echo "::error::규칙을 깼는데 검사가 초록입니다 — 그 규칙은 아무도 지키지 않습니다"
            cat /tmp/cancel-mut.out
            exit 1
          }
          cat /tmp/cancel-mut.out
          n_red="$(grep -c '      RED' /tmp/cancel-mut.out || true)"
          if [ "${n_red}" -lt 13 ]; then
            echo "::error::RED로 확인된 뮤테이션이 ${n_red}건뿐입니다"
            exit 1
          fi
          {
            echo "### 챌린지 취소 뮤테이션"
            echo ""
            echo "${n_red}건 전부 RED · 주석만 바꾼 대조군 GREEN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 위험 마이그레이션 승인 경로가 무엇을 막는가 (실행 증명)
        run: |
          set -euo pipefail
          # 이 증명은 같은 서버 안에 **전용 DB를 만들어** 그 안에서만 돈다.
          # 아래 URL은 본 DB를 가리키지만, 러너는 서버 주소만 쓰고 DB 이름은
          # 갈아 끼운다. 본 DB는 지문을 읽는 것 말고는 건드리지 않는다.
          PROOF_DB_URL="$(cat /tmp/db-url)"
          export PROOF_DB_URL
          node scripts/approval-path-proof.mjs > /tmp/ap-proof.out 2>&1 || {
            echo "::error::승인 경로가 계약대로 막거나 통과시키지 않습니다 — 아래 FAIL 줄을 보세요"
            cat /tmp/ap-proof.out
            exit 1
          }
          cat /tmp/ap-proof.out
          n_ok="$(grep -c '^ok  ' /tmp/ap-proof.out || true)"
          if [ "${n_ok}" -lt 40 ]; then
            echo "::error::승인 경로 확인이 ${n_ok}건뿐입니다"
            exit 1
          fi
          # **거부만 확인하는 증명은 만점을 준다.** 실제로 통과한 자리도 있었는지 본다.
          if ! grep -q '★ 정확한 승인이면 085가 적용된다' /tmp/ap-proof.out; then
            echo "::error::승인이 실제로 통과하는 경우를 확인하지 못했습니다"
            exit 1
          fi
          if ! grep -q '★ 승인하지 않은 085는 그대로 막혀 있다' /tmp/ap-proof.out; then
            echo "::error::승인 범위가 하나로 묶이는지 확인하지 못했습니다"
            exit 1
          fi
          # **본 DB를 건드리지 않았다는 것까지 확인한다.** 이 증명은 DB를 만들고
          # 지우므로, 격리가 깨지면 재생 검사 결과가 조용히 오염된다.
          for need in '전용 DB 생성' '본 DB 지문이 증명 전과 같다' '전용 DB 정리 완료'; do
            if ! grep -q "${need}" /tmp/ap-proof.out; then
              echo "::error::격리 증거가 없습니다: ${need}"
              exit 1
            fi
          done
          {
            echo "### 위험 마이그레이션 승인 경로"
            echo ""
            echo "확인 ${n_ok}건 통과 (전용 DB 격리 · 거부 12종 · 순서 건너뛰기 차단 · 승인 1건만 통과 · 본 DB 비간섭)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 요약
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 공식 Supabase 번호-only 재생"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| CLI | 2.116.0 (고정) |"
            echo "| 번호 마이그레이션 | ${{ steps.expected.outputs.count }}개 |"
            echo "| 결과 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/rpc-smoke.out ]; then
            {
              echo ""
              echo "<details><summary>RPC 실행 연기 (모의투자)</summary>"
              echo ""
              echo '```'
              grep -E 'ok  |FAIL|ERROR|전부 통과' /tmp/rpc-smoke.out || true
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/constraints.out ]; then
            {
              echo ""
              echo "<details><summary>제약 시험 (083 챌린지 코어)</summary>"
              echo ""
              echo '```'
              grep -E 'ok  |FAIL|전부 통과' /tmp/constraints.out || true
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/postcondition.out ]; then
            {
              echo ""
              echo "<details><summary>재생 후 확인</summary>"
              echo ""
              echo '```'
              cat /tmp/postcondition.out
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 정리가 실패해도 원래 실패를 덮지 않는다. 여기서 exit 1을 내면
      # "재생이 실패했다"가 "정리가 실패했다"로 바뀌어 보고된다.
      - name: 로컬 스택 정리
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup

  # 17분짜리 스윕 하나만 있는 job. 재생 본체와 **동시에** 돈다.
  approval-mutations:
    name: 승인 검사를 하나씩 빼 본다 (승인 경로 뮤테이션)
    runs-on: ubuntu-latest
    # 스윕이 17분, 준비가 2분 30초다. 재생 본체와 같은 25분을 주면 여유가
    # 5분뿐이라 나누는 의미가 없다. 이 job에는 이 스윕 하나뿐이므로
    # 넉넉히 두어도 다른 검사의 시간을 뺏지 않는다.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.2.2

      - name: 공식 Supabase 로컬 스택 (준비는 한 곳에만 있다)
        uses: ./.github/actions/supabase-local

      - name: 승인 검사를 하나씩 빼 본다 (승인 경로 뮤테이션)
        run: |
          set -euo pipefail
          PROOF_DB_URL="$(cat /tmp/db-url)"
          export PROOF_DB_URL
          node scripts/approval-path-mutations.mjs > /tmp/ap-mut.out 2>&1 || {
            echo "::error::승인 검사를 뺐는데 증명이 초록입니다 — 그 검사는 아무 일도 하지 않습니다"
            cat /tmp/ap-mut.out
            exit 1
          }
          cat /tmp/ap-mut.out
          n_red="$(grep -c '^      RED' /tmp/ap-mut.out || true)"
          if [ "${n_red}" -lt 10 ]; then
            echo "::error::RED로 확인된 뮤테이션이 ${n_red}건뿐입니다"
            exit 1
          fi
          {
            echo "### 승인 경로 뮤테이션"
            echo ""
            echo "${n_red}건 전부 RED · 주석만 바꾼 대조군 GREEN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 요약
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 승인 경로 뮤테이션 (별도 job)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| CLI | 2.116.0 (고정) |"
            echo "| 전용 DB | 이 job 안에서만 생성·정리 |"
            echo "| 결과 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 정리가 실패해도 원래 실패를 덮지 않는다. 여기서 exit 1을 내면
      # "재생이 실패했다"가 "정리가 실패했다"로 바뀌어 보고된다.
      - name: 로컬 스택 정리
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup

  # ══════════════════════════════════════════════════════════════════
  #  최종 판정 — **이름이 예전 그대로다**
  # ══════════════════════════════════════════════════════════════════
  #
  # 브랜치 보호가 물고 있을 수 있는 이름을 여기서 그대로 이어받는다.
  # 둘 다 success일 때만 0으로 끝난다. **cancelled·skipped를 통과로 읽지
  # 않는다** — 시간 초과로 잘린 것이 바로 cancelled였고, 그것을 초록으로
  # 적었다면 이 PR의 출발점인 그 실패가 보이지 않았다.
  gate:
    name: 번호 마이그레이션만으로 빈 DB 재생 (공식 Supabase 로컬)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [replay-core, approval-mutations]
    if: always()

    steps:
      - name: 두 job이 모두 통과했는가
        env:
          CORE: ${{ needs.replay-core.result }}
          MUT: ${{ needs.approval-mutations.result }}
        run: |
          set -euo pipefail
          echo "재생 본체: ${CORE}"
          echo "승인 경로 뮤테이션: ${MUT}"
          rc=0
          for pair in "재생 본체:${CORE}" "승인 경로 뮤테이션:${MUT}"; do
            name="${pair%%:*}"; result="${pair##*:}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name}가 success가 아닙니다 (${result}) — 통과로 적지 않습니다"
              rc=1
            fi
          done
          {
            echo "## 재생 최종 판정"
            echo ""
            echo "| job | 결과 |"
            echo "|---|---|"
            echo "| 재생 본체 | ${CORE} |"
            echo "| 승인 경로 뮤테이션 | ${MUT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${rc}"
