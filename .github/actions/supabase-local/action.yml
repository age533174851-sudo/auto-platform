# 공식 Supabase 로컬 스택을 세우는 공통 준비.
#
# **왜 파일로 뺐나**
# ─────────────────
# `supabase-replay`가 job 둘로 나뉘었다(재생 본체 / 승인 경로 뮤테이션).
# 둘 다 같은 준비가 필요한데, 그 준비를 양쪽 YAML에 복사해 두면 이 저장소가
# 두 번 당한 고장이 그대로 재현된다 — **"경로가 둘인데 한쪽만 고침".**
# CLI 버전을 올리면서 한쪽만 고치는 날, 두 job은 서로 다른 스택에서 통과한다.
#
# 그래서 준비는 여기 하나뿐이고, job은 이것을 부르기만 한다. 단계의 내용은
# 나누기 전과 한 줄도 다르지 않다 — 자리만 옮겼다.
#
# checkout은 여기서 하지 않는다. 부르는 쪽이 이미 했고, 여기서 또 하면
# 어느 커밋을 검사하는지가 두 곳에서 정해진다.
name: supabase-local
description: 공식 Supabase 로컬 스택을 띄우고 빈 DB에서 번호 마이그레이션만으로 다시 세운다

outputs:
  db-url-file:
    description: DB 접속 문자열이 적힌 파일 경로 (**값 자체는 출력하지 않는다**)
    value: /tmp/db-url

runs:
  using: composite
  steps:
    # 재생 자체는 CLI와 psql만으로 돌지만, 승인 경로 증명은
    # `scripts/apply-migrations.mjs`를 **실제로 실행한다.** 그 러너는
    # 분류 로직을 복제하지 않고 `loadPlan()`으로 `migrationPlan.ts`를
    # 저장소의 tsc로 컴파일해서 쓴다 — 그래서 node_modules가 필요하다.
    # 없으면 증명이 계약에 닿기도 전에 죽는다.
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    # `npm install`은 잠금 파일을 고친다. 그러면 이 워크플로가 ci.yml과
    # 다른 의존성으로 통과할 수 있다.
    - name: 의존성 설치
      shell: bash
      run: npm ci

    # 움직이는 태그를 쓰지 않는다. 태그는 다시 가리킬 수 있고, 그러면
    # "어제 통과한 것과 같은 것을 돌렸다"고 말할 수 없다.
    - name: 공식 Supabase CLI 설치 (버전 고정)
      uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520  # v3.0.0
      with:
        version: 2.116.0

    - name: CLI·Docker 확인
      shell: bash
      run: |
        set -euo pipefail
        got="$(supabase --version)"
        echo "supabase CLI: ${got}"
        if [ "${got}" != "2.116.0" ]; then
          echo "::error::CLI 버전이 고정값과 다릅니다 — 기대 2.116.0 / 실제 ${got}"
          exit 1
        fi
        docker version --format '{{.Server.Version}}'

    # config.toml은 저장소에 두지 않는다. 아직 두어야 할 이유가 증명되지
    # 않았고, 두는 순간 "로컬 스택 설정"이라는 관리 대상이 하나 더 생긴다.
    # 없을 때만 만든다. --force는 쓰지 않는다 — 있는 설정을 덮어쓰는 일은
    # 이 워크플로가 할 일이 아니다.
    - name: config가 없으면 만든다
      shell: bash
      run: |
        set -euo pipefail
        if [ -f supabase/config.toml ]; then
          echo "supabase/config.toml 있음 — 저장소 설정을 그대로 씁니다"
        else
          echo "supabase/config.toml 없음 — 이 실행에서만 쓸 기본 설정을 만듭니다"
          supabase init
        fi

    - name: 공식 로컬 스택 시작
      shell: bash
      run: |
        set -euo pipefail
        supabase start

    # 여기가 본 계약이다. 빈 DB를 만들고 저장소의 번호 마이그레이션만으로
    # 처음부터 다시 세운다. seed는 쓰지 않는다 — 업무 데이터가 섞이면
    # "스키마가 선다"와 "데이터가 있다"가 뒤엉킨다.
    - name: 빈 DB에서 다시 세우기 (supabase db reset --no-seed)
      shell: bash
      run: |
        set -euo pipefail
        supabase db reset --local --no-seed

    - name: 로컬 DB 주소 확인
      shell: bash
      run: |
        set -euo pipefail
        # 포트·비밀번호를 코드에 박지 않는다. CLI가 알려 주는 값을 쓴다.
        supabase status -o env > /tmp/supabase-status.env
        # shellcheck disable=SC1091
        set +u
        . /tmp/supabase-status.env
        set -u
        if [ -z "${DB_URL:-}" ]; then
          echo "::error::supabase status에서 DB_URL을 얻지 못했습니다 — 확인하지 못한 것을 통과로 적지 않습니다"
          exit 1
        fi
        # 값은 출력하지 않는다. 로컬 개발용이어도 습관을 깨지 않는다.
        echo "DB_URL 확보 (값은 출력하지 않습니다)"
        printf '%s\n' "${DB_URL}" > /tmp/db-url
