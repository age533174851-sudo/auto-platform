# fly.toml — TRAIGO Worker
#
# **웹이 아니다.** TRAIGO 웹/API는 Vercel에서 계속 돌고, Fly에는
# 24시간 자동매매 Runtime Worker만 올린다.
#
# Fly launch가 처음 만든 설정은 Next.js 웹앱용이었다. 그대로 두면
# 세 가지가 잘못된다:
#
#   primary_region = 'iad'        미국 버지니아 — 거래소까지 멀다
#   [http_service]                요청을 기다리는 서버로 취급된다
#   auto_stop_machines = 'stop'   요청이 없으면 Machine을 멈춘다
#   min_machines_running = 0      즉 평소에는 0대가 정상이 된다
#   CMD npm run start             Next.js 웹서버를 띄운다
#
# 마지막 둘이 특히 치명적이다. 요청이 없을 때 멈추면 "브라우저를 닫아도
# 자동매매가 계속된다"가 그 순간 깨진다 — 그리고 손절 감시도 같이 멈춘다.

app = 'auto-platform'

# Tokyo. Fly에 서울 리전은 없고, 한국에서 Gate/Binance까지의 지연을
# 보면 Tokyo가 가장 가깝다.
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

# ── HTTP 서비스를 두지 않는다 ──
#
# 이건 요청을 받는 서버가 아니라 스스로 도는 프로세스다. [http_service]를
# 두면 Fly가 요청 유무로 Machine을 켜고 끄는데, 이 Worker는 요청을 받지
# 않으므로 영원히 꺼진 상태가 정상이 된다.
#
# 건강 상태는 HTTP가 아니라 DB로 알린다 — Worker가 worker_heartbeat 표에
# 심장박동을 찍고, 화면은 그 값을 보고서만 "실행 중"이라고 적는다.
# HTTP 200을 건강으로 삼으면 "응답은 하는데 아무것도 안 도는" 상태를
# 정상으로 읽는다.

[processes]
  worker = 'npm start --prefix worker'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['worker']

# **항상 켜져 있어야 한다.** 이 한 줄이 이 앱의 존재 이유다 —
# 멈추면 자동매매도, 예약 청산도, 손절 감시도 같이 멈춘다.
[[restart]]
  policy = 'always'
