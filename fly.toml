# fly.toml — TRAIGO Worker
#
# 웹(Vercel)과 분리된 24시간 실행기다. 이 파일은 껍데기 설정일 뿐이고,
# 실행 규칙은 src/lib/runtime/workerPlan.ts에 있다 — 그 파일은 Fly를 모른다.
# 나중에 Railway나 Cloud Run으로 옮길 때 이 파일만 버리면 된다.

app = "traigo-worker"

# Tokyo. Fly에 서울 리전은 없고, 한국에서 거래소(Gate/Binance)까지의
# 지연을 보면 Tokyo가 가장 가깝다.
primary_region = "nrt"

[build]
  dockerfile = "worker/Dockerfile"

[env]
  NODE_ENV = "production"

# ── HTTP 서비스를 두지 않는다 ──
#
# 이건 요청을 받는 서버가 아니라 스스로 도는 프로세스다. HTTP 서비스를
# 붙이면 Fly가 요청이 없을 때 Machine을 멈출 수 있고(auto_stop),
# 그러면 "브라우저를 닫아도 돈다"가 깨진다.
[processes]
  worker = "node worker/main.mjs"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

# 자동으로 멈추지 않게 한다. 이 한 줄이 이 앱의 전부다 —
# 멈추면 자동매매도 손절 감시도 같이 멈춘다.
[[restart]]
  policy = "always"
